    <script>
      AFRAME.registerComponent("local-texture-sky", {
        schema: { src: { type: "string", default: "" } },
        init: function () {
          this._texture = null;
          this.refreshSky = this.refreshSky.bind(this);
          this.el.sceneEl.addEventListener("loaded", this.refreshSky);
          if (this.el.sceneEl.hasLoaded) this.refreshSky();
        },
        update: function () { this.refreshSky(); },
        remove: function () { if (this._texture) this._texture.dispose(); },
        resolveSrc: function () {
          var src = (this.data.src || "").trim();
          if (!src) return "";
          if (src.charAt(0) !== "#") return src;
          var asset = document.querySelector(src);
          if (!asset) return "";
          return asset.getAttribute("src") || asset.src || "";
        },
        refreshSky: function () {
          var self = this;
          var src = (this.data.src || "").trim();
          var url = this.resolveSrc();
          if (!url) url = "./assets/backgrounds/workshop-panorama.jpg";
          if (src.charAt(0) === "#") {
            var asset = document.querySelector(src);
            if (asset && (!asset.complete || !asset.naturalWidth)) {
              asset.addEventListener("load", function () { self.refreshSky(); });
              return;
            }
          }
          var mesh = this.el.getObject3D("mesh");
          if (!mesh) {
            requestAnimationFrame(function () { self.refreshSky(); });
            return;
          }
          if (this._texture) { this._texture.dispose(); this._texture = null; }
          var loader = new THREE.TextureLoader();
          loader.setCrossOrigin(url.indexOf("http") === 0 ? "anonymous" : undefined);
          loader.load(url, function (texture) {
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.mapping = THREE.EquirectangularReflectionMapping;
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.generateMipmaps = false;
            texture.needsUpdate = true;
            self._texture = texture;
            mesh.material = new THREE.MeshBasicMaterial({
              map: texture, side: THREE.BackSide, fog: false, toneMapped: false,
            });
            mesh.material.needsUpdate = true;
          });
        },
      });
    </script>

        currentStatus = { zh: zh, en: en || zh };
        var statusText = document.querySelector("#statusText");
        if (statusText) statusText.setAttribute("value", currentStatus[currentLanguage]);
      }

      function applyLanguage() {
        var text = uiText[currentLanguage];
        document.documentElement.lang = currentLanguage === "zh" ? "zh-CN" : "en";
        document.querySelector("#langToggle").textContent = text.toggle;
        document.querySelector("#overlayTitle").textContent = text.title;
        document.querySelector("#overlayIntro").textContent = text.intro;
        document.querySelector("#ladleSmallText").setAttribute("value", text.ladleSmall);
        document.querySelector("#targetSmallText").setAttribute("value", text.targetSmall);
        document.querySelector("#statusText").setAttribute("value", currentStatus[currentLanguage]);
        document.querySelector("#languageSwitchText").setAttribute("value", text.toggle);
        document.querySelector("#languageSwitchHint").setAttribute("value", text.languageHint);

        Object.keys(text.labels).forEach(function (id) {
          var label = document.querySelector("#" + id);
          if (!label) return;
          var size = labelCanvasSizes[id] || { width: 2.85, height: 0.66 };
          label.setAttribute(
            "canvas-label",
            "text: " + text.labels[id] + "; width: " + size.width + "; height: " + size.height
          );
        });

        var tempPanel = document.querySelector("#temperaturePanel");
        if (tempPanel) {
          var panelSize = labelCanvasSizes.temperaturePanel;
          var panelText =
            currentLanguage === "en"
              ? "Temperature Control|Hold 1600-1800℃ green zone for 5 sec"
              : "控温融铁|保持 1600-1800℃ 绿色温区 5 秒";
          tempPanel.setAttribute(
            "canvas-label",
            "text: " + panelText + "; width: " + panelSize.width + "; height: " + panelSize.height
          );
        }
        if (window.IronFlowerHomeNav) window.IronFlowerHomeNav.applyLanguage(currentLanguage);
        updateExtractMoltenModalText();

        var copy = uiText[currentLanguage].extractMolten;
        var title = document.querySelector("#extractMoltenTitle");
        var text = document.querySelector("#extractMoltenText");
        var button = document.querySelector("#extractMoltenBtn");
        if (title) title.textContent = copy.title;
        if (text) text.textContent = copy.text;
        if (button) button.textContent = copy.button;
      }

        var modal = document.querySelector("#extractMoltenModal");
        if (!modal || modal.classList.contains("show")) return;

        setStatus("铁水已就绪：点击「取出铁水」完成材料准备", "Molten iron is ready: click Extract Molten Iron to finish preparation");
      }

        var modal = document.querySelector("#extractMoltenModal");
        if (modal) modal.classList.remove("show");
      }

        if (!moltenIronReady) return;

      AFRAME.registerComponent("canvas-label", {
        schema: {
          text: { default: "" },
          width: { default: 2.4 },
          height: { default: 0.58 },
          background: { default: "rgba(18, 10, 4, 0.72)" },
          border: { default: "#ffbd42" },
          color: { default: "#fff4d2" },
        },

        init: function () {
          this.drawLabel();
        },

        update: function () {
          this.drawLabel();
        },

        drawLabel: function () {
          var canvas = document.createElement("canvas");
          var context = canvas.getContext("2d");
          var scale = 3;
          canvas.width = Math.round(720 * scale);
          canvas.height = Math.round(220 * scale);

          context.scale(scale, scale);
          this.roundRect(context, 0, 0, 720, 220, 28, this.data.background, this.data.border);

          var lines = this.data.text.split("|");
          context.textAlign = "center";
          context.textBaseline = "middle";
          context.fillStyle = this.data.color;
          context.font = "700 40px Arial, PingFang SC, Microsoft YaHei, sans-serif";
          context.fillText(lines[0] || "", 360, lines[1] ? 58 : 110, 640);

          if (lines[1]) {
            context.fillStyle = "#ffd37a";
            context.font = "400 26px Arial, PingFang SC, Microsoft YaHei, sans-serif";
            this.wrapText(context, lines[1], 360, 120, 620, 34, 3);
          }

          var texture = new THREE.CanvasTexture(canvas);
          texture.needsUpdate = true;
          texture.minFilter = THREE.LinearFilter;

          if (this.mesh) {
            this.el.object3D.remove(this.mesh);
            this.mesh.geometry.dispose();
            this.mesh.material.map.dispose();
            this.mesh.material.dispose();
          }

          var geometry = new THREE.PlaneGeometry(this.data.width, this.data.height);
          var material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false,
          });

          this.mesh = new THREE.Mesh(geometry, material);
          this.el.object3D.add(this.mesh);
        },

        wrapText: function (context, text, x, y, maxWidth, lineHeight, maxLines) {
          var tokens = text.match(/[\u4e00-\u9fff]|[^\s\u4e00-\u9fff]+/g) || [text];
          var lines = [];
          var line = "";

          tokens.forEach(function (token) {
            var separator = /[\u4e00-\u9fff]/.test(token) ? "" : " ";
            var testLine = line ? line + separator + token : token;

            if (context.measureText(testLine).width > maxWidth && line) {
              lines.push(line);
              line = token;
            } else {
              line = testLine;
            }
          });

          if (line) lines.push(line);

          lines.slice(0, maxLines).forEach(function (lineText, index) {
            var output = lineText;
            if (index === maxLines - 1 && lines.length > maxLines) output = lineText.replace(/\s+$/, "") + "...";
            context.fillText(output, x, y + index * lineHeight, maxWidth);
          });
        },

        roundRect: function (context, x, y, width, height, radius, fill, stroke) {
          context.beginPath();
          context.moveTo(x + radius, y);
          context.lineTo(x + width - radius, y);
          context.quadraticCurveTo(x + width, y, x + width, y + radius);
          context.lineTo(x + width, y + height - radius);
          context.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
          context.lineTo(x + radius, y + height);
          context.quadraticCurveTo(x, y + height, x, y + height - radius);
          context.lineTo(x, y + radius);
          context.quadraticCurveTo(x, y, x + radius, y);
          context.closePath();
          context.fillStyle = fill;
          context.fill();
          context.strokeStyle = stroke;
          context.lineWidth = 4;
          context.stroke();
        },
      });

      AFRAME.registerComponent("pico-thumbstick-move", {
        schema: {
          speed: { default: 1.8 },
          turnSpeed: { default: 90 },
          deadzone: { default: 0.18 },
        },

        init: function () {
          this.move = new THREE.Vector3();
          this.forward = new THREE.Vector3();
          this.right = new THREE.Vector3();
          this.camera = document.querySelector("#mainCamera");
          this.eventInput = { moveX: 0, moveY: 0, turnX: 0, time: 0 };
          this.attachAxisEvents();
        },

        tick: function (time, delta) {
          var gamepadInput = this.readGamepadAxes();
          if (!gamepadInput) return;

          var dt = Math.min(delta / 1000, 0.05);
          var moveX = this.applyDeadzone(gamepadInput.moveX);
          var moveY = this.applyDeadzone(gamepadInput.moveY);
          var turnX = this.applyDeadzone(gamepadInput.turnX);

          if (Math.abs(moveX) > 0 || Math.abs(moveY) > 0) {
            this.moveRig(moveX, moveY, dt);
          }

          if (Math.abs(turnX) > 0) {
            this.el.object3D.rotation.y -= THREE.MathUtils.degToRad(turnX * this.data.turnSpeed * dt);
          }
        },

        readGamepadAxes: function () {
          return this.readWebXRAxes() || this.readNavigatorAxes() || this.readRecentAxisEvent();
        },

        readWebXRAxes: function () {
          var renderer = this.el.sceneEl && this.el.sceneEl.renderer;
          var xr = renderer && renderer.xr;
          var session = xr && xr.getSession ? xr.getSession() : null;
          if (!session || !session.inputSources) return null;

          var leftMove = null;
          var rightMove = null;
          var fallbackMove = null;

          Array.from(session.inputSources).forEach(function (source) {
            if (!source || !source.gamepad || !source.gamepad.axes) return;

            var pair = this.findPrimaryAxisPair(source.gamepad.axes);
            if (!pair) return;

            if (source.handedness === "left") {
              leftMove = pair;
            } else if (source.handedness === "right") {
              rightMove = pair;
            }

            if (!fallbackMove || pair.strength > fallbackMove.strength) {
              fallbackMove = pair;
            }
          }.bind(this));

          if (!leftMove && !rightMove && !fallbackMove) return null;

          var move = leftMove || fallbackMove || rightMove;
          var turnX = leftMove && rightMove ? rightMove.x : 0;

          return {
            moveX: move.x,
            moveY: move.y,
            turnX: turnX,
          };
        },

        readNavigatorAxes: function () {
          var pads = navigator.getGamepads ? navigator.getGamepads() : [];
          var bestMove = null;
          var bestTurn = 0;

          for (var i = 0; i < pads.length; i += 1) {
            var pad = pads[i];
            if (!pad || !pad.axes || pad.axes.length < 2) continue;

            var pair = this.findPrimaryAxisPair(pad.axes);
            if (!pair) continue;

            if (!bestMove || pair.strength > bestMove.strength) {
              bestMove = pair;
            } else if (Math.abs(pair.x) > Math.abs(bestTurn)) {
              bestTurn = pair.x;
            }
          }

          if (!bestMove) return null;

          return {
            moveX: bestMove.x,
            moveY: bestMove.y,
            turnX: bestTurn,
          };
        },

        readRecentAxisEvent: function () {
          if (performance.now() - this.eventInput.time > 350) return null;
          return {
            moveX: this.eventInput.moveX,
            moveY: this.eventInput.moveY,
            turnX: this.eventInput.turnX,
          };
        },

        attachAxisEvents: function () {
          var leftHand = document.querySelector("#leftHand");
          var rightHand = document.querySelector("#rightHand");
          var events = ["axismove", "thumbstickmoved", "trackpadmoved"];

          if (leftHand) {
            events.forEach(function (eventName) {
              leftHand.addEventListener(eventName, function (event) {
                var pair = this.axisPairFromEvent(event);
                if (!pair) return;
                this.eventInput.moveX = pair.x;
                this.eventInput.moveY = pair.y;
                this.eventInput.time = performance.now();
              }.bind(this));
            }.bind(this));
          }

          if (rightHand) {
            events.forEach(function (eventName) {
              rightHand.addEventListener(eventName, function (event) {
                var pair = this.axisPairFromEvent(event);
                if (!pair) return;
                this.eventInput.moveX = pair.x;
                this.eventInput.moveY = pair.y;
                this.eventInput.turnX = 0;
                this.eventInput.time = performance.now();
              }.bind(this));
            }.bind(this));
          }
        },

        axisPairFromEvent: function (event) {
          var detail = event.detail || {};

          if (typeof detail.x === "number" && typeof detail.y === "number") {
            return { x: detail.x, y: detail.y, strength: Math.sqrt(detail.x * detail.x + detail.y * detail.y) };
          }

          if (detail.axis && detail.axis.length >= 2) {
            return this.findPrimaryAxisPair(detail.axis);
          }

          if (detail.axes && detail.axes.length >= 2) {
            return this.findPrimaryAxisPair(detail.axes);
          }

          return null;
        },

        findPrimaryAxisPair: function (axes) {
          if (!axes || axes.length < 2) return null;

          var candidates = [];

          if (axes.length >= 4) {
            candidates.push({ x: axes[2] || 0, y: axes[3] || 0, priority: 2 });
          }

          candidates.push({ x: axes[0] || 0, y: axes[1] || 0, priority: 1 });

          for (var i = 0; i < axes.length - 1; i += 2) {
            candidates.push({ x: axes[i] || 0, y: axes[i + 1] || 0, priority: 0 });
          }

          var best = null;
          candidates.forEach(function (candidate) {
            var strength = Math.sqrt(candidate.x * candidate.x + candidate.y * candidate.y);
            candidate.strength = strength;

            if (strength <= this.data.deadzone) return;
            if (!best || candidate.priority > best.priority || strength > best.strength + 0.12) {
              best = candidate;
            }
          }.bind(this));

          return best;
        },

        findStrongestAxisPair: function (axes) {
          var best = null;

          for (var i = 0; i < axes.length - 1; i += 2) {
            var x = axes[i] || 0;
            var y = axes[i + 1] || 0;
            var strength = Math.sqrt(x * x + y * y);

            if (strength > this.data.deadzone && (!best || strength > best.strength)) {
              best = { x: x, y: y, strength: strength };
            }
          }

          return best;
        },

        applyDeadzone: function (value) {
          if (Math.abs(value) < this.data.deadzone) return 0;
          var sign = value < 0 ? -1 : 1;
          return sign * ((Math.abs(value) - this.data.deadzone) / (1 - this.data.deadzone));
        },

        moveRig: function (moveX, moveY, dt) {
          var yaw = this.getCameraYaw();
          var distance = this.data.speed * dt;
          var forwardAmount = -moveY;
          var rightAmount = -moveX;

          this.forward.set(Math.sin(yaw), 0, Math.cos(yaw));
          this.right.set(Math.cos(yaw), 0, -Math.sin(yaw));
          this.move.copy(this.forward).multiplyScalar(forwardAmount);
          this.move.addScaledVector(this.right, rightAmount);

          if (this.move.lengthSq() > 1) this.move.normalize();
          this.move.multiplyScalar(distance);
          this.el.object3D.position.add(this.move);
        },

        getCameraYaw: function () {
          if (!this.camera) return this.el.object3D.rotation.y;

          var direction = new THREE.Vector3();
          this.camera.object3D.getWorldDirection(direction);
          return Math.atan2(-direction.x, -direction.z);
        },
      });

          var scale = 1 + Math.sin(time / 260) * 0.06;
          this.el.object3D.scale.set(scale, scale, scale);
        },
      });

      AFRAME.registerComponent("heating-progress-loop", {
        tick: function () {
          updateHeatingProgress();
          updateRhythmGame();
        },
      });

      function chooseMaterial(el) {
        if (materialSelectionComplete) {
          setStatus("材料已加入炉中：现在点击炉子开始加热点火", "Materials are in the furnace: click the furnace to start heating and ignition");
          return;
        }

        var data = el.components["material-choice"].data;
        if (!data.correct) {
          el.setAttribute("animation__shake", "property: rotation; to: 0 18 0; dur: 80; dir: alternate; loop: 4");
          setStatus("这个不是本轮必需材料，请选择生铁、铁炭、高岭土、稻草卷", "This is not required now. Choose raw iron, charcoal, clay, and straw rolls");
          return;
        }

        if (selectedMaterials[data.key]) {
          setStatus("这个材料已经选择过了，继续选择剩余材料", "This material is already selected. Continue with the remaining materials");
          return;
        }

        selectedMaterials[data.key] = true;
        el.classList.remove("clickable");
        el.setAttribute("scale", "1.18 1.18 1.18");
        el.setAttribute("material", "emissive: #12d8c8; emissiveIntensity: 0.8");
        flyMaterialToFurnace(el, data.key);
        updateMaterialProgress();

        var count = Object.keys(selectedMaterials).length;
        if (count < 4) {
          setStatus("材料已加入炉中：" + count + "/4", "Material added into furnace: " + count + "/4");
          return;
        }

        materialSelectionComplete = true;
        setStatus("材料已全部入炉，准备进入控温融铁", "All materials are in the furnace. Preparing temperature control");
        if (storyMode && window.IronFlowerStory && window.IronFlowerStory.goToMaterialHeatingBridge) {
          setTimeout(function () {
            window.IronFlowerStory.goToMaterialHeatingBridge();
          }, 650);
          return;
        }
        setTimeout(function () {
          startHeatingFurnace(document.querySelector("#furnace"));
        }, 650);
      }

      function flyMaterialToFurnace(el, key) {
        var root = document.querySelector("#fireworks");
        var from = new THREE.Vector3();
        el.object3D.getWorldPosition(from);

        var material = document.createElement("a-entity");
        material.setAttribute("position", from.x + " " + from.y + " " + from.z);
        material.setAttribute("scale", "1 1 1");

        if (key === "straw") {
          material.setAttribute("geometry", "primitive: cylinder; radius: 0.045; height: 0.42");
          material.setAttribute("rotation", "0 0 90");
          material.setAttribute("material", "color: #c9973d; emissive: #a66710; emissiveIntensity: 0.35");
        } else if (key === "clay") {
          material.setAttribute("geometry", "primitive: cone; radiusBottom: 0.16; radiusTop: 0.05; height: 0.22");
          material.setAttribute("material", "color: #d8b27a");
        } else if (key === "charcoal") {
          material.setAttribute("geometry", "primitive: sphere; radius: 0.13");
          material.setAttribute("material", "color: #1d1915");
        } else {
          material.setAttribute("geometry", "primitive: box; width: 0.24; height: 0.18; depth: 0.2");
          material.setAttribute("material", "color: #8f8a80; metalness: 0.2");
        }

        material.setAttribute("animation__fly", "property: position; to: 0 0.52 -1.38; dur: 620; easing: easeInOutQuad");
        material.setAttribute("animation__shrink", "property: scale; to: 0.18 0.18 0.18; dur: 620; easing: easeInQuad");
        root.appendChild(material);

        setTimeout(function () {
          material.remove();
        }, 680);
      }

      function updateMaterialProgress() {
        var count = Object.keys(selectedMaterials).length;
        for (var i = 1; i <= 4; i += 1) {
          var dot = document.querySelector("#matDot" + i);
          if (!dot) continue;
          var active = i <= count;
          dot.setAttribute("color", active ? "#18d0c4" : "#163a34");
          dot.setAttribute("material", active ? "emissive: #18d0c4; emissiveIntensity: 1.5" : "");
        }
      }

      function prepareMoltenIron() {
        var furnace = document.querySelector("#furnace");

        if (!materialSelectionComplete) {
          setStatus("请先选择材料并加入炉中：生铁、铁炭、高岭土、稻草卷", "First select and add materials into the furnace: raw iron, charcoal, clay, and straw rolls");
          return;
        }

        if (heatingActive) {
          setStatus("炉中正在加热：保持 1600-1800℃ 绿色温区 5 秒", "The furnace is heating: hold 1600-1800℃ green zone for 5 seconds");
          return;
        }

        if (moltenIronReady) {
          setStatus("铁水已经流出：进入表演场，把铁水装入双手工具", "Molten iron has flowed out: enter the performance scene and load it into the tools");
          return;
        }

        furnacePrepared = true;
        startHeatingFurnace(furnace);
      }

      function startHeatingFurnace(furnace) {
        heatingActive = true;
        furnacePrepared = true;
        heatTemperature = heatStart;
        heatHoldTime = 0;
        heatLastTick = performance.now();
        lastHeatingEmber = 0;
        var fill = document.querySelector("#heatingFill");
        var stream = document.querySelector("#moltenStream");
        var readout = document.querySelector("#temperatureReadout");
        var holdReadout = document.querySelector("#heatHoldReadout");
        var state = getHeatState(heatTemperature);

        if (fill) {
          fill.object3D.scale.x = 0.01;
          fill.setAttribute("position", "-0.78 0 0.025");
          fill.setAttribute("color", "#ff9b26");
        }
        if (readout) readout.setAttribute("value", formatTempCelsius(heatTemperature) + "｜" + state.zh);
        if (holdReadout) holdReadout.setAttribute("value", getGreenZoneHoldText(0));
        updateHeatZoneLabels();

        if (stream) stream.setAttribute("visible", "false");
        var materialSelection = document.querySelector("#materialSelection");
        if (materialSelection) materialSelection.setAttribute("visible", "false");
        ["labelMaterials", "materialProgress"].forEach(function (id) {
          var node = document.querySelector("#" + id);
          if (node) node.setAttribute("visible", "false");
        });
        ["bellows", "bellowsHotspot", "labelBellows"].forEach(function (id) {
          var node = document.querySelector("#" + id);
          if (node) node.setAttribute("visible", "true");
        });
        var needle = document.querySelector("#heatNeedle");
        if (needle) needle.setAttribute("position", heatToBarX(heatTemperature) + " 0 0.026");
        addFurnaceGlow(furnace, 2.4, "#ff8a1c");
        createFurnaceFireEmoji(furnace, 2);
        setStatus(
          "控温融铁：绿色温区为 " + heatMin + "-" + heatMax + "℃，点击风箱补温",
          "Temperature control: green zone is " + heatMin + "-" + heatMax + "℃. Pull bellows to add heat"
        );
      }

      function updateHeatingProgress() {
        if (!heatingActive) return;

        var now = performance.now();
        var dt = Math.min((now - heatLastTick) / 1000, 0.08);
        heatLastTick = now;
        heatTemperature = Math.max(heatScaleMin, heatTemperature - heatCoolPerSec * dt);
        if (heatTemperature >= heatMin && heatTemperature <= heatMax) {
          heatHoldTime += dt;
        } else if (heatTemperature > heatMax + 50 || heatTemperature < heatMin - 100) {
          heatHoldTime = Math.max(0, heatHoldTime - 1.5 * dt);
        }

        var progress = heatToProgress(heatTemperature);
        var fill = document.querySelector("#heatingFill");
        var readout = document.querySelector("#temperatureReadout");
        var holdReadout = document.querySelector("#heatHoldReadout");
        var needle = document.querySelector("#heatNeedle");
        var state = getHeatState(heatTemperature);
        var heatColor = heatTemperature > heatMax ? "#ff3b1f" : heatTemperature >= heatMin && heatTemperature <= heatMax ? "#20d482" : "#ff9b26";
        if (fill) {
          fill.object3D.scale.x = Math.max(0.01, progress);
          fill.setAttribute("position", (-0.78 + progress * 0.76) + " 0 0.025");
          fill.setAttribute("color", heatColor);
        }
        if (needle) {
          needle.setAttribute("position", heatToBarX(heatTemperature) + " 0 0.026");
        }
        if (readout) {
          readout.setAttribute("value", formatTempCelsius(heatTemperature) + "｜" + (currentLanguage === "en" ? state.en : state.zh));
          readout.setAttribute("color", heatColor);
        }
        if (holdReadout) {
          holdReadout.setAttribute("value", getGreenZoneHoldText(heatHoldTime));
          holdReadout.setAttribute("color", heatTemperature >= heatMin && heatTemperature <= heatMax ? "#20d482" : "#ffd37a");
        }

        if (performance.now() - lastHeatingEmber > 260) {
          lastHeatingEmber = performance.now();
          addFurnaceGlow(document.querySelector("#furnace"), 2.4 + progress * 3.4, "#ff9b26");
          if (Math.random() < 0.08) createFurnaceFireEmoji(document.querySelector("#furnace"), 1);
          setStatus(
            formatTempCelsius(heatTemperature) + "｜" + state.zh + "｜稳定 " + heatHoldTime.toFixed(1) + "/5 秒",
            formatTempCelsius(heatTemperature) + " | " + state.en + " | Stable " + heatHoldTime.toFixed(1) + "/5 sec"
          );
        }

        if (heatHoldTime >= 5) completeHeating();
      }

      function completeHeating() {
        if (!heatingActive) return;
        heatingActive = false;
        moltenIronReady = true;
        var furnace = document.querySelector("#furnace");
        var stream = document.querySelector("#moltenStream");

        if (stream) stream.setAttribute("visible", "true");
        addFurnaceGlow(furnace, 5.8, "#ffb13d");
        createFurnaceFireEmoji(furnace, 4);
        ["bellows", "bellowsHotspot", "labelBellows"].forEach(function (id) {
          var node = document.querySelector("#" + id);
          if (node) node.setAttribute("visible", "false");
        });
        showExtractMoltenModal();
      }

      function pullBellows() {
        if (!materialSelectionComplete) {
          setStatus("先把正确材料全部加入炉中，再拉风箱", "Add all correct materials into the furnace before pulling the bellows");
          return;
        }

        if (!heatingActive && !moltenIronReady) {
          startHeatingFurnace(document.querySelector("#furnace"));
        }

        if (moltenIronReady) {
          setStatus("铁水已就绪：点击「取出铁水」完成材料准备", "Molten iron is ready: click Extract Molten Iron to finish preparation");
          showExtractMoltenModal();
          return;
        }

        var boost = heatTemperature < 1400 ? 90 : heatTemperature < heatMin ? 70 : heatTemperature < heatMax ? 45 : 25;
        heatTemperature = Math.min(heatScaleMax, heatTemperature + boost);
        animateBellows();
        createFurnaceFireEmoji(document.querySelector("#furnace"), heatTemperature > heatMax ? 1 : 3);
        var state = getHeatState(heatTemperature);
        setStatus(
          "拉风箱升温：当前 " + formatTempCelsius(heatTemperature) + "｜" + state.zh,
          "Bellows heat up: now " + formatTempCelsius(heatTemperature) + " | " + state.en
        );
      }

      function completeMelting() {
        var furnace = document.querySelector("#furnace");
        moltenIronReady = true;

        var hotspot = document.querySelector("#furnaceHotspot");
        if (hotspot && hasLadle) hotspot.classList.remove("clickable");

        addFurnaceGlow(furnace, 5.4, "#ffb13d");
        createFurnaceFireEmoji(furnace, 5);

        if (hasLadle) {
          fillLadleWithMoltenIron();
          setStatus("铁水已装入左手铁碗，前往击打点", "Molten iron is in the left-hand bowl. Move to the strike point");
          setTimeout(function () {
            setSceneStep(3);
          }, 500);
        } else {
          setStatus("铁水已流出：点击工具站，拿起铁碗和拍板", "Molten iron has flowed out: pick up the bowl and paddle at the tool station");
          setTimeout(function () {
            setSceneStep(3);
            setStatus("步骤 3 表演场：点击工具站，左手端铁碗、右手拿拍板", "Step 3 Performance Scene: click the tool station, bowl in left hand and paddle in right hand");
          }, 650);
        }
      }

      function startPracticeLevel(level) {
        rhythmMode = "practice";
        rhythmLevel = level;
        rhythmScore = level === 1 ? 0 : rhythmScore;
        rhythmMisses = 0;
        rhythmEnded = false;
        rhythmActive = true;
        rhythmStart = performance.now();
        rhythmLastSpawn = 0;
        resetRhythmEntities();
        buildRhythmLanes(rhythmConfigs[level - 1].lanes);
        setStatus("Practice 第 " + level + " 关：30 秒内击中下落铁花，最多失败 3 次", "Practice Level " + level + ": hit falling sparks for 30 sec. You have 3 misses");
      }

      function startPerformanceShow() {
        rhythmMode = "performance";
        rhythmLevel = 1;
        rhythmScore = 0;
        rhythmMisses = 0;
        rhythmEnded = false;
        rhythmActive = true;
        rhythmStart = performance.now();
        rhythmLastSpawn = 0;
        resetRhythmEntities();
        buildRhythmLanes(5);
        setSceneStep(3);
        updateAudienceReaction();
        setStatus("正式表演：60 秒无限生命，击中得分，漏掉扣分", "Performance: 60 seconds, unlimited life. Hits score, misses subtract");
      }

      function resetRhythmEntities() {
        rhythmNotes = [];
        var lanes = document.querySelector("#rhythmLanes");
        var notes = document.querySelector("#rhythmNotes");
        if (lanes) lanes.innerHTML = "";
        if (notes) notes.innerHTML = "";
      }

      function buildRhythmLanes(count) {
        var lanes = document.querySelector("#rhythmLanes");
        var title = document.querySelector("#rhythmTitle");
        if (!lanes) return;

        var spacing = 0.62;
        var total = (count - 1) * spacing;
        for (var i = 0; i < count; i += 1) {
          var x = -total / 2 + i * spacing;
          var lane = document.createElement("a-entity");
          lane.setAttribute("position", x + " 1.85 0");
          lane.innerHTML =
            '<a-cylinder radius="0.018" height="2.5" rotation="0 0 0" color="#ffd37a" material="transparent: true; opacity: 0.34"></a-cylinder>' +
            '<a-ring class="clickable rhythm-hit" data-lane-index="' + i + '" position="0 -1.05 0.03" radius-inner="0.16" radius-outer="0.23" color="#ffbd42" material="transparent: true; opacity: 0.9; emissive: #ff8a00; emissiveIntensity: 0.65"></a-ring>' +
            '<a-text value="' + (i + 1) + '" align="center" width="1.5" position="0 -1.42 0.04" color="#fff4d2"></a-text>';
          lanes.appendChild(lane);
        }

        if (title) {
          var label = rhythmMode === "practice" ? "Practice Mode 第 " + rhythmLevel + " 关" : "Performance Mode 正式表演";
          var body = rhythmMode === "practice" ? "Hit notes in the judgment rings. Three misses fail the level" : "60 seconds, unlimited life. Audience reacts to your score";
          title.setAttribute("canvas-label", "text: " + label + "|" + body + "; width: 4.8; height: 0.72");
        }
      }

      function updateRhythmGame() {
        if (!rhythmActive) return;
        var now = performance.now();
        var config = rhythmMode === "practice" ? rhythmConfigs[rhythmLevel - 1] : { lanes: 5, speed: 1.65, spawn: 610, duration: 60000 };
        var elapsed = now - rhythmStart;
        var hud = document.querySelector("#rhythmHud");

        if (now - rhythmLastSpawn > config.spawn) {
          rhythmLastSpawn = now;
          spawnRhythmNote(config);
        }

        rhythmNotes.slice().forEach(function (note) {
          note.y -= config.speed / 60;
          note.el.setAttribute("position", note.x + " " + note.y + " 0.08");
          if (note.y < 0.48) {
            note.el.remove();
            rhythmNotes.splice(rhythmNotes.indexOf(note), 1);
            registerRhythmMiss();
          }
        });

        if (hud) {
          var remaining = Math.max(0, Math.ceil((config.duration - elapsed) / 1000));
          if (rhythmMode === "practice") {
            hud.setAttribute("value", "Practice " + rhythmLevel + "/3   Time " + remaining + "   Miss " + rhythmMisses + "/3   Score " + rhythmScore);
          } else {
            hud.setAttribute("value", "Performance   Time " + remaining + "   Score " + rhythmScore + "   Miss " + rhythmMisses);
          }
        }

        if (rhythmMode === "practice" && rhythmMisses >= 3) {
          restartPracticeLevel();
          return;
        }

        if (elapsed >= config.duration && !rhythmEnded) {
          rhythmEnded = true;
          if (rhythmMode === "practice") {
            if (rhythmLevel < 3) {
              setStatus("Practice 第 " + rhythmLevel + " 关通过：进入下一关", "Practice Level " + rhythmLevel + " passed: next level");
              setTimeout(function () { startPracticeLevel(rhythmLevel + 1); }, 1200);
            } else {
              rhythmActive = false;
              setStatus("四关通过：获得打铁花表演资质，进入正式表演", "All four levels passed: performance qualification earned");
              setTimeout(function () { goToScene("scene-performance.html"); }, 1500);
            }
          } else {
            rhythmActive = false;
            updateAudienceReaction();
            setStatus("表演结束：最终得分 " + rhythmScore, "Performance complete: final score " + rhythmScore);
          }
        }
      }

      function spawnRhythmNote(config) {
        var lanes = config.lanes;
        var lane = Math.floor(Math.random() * lanes);
        var spacing = 0.62;
        var total = (lanes - 1) * spacing;
        var x = -total / 2 + lane * spacing;
        var note = document.createElement("a-entity");
        note.setAttribute("geometry", "primitive: sphere; radius: 0.075");
        note.setAttribute("position", x + " 3.1 0.08");
        note.setAttribute("material", "color: #fff4c1; emissive: #ff6a00; emissiveIntensity: 2.8; transparent: true; opacity: 1");
        document.querySelector("#rhythmNotes").appendChild(note);
        rhythmNotes.push({ el: note, lane: lane, x: x, y: 3.1 });
      }

      function hitRhythmLane(laneIndex) {
        if (!rhythmActive) return;
        var targetY = 0.8;
        var best = null;
        rhythmNotes.forEach(function (note) {
          if (note.lane !== laneIndex) return;
          var distance = Math.abs(note.y - targetY);
          if (distance <= 0.34 && (!best || distance < best.distance)) {
            best = { note: note, distance: distance };
          }
        });

        if (!best) {
          registerRhythmMiss();
          return;
        }

        var note = best.note;
        rhythmNotes.splice(rhythmNotes.indexOf(note), 1);
        note.el.remove();
        rhythmScore += best.distance < 0.16 ? 120 : 80;
        createFlash(document.querySelector("#fireworks"), sceneStepX[currentSceneStep], 1.15, -3.4, 4, 5, 280);
        if (rhythmMode === "performance") updateAudienceReaction();
      }

      function registerRhythmMiss() {
        if (!rhythmActive) return;
        rhythmMisses += 1;
        rhythmScore = Math.max(0, rhythmScore - (rhythmMode === "performance" ? 45 : 25));
        if (rhythmMode === "performance") updateAudienceReaction();
      }

      function restartPracticeLevel() {
        rhythmActive = false;
        setStatus("Practice 第 " + rhythmLevel + " 关失败：3 次失误已用完，重新开始本关", "Practice Level " + rhythmLevel + " failed: three misses used. Restarting");
        setTimeout(function () {
          startPracticeLevel(rhythmLevel);
        }, 1400);
      }

      function updateAudienceReaction() {
        var reaction = document.querySelector("#audienceReaction");
        if (!reaction) return;
        var text = "观众屏息等待";
        if (rhythmScore >= 2600) text = "满堂喝彩！铁花如瀑";
        else if (rhythmScore >= 1600) text = "掌声热烈，观众惊叹";
        else if (rhythmScore >= 800) text = "观众点头，节奏稳定";
        else if (rhythmMisses > 4) text = "观众有些紧张，注意节奏";
        reaction.setAttribute("value", text + " / Score " + rhythmScore);
      }

      function animateBellows() {
        var body = document.querySelector("#bellowsBody");
        var handle = document.querySelector("#bellowsHandle");
        if (!body || !handle) return;

        body.removeAttribute("animation__compress");
        body.removeAttribute("animation__release");
        handle.removeAttribute("animation__pull");
        handle.removeAttribute("animation__return");

        body.setAttribute("animation__compress", "property: scale; to: 1 0.62 0.86; dur: 160; easing: easeOutQuad");
        handle.setAttribute("animation__pull", "property: position; to: -0.74 0.32 0; dur: 160; easing: easeOutQuad");

        setTimeout(function () {
          body.setAttribute("animation__release", "property: scale; to: 1 1 1; dur: 260; easing: easeOutElastic");
          handle.setAttribute("animation__return", "property: position; to: -0.62 0.45 0; dur: 260; easing: easeOutElastic");
        }, 170);
      }

      function updateHeatIndicators() {
        for (var i = 1; i <= 3; i += 1) {
          var dot = document.querySelector("#heatDot" + i);
          if (!dot) continue;
          var active = i <= bellowsPulls;
          dot.setAttribute("color", active ? "#ffb13d" : "#3b2a1c");
          dot.setAttribute("material", active ? "emissive: #ff6a00; emissiveIntensity: 1.7" : "");
        }
      }

      function createFurnaceFireEmoji(furnace, count) {
        if (!furnace) return;
        var container = furnace.querySelector("#furnaceFireEmoji");
        if (!container) {
          container = document.createElement("a-entity");
          container.id = "furnaceFireEmoji";
          container.setAttribute("position", "0 0.52 0");
          furnace.appendChild(container);
        }
        var glyphs = ["🔥", "🔥", "✨"];
        for (var i = 0; i < count; i += 1) {
          var node = document.createElement("a-text");
          node.setAttribute("value", glyphs[i % glyphs.length]);
          node.setAttribute("align", "center");
          node.setAttribute("width", "2.4");
          node.setAttribute("scale", "1.6 1.6 1.6");
          node.setAttribute(
            "position",
            (Math.random() - 0.5) * 0.38 + " " + (Math.random() * 0.22) + " " + ((Math.random() - 0.5) * 0.24)
          );
          node.setAttribute("face-camera", "");
          container.appendChild(node);
          setTimeout(
            (function (el) {
              return function () {
                el.remove();
              };
            })(node),
            850 + Math.random() * 450
          );
        }
      }

      function createBellowsAirPuff() {
        createFurnaceFireEmoji(document.querySelector("#furnace"), 2);
      }

      function addFurnaceGlow(furnace, intensity, color) {
        var glow = document.createElement("a-light");
        glow.setAttribute("type", "point");
        glow.setAttribute("color", color);
        glow.setAttribute("intensity", String(intensity));
        glow.setAttribute("distance", "7");
        glow.setAttribute("position", "0 0.35 0");
        furnace.appendChild(glow);
      }

      function createFurnaceEmbers(furnace, count, heightBoost) {
        return;
        for (var i = 0; i < count; i += 1) {
          var ember = document.createElement("a-entity");
          ember.setAttribute("mixin", "spark");
          ember.setAttribute("position", (Math.random() - 0.5) * 0.45 + " 0.28 " + (Math.random() - 0.5) * 0.45);
          ember.setAttribute("scale", "0.55 0.55 0.55");
          ember.setAttribute("spark-move", {
            vx: (Math.random() - 0.5) * 0.28,
            vy: heightBoost + Math.random() * 0.95,
            vz: (Math.random() - 0.5) * 0.28,
            life: 700 + Math.random() * 420,
          });
          furnace.appendChild(ember);
        }
      }

      function toggleToolsAtStation() {
        if (hasLadle) {
          returnToolsToStation();
        } else {
          if (!moltenIronReady) {
            setStatus("工具在第 3 步使用：请先完成材料入炉和 5 秒加热点火", "Tools are used in Step 3: complete materials and the 5-second heating first");
            return;
          }
          pickUpLadle();
        }
      }

      function pickUpLadle() {
        if (hasLadle) return;

        hasLadle = true;

        var toolStation = document.querySelector("#ladle");
        toolStation.classList.remove("clickable");
        toolStation.setAttribute("visible", "true");
        setTimeout(function () {
          toolStation.classList.add("clickable");
        }, 250);

        addLowerStick();
        fillLadleWithMoltenIron();
        moveLadleToBestAnchor();
        setSceneStep(3);
        setStatus("双手工具已就位：左手铁碗装入铁水，右手拍板。瞄准光圈开始打铁花", "Both tools are ready: molten iron in the left bowl, paddle in the right hand. Aim at the ring to perform Iron Flower");
      }

      function returnToolsToStation() {
        var toolStation = document.querySelector("#ladle");
        var bowl = document.querySelector("#heldBowl");
        var paddle = document.querySelector("#heldPaddle");
        var molten = document.querySelector("#heldMoltenIron");

        if (molten) molten.remove();
        if (bowl) bowl.remove();
        if (paddle) paddle.remove();

        hasLadle = false;
        ladleLoaded = false;
        lowerStickAdded = false;

        toolStation.setAttribute("visible", "true");
        toolStation.classList.add("clickable");
        toolStation.setAttribute("scale", "1 1 1");

        if (moltenIronReady) {
          setSceneStep(3);
          setStatus("工具已放回：可再次点击工具站装入铁水并拿起拍板", "Tools returned: click the tool station again to load molten iron and take the paddle");
        } else {
          setStatus("工具已放回：按三步流程继续执行", "Tools returned: continue following the three-step flow");
        }
      }

      function moveLadleToBestAnchor() {
        addLowerStick();
        var bowl = document.querySelector("#heldBowl");
        var paddle = document.querySelector("#heldPaddle");
        var scene = document.querySelector("a-scene");
        var leftAnchor = document.querySelector("#leftBowlAnchor");
        var rightAnchor = document.querySelector("#handHeldAnchor");
        var cameraAnchor = document.querySelector("#heldAnchor");
        var useHand = scene && scene.is("vr-mode") && leftAnchor && rightAnchor;

        if (!bowl || !paddle) return;

        if (useHand) {
          leftAnchor.appendChild(bowl);
          rightAnchor.appendChild(paddle);
          bowl.setAttribute("position", "0 0 -0.02");
          bowl.setAttribute("rotation", "-8 0 0");
          bowl.setAttribute("scale", "0.7 0.7 0.7");
          paddle.setAttribute("position", "0 0 -0.03");
          paddle.setAttribute("rotation", "0 0 -8");
          paddle.setAttribute("scale", "0.72 0.72 0.72");
        } else if (cameraAnchor) {
          cameraAnchor.appendChild(bowl);
          cameraAnchor.appendChild(paddle);
          bowl.setAttribute("position", "-0.28 -0.05 0");
          bowl.setAttribute("rotation", "-12 0 8");
          bowl.setAttribute("scale", "0.62 0.62 0.62");
          paddle.setAttribute("position", "0.34 -0.03 -0.02");
          paddle.setAttribute("rotation", "0 0 -18");
          paddle.setAttribute("scale", "0.65 0.65 0.65");
        }
      }

      function fillLadleWithMoltenIron() {
        addLowerStick();
        var bowl = document.querySelector("#heldBowl");
        if (!bowl || ladleLoaded) return;
        ladleLoaded = true;

        var molten = document.createElement("a-sphere");
        molten.setAttribute("id", "heldMoltenIron");
        molten.setAttribute("radius", "0.145");
        molten.setAttribute("scale", "1 0.24 1");
        molten.setAttribute("position", "0 0.08 0");
        molten.setAttribute("color", "#fff0ae");
        molten.setAttribute("material", "emissive: #ff4a00; emissiveIntensity: 3.4; transparent: true; opacity: 0.96");
        bowl.appendChild(molten);
      }

      function addLowerStick() {
        if (lowerStickAdded) return;
        lowerStickAdded = true;

        var bowl = document.createElement("a-entity");
        bowl.setAttribute("id", "heldBowl");
        bowl.innerHTML =
          '<a-cylinder radius="0.18" height="0.1" color="#2b170c" material="metalness: 0.55; roughness: 0.32"></a-cylinder>' +
          '<a-torus position="0 0.07 0" radius="0.19" radius-tubular="0.023" color="#9a5a24"></a-torus>' +
          '<a-cylinder position="-0.27 0.02 0" radius="0.018" height="0.54" rotation="0 0 88" color="#8a521f"></a-cylinder>';

        var paddle = document.createElement("a-entity");
        paddle.setAttribute("id", "heldPaddle");
        paddle.innerHTML =
          '<a-box position="0 0 0" width="0.5" height="0.08" depth="0.28" color="#7c3a16"></a-box>' +
          '<a-cylinder position="0.42 0 0" radius="0.024" height="0.68" rotation="0 0 90" color="#5c2a11"></a-cylinder>';

        document.querySelector("#fireworks").appendChild(bowl);
        document.querySelector("#fireworks").appendChild(paddle);
      }

      function triggerIronFlower() {
        var now = performance.now();
        if (!hasLadle) {
          setStatus("请先点击工具站，左手拿铁碗、右手拿拍板", "Click the tool station first: left hand takes the bowl, right hand takes the paddle");
          return;
        }

        if (!furnacePrepared) {
          setStatus("请先点击炉火完成发炉", "Click the furnace first to prepare it");
          return;
        }

        if (!moltenIronReady || !ladleLoaded) {
          setStatus("请先完成融铁，并把铁水装入左手铁碗", "Melt the iron first and load it into the left-hand bowl");
          return;
        }

        if (now - lastBurst < 900) return;
        lastBurst = now;
        pourMoltenIronFromBowl();
        animatePaddleStrike();
        launchIronFlower(7.2, 1.45, -4.25);
        setStatus("打铁花：左手泼出铁水，右手拍板拍开，铁花绽放", "Iron Flower: pour with the left hand, slap open with the right, and sparks bloom");
      }

      function pourMoltenIronFromBowl() {
        var molten = document.querySelector("#heldMoltenIron");
        if (molten) molten.setAttribute("visible", "false");

        var root = document.querySelector("#fireworks");
        var bowl = document.querySelector("#heldBowl");
        var origin = new THREE.Vector3(6.8, 1.15, -3.6);
        if (bowl) bowl.object3D.getWorldPosition(origin);

        for (var i = 0; i < 42; i += 1) {
          var stream = document.createElement("a-entity");
          stream.setAttribute("mixin", "spark");
          stream.setAttribute("position", origin.x + " " + origin.y + " " + origin.z);
          stream.setAttribute("scale", "0.8 0.8 0.8");
          stream.setAttribute("material", "color: #fff4c1; emissive: #ff4a00; emissiveIntensity: 3.4; transparent: true; opacity: 1");
          stream.setAttribute("spark-move", {
            vx: 0.15 + Math.random() * 0.65,
            vy: 0.2 + Math.random() * 1.2,
            vz: -1.05 - Math.random() * 1.35,
            gravity: 0.028,
            life: 420 + Math.random() * 280,
            delay: Math.random() * 120,
            trail: true,
          });
          root.appendChild(stream);
        }
      }

      function animatePaddleStrike() {
        var paddle = document.querySelector("#heldPaddle");
        if (!paddle) return;

        paddle.removeAttribute("animation__strike");
        paddle.removeAttribute("animation__return");
        paddle.setAttribute("animation__strike", "property: rotation; to: 34 0 -42; dur: 150; easing: easeOutQuad");
        setTimeout(function () {
          paddle.setAttribute("animation__return", "property: rotation; to: 0 0 -8; dur: 260; easing: easeOutElastic");
        }, 160);
      }

      function launchIronFlower(x, y, z) {
        var root = document.querySelector("#fireworks");
        var origin = new THREE.Vector3(x, y, z + 0.65);
        var burst = new THREE.Vector3(x, y, z);

        createIronComet(root, origin, burst);
        createShockRing(root, x, y, z);
        createFlash(root, x, y, z, 11, 11, 760);

        for (var i = 0; i < 280; i += 1) {
          var spark = document.createElement("a-entity");
          var angle = THREE.MathUtils.degToRad(-18 + Math.random() * 216);
          var fan = Math.pow(Math.random(), 0.55);
          var speed = 1.4 + Math.random() * 6.8;
          var size = 0.45 + Math.random() * 1.8;
          var delay = Math.random() * 180;

          spark.setAttribute("mixin", "spark");
          spark.setAttribute("position", x + " " + y + " " + z);
          spark.setAttribute("scale", size + " " + size + " " + size);
          spark.setAttribute(
            "material",
            "color: " +
              randomFireColor() +
              "; emissive: #ff6a00; emissiveIntensity: " +
              (2.4 + Math.random() * 2.8) +
              "; transparent: true; opacity: 1"
          );
          spark.setAttribute("spark-move", {
            vx: Math.cos(angle) * speed * fan,
            vy: 0.35 + Math.random() * 3.8,
            vz: -Math.abs(Math.sin(angle)) * speed * 0.5 - Math.random() * 0.65,
            gravity: 0.035 + Math.random() * 0.04,
            life: 950 + Math.random() * 1050,
            delay: delay,
            trail: Math.random() > 0.34,
          });
          root.appendChild(spark);
        }

        for (var j = 0; j < 110; j += 1) {
          var ember = document.createElement("a-entity");
          var drift = THREE.MathUtils.degToRad(25 + Math.random() * 130);
          var emberSpeed = 0.6 + Math.random() * 2.4;
          ember.setAttribute("mixin", "spark");
          ember.setAttribute("position", (x + (Math.random() - 0.5) * 2.2) + " " + (y + 1.25 + Math.random() * 1.2) + " " + (z - 0.55 - Math.random() * 1.2));
          ember.setAttribute("scale", "0.55 0.55 0.55");
          ember.setAttribute("material", "color: #ffb13d; emissive: #ff5a14; emissiveIntensity: 2.2; transparent: true; opacity: 0.85");
          ember.setAttribute("spark-move", {
            vx: Math.cos(drift) * emberSpeed * 0.45,
            vy: -0.25 - Math.random() * 0.65,
            vz: -Math.sin(drift) * emberSpeed * 0.18,
            gravity: 0.018,
            life: 1500 + Math.random() * 1500,
            delay: 180 + Math.random() * 450,
            trail: false,
          });
          root.appendChild(ember);
        }
      }

      function createIronComet(root, origin, burst) {
        var comet = document.createElement("a-entity");
        comet.setAttribute("geometry", "primitive: sphere; radius: 0.075");
        comet.setAttribute("material", "color: #fff4c1; emissive: #ff6a00; emissiveIntensity: 4.5; transparent: true; opacity: 1");
        comet.setAttribute("position", origin.x + " " + origin.y + " " + origin.z);
        comet.setAttribute("comet-flight", {
          toX: burst.x,
          toY: burst.y,
          toZ: burst.z,
          life: 360,
        });
        root.appendChild(comet);
      }

      function createShockRing(root, x, y, z) {
        var ring = document.createElement("a-ring");
        ring.setAttribute("position", x + " " + y + " " + z);
        ring.setAttribute("rotation", "0 0 0");
        ring.setAttribute("radius-inner", "0.12");
        ring.setAttribute("radius-outer", "0.16");
        ring.setAttribute("color", "#fff4c1");
        ring.setAttribute("material", "shader: flat; transparent: true; opacity: 0.86; side: double");
        ring.setAttribute("shock-ring", "");
        root.appendChild(ring);
      }

      function createFlash(root, x, y, z, intensity, distance, life) {
        var flash = document.createElement("a-light");
        flash.setAttribute("type", "point");
        flash.setAttribute("color", "#ffb13d");
        flash.setAttribute("intensity", String(intensity));
        flash.setAttribute("distance", String(distance));
        flash.setAttribute("position", x + " " + y + " " + z);
        flash.setAttribute("flash-fade", { intensity: intensity, life: life });
        root.appendChild(flash);
      }

      AFRAME.registerComponent("spark-move", {
        schema: {
          vx: { default: 0 },
          vy: { default: 1 },
          vz: { default: 0 },
          gravity: { default: 0.045 },
          life: { default: 1000 },
          delay: { default: 0 },
          trail: { default: false },
        },

        init: function () {
          this.birth = performance.now();
          this.lastTrail = 0;
          this.startScale = this.el.object3D.scale.clone();
          if (this.data.delay > 0) {
            this.el.object3D.visible = false;
          }
        },

        tick: function () {
          var now = performance.now();
          var age = now - this.birth - this.data.delay;
          if (age < 0) return;
          this.el.object3D.visible = true;
          var progress = age / this.data.life;

          this.el.object3D.position.x += this.data.vx / 60;
          this.el.object3D.position.y += this.data.vy / 60;
          this.el.object3D.position.z += this.data.vz / 60;
          this.data.vy -= this.data.gravity;

          var fade = Math.max(0, 1 - progress);
          this.el.object3D.scale.copy(this.startScale).multiplyScalar(0.35 + fade * 0.95);
          this.el.setAttribute("material", "opacity", fade);

          if (this.data.trail && now - this.lastTrail > 42 && fade > 0.16) {
            this.lastTrail = now;
            createTrailDot(this.el.parentElement, this.el.object3D.position, fade);
          }

          if (progress >= 1 || this.el.object3D.position.y < 0) {
            this.el.remove();
          }
        },
      });

      function createTrailDot(root, position, fade) {
        if (!root) return;
        if (root.children.length > 650) return;
        var dot = document.createElement("a-entity");
        dot.setAttribute("geometry", "primitive: sphere; radius: 0.018");
        dot.setAttribute("position", position.x + " " + position.y + " " + position.z);
        dot.setAttribute("material", "color: #ffd06a; emissive: #ff5a14; emissiveIntensity: 1.8; transparent: true; opacity: " + Math.min(0.72, fade));
        dot.setAttribute("trail-fade", "");
        root.appendChild(dot);
      }

      AFRAME.registerComponent("trail-fade", {
        init: function () {
          this.birth = performance.now();
          this.startScale = this.el.object3D.scale.clone();
        },

        tick: function () {
          var progress = (performance.now() - this.birth) / 420;
          this.el.object3D.scale.copy(this.startScale).multiplyScalar(Math.max(0.05, 1 - progress));
          this.el.setAttribute("material", "opacity", Math.max(0, 0.72 * (1 - progress)));
          if (progress >= 1) this.el.remove();
        },
      });

      AFRAME.registerComponent("comet-flight", {
        schema: {
          toX: { default: 0 },
          toY: { default: 0 },
          toZ: { default: 0 },
          life: { default: 360 },
        },

        init: function () {
          this.birth = performance.now();
          this.from = this.el.object3D.position.clone();
          this.to = new THREE.Vector3(this.data.toX, this.data.toY, this.data.toZ);
        },

        tick: function () {
          var progress = Math.min((performance.now() - this.birth) / this.data.life, 1);
          var eased = 1 - Math.pow(1 - progress, 3);
          this.el.object3D.position.lerpVectors(this.from, this.to, eased);
          this.el.setAttribute("material", "opacity", 1 - progress * 0.25);
          createTrailDot(this.el.parentElement, this.el.object3D.position, 0.9);
          if (progress >= 1) this.el.remove();
        },
      });

      AFRAME.registerComponent("shock-ring", {
        init: function () {
          this.birth = performance.now();
        },

        tick: function () {
          var progress = (performance.now() - this.birth) / 680;
          var scale = 1 + progress * 9;
          this.el.object3D.scale.set(scale, scale, scale);
          this.el.setAttribute("material", "opacity", Math.max(0, 0.86 * (1 - progress)));
          if (progress >= 1) this.el.remove();
        },
      });

      AFRAME.registerComponent("flash-fade", {
        schema: {
          intensity: { default: 7 },
          life: { default: 450 },
        },

        init: function () {
          this.birth = performance.now();
        },

        tick: function () {
          var progress = (performance.now() - this.birth) / this.data.life;
          this.el.setAttribute("intensity", this.data.intensity * Math.max(0, 1 - progress));

          if (progress >= 1) {
            this.el.remove();
          }
        },
      });

      function randomFireColor() {
        var colors = ["#fff4c1", "#ffd06a", "#ff9d1e", "#ff5a14", "#db1f13"];
        return colors[Math.floor(Math.random() * colors.length)];
      }

      window.addEventListener("load", function () {
        var scene = document.querySelector("a-scene");
        var startButton = document.querySelector("#startButton");
        applySceneShell();
        document.querySelector("#langToggle").addEventListener("click", toggleLanguage);
        startButton.addEventListener("click", startGame);
        var extractMoltenBtn = document.querySelector("#extractMoltenBtn");
        if (extractMoltenBtn) extractMoltenBtn.addEventListener("click", finishMaterialPrep);
        document.addEventListener("keydown", function (event) {
          if (gameStarted) return;
          if (event.code === "Enter" || event.code === "Space") {
            event.preventDefault();
            startGame();
          }
        });
        applyLanguage();
        updateHeatZoneLabels();
        setInitialScenePreview();
        if (storyMode && pageQuery.get("phase") === "heating") {
          startGame();
        }
        scene.setAttribute("manual-interaction", "");
        scene.setAttribute("heating-progress-loop", "");
        scene.addEventListener("enter-vr", function () {
          if (hasLadle) {
            setStatus("已进入 VR：左手铁碗、右手拍板", "VR mode active: bowl in left hand, paddle in right hand");
          } else {
            setStatus("已进入 VR：转头环顾，点击交互", "VR mode active: look around and interact");
          }
          if (hasLadle) setTimeout(moveLadleToBestAnchor, 120);
        });
        scene.addEventListener("exit-vr", function () {
          setStatus("已退出 VR：电脑可用鼠标视角测试", "Exited VR: on desktop, test with mouse look");
          if (hasLadle) moveLadleToBestAnchor();
        });
        document.querySelector("#furnaceHotspot").setAttribute("furnace-step", "");
        document.querySelector("#bellowsHotspot").setAttribute("bellows-step", "");
        document.querySelectorAll(".material-item").forEach(function (item) {
          item.setAttribute("material-choice", item.getAttribute("material-choice"));
        });
        document.querySelector("#ladle").setAttribute("pickable", "");
        document.querySelector("#strikeTarget").setAttribute("strike-target", "");
        document.querySelector("#languageSwitch").setAttribute("language-switch", "");
        startGame();
      });
    </script>
  </body>
</html>
