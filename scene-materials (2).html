<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>准备素材的场景｜铜官窑打铁花 VR 体验</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #040201;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .overlay {
        position: fixed;
        left: 20px;
        top: 70px;
        z-index: 10;
        width: min(430px, calc(100vw - 40px));
        color: #fff6df;
        pointer-events: none;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.75);
      }

      .overlay-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }

      .overlay h1 {
        margin: 0;
        font-size: 25px;
        line-height: 1.15;
        letter-spacing: 0;
      }

      .lang-toggle {
        position: fixed;
        left: 20px;
        top: 18px;
        z-index: 25;
        pointer-events: auto;
        border: 1px solid rgba(255, 188, 66, 0.85);
        border-radius: 999px;
        background: rgba(20, 12, 5, 0.88);
        color: #ffd27a;
        padding: 9px 18px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.5px;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
        transition: background 160ms ease, transform 160ms ease;
      }

      .lang-toggle:hover {
        background: rgba(40, 24, 8, 0.95);
        transform: translateY(-1px);
      }

      body:not(.game-started) .lang-toggle {
        display: none;
      }

      .overlay .course {
        margin: 0 0 8px;
        color: #d8eef8;
        font-size: 14px;
        line-height: 1.35;
      }

      .overlay p {
        margin: 0;
        color: #ffd27a;
        font-size: 14px;
        line-height: 1.55;
      }

      .badge {
        display: inline-block;
        margin-bottom: 10px;
        padding: 5px 9px;
        border: 1px solid rgba(255, 188, 66, 0.5);
        border-radius: 999px;
        background: rgba(20, 12, 5, 0.58);
        color: #ffbd42;
        font-size: 12px;
      }

      body:not(.game-started) .overlay {
        opacity: 0;
      }

      .start-screen {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          linear-gradient(180deg, rgba(2, 4, 8, 0.15), rgba(2, 4, 8, 0.4)),
          url("./start-screen.jpg") center / cover no-repeat;
        color: #fff8ce;
        transition: opacity 520ms ease, visibility 520ms ease;
      }

      .start-screen::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 30%, rgba(255, 211, 122, 0.22), transparent 28%),
          linear-gradient(90deg, rgba(0, 0, 0, 0.38), transparent 28%, transparent 72%, rgba(0, 0, 0, 0.38));
        pointer-events: none;
      }

      .game-started .start-screen {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .start-content {
        position: relative;
        z-index: 1;
        width: min(980px, calc(100vw - 40px));
        min-height: 62vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: clamp(28px, 5vw, 64px) 0 clamp(34px, 6vw, 72px);
        text-align: center;
        text-shadow: 0 4px 24px rgba(0, 0, 0, 0.84);
      }

      .start-kicker {
        margin: 0;
        color: #ffd27a;
        font-size: clamp(14px, 1.6vw, 19px);
        letter-spacing: 0;
      }

      .start-title {
        margin: clamp(8px, 1.8vw, 18px) 0 0;
        font-size: clamp(56px, 13vw, 168px);
        line-height: 0.82;
        font-weight: 950;
        font-style: italic;
        letter-spacing: 0;
        color: #fff6b8;
        text-transform: uppercase;
        transform: skewX(-8deg);
        filter: drop-shadow(0 0 18px rgba(255, 186, 52, 0.42));
      }

      .start-subtitle {
        margin: 14px auto 0;
        max-width: 720px;
        color: #ffe4a6;
        font-size: clamp(15px, 2vw, 22px);
        line-height: 1.45;
      }

      .start-button {
        border: 1px solid rgba(255, 245, 202, 0.48);
        min-width: min(520px, calc(100vw - 68px));
        padding: clamp(15px, 2.2vw, 24px) 32px;
        border-radius: 2px;
        background: rgba(232, 207, 151, 0.7);
        color: #fffdf0;
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.42), inset 0 0 0 1px rgba(255, 255, 255, 0.18);
        font-size: clamp(30px, 5vw, 64px);
        line-height: 1;
        font-weight: 850;
        letter-spacing: 0;
        cursor: pointer;
        text-shadow: 0 3px 16px rgba(0, 0, 0, 0.45);
        transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
      }

      .start-button:hover,
      .start-button:focus-visible {
        transform: translateY(-2px) scale(1.015);
        background: rgba(255, 220, 144, 0.82);
        outline: none;
        box-shadow: 0 24px 90px rgba(255, 172, 46, 0.24), 0 20px 80px rgba(0, 0, 0, 0.42);
      }

      .start-hint {
        margin-top: 14px;
        color: rgba(255, 244, 210, 0.82);
        font-size: 15px;
      }

      .choice-panel {
        position: fixed;
        left: 50%;
        bottom: 28px;
        z-index: 20;
        width: min(520px, calc(100vw - 36px));
        transform: translateX(-50%);
        padding: 18px;
        border: 1px solid rgba(255, 188, 66, 0.7);
        border-radius: 8px;
        background: rgba(12, 7, 3, 0.86);
        box-shadow: 0 20px 70px rgba(0, 0, 0, 0.42);
        color: #fff4d2;
        pointer-events: auto;
      }

      .choice-panel[hidden] {
        display: none;
      }

      .choice-panel h2 {
        margin: 0 0 8px;
        font-size: 19px;
        line-height: 1.25;
      }

      .choice-panel p {
        margin: 0 0 14px;
        color: #ffd27a;
        font-size: 15px;
        line-height: 1.5;
      }

      .choice-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }

      .choice-actions button {
        border: 1px solid rgba(255, 188, 66, 0.72);
        border-radius: 6px;
        background: rgba(255, 188, 66, 0.18);
        color: #fff4d2;
        padding: 9px 14px;
        font-size: 14px;
        cursor: pointer;
      }

      .choice-actions button:first-child {
        background: rgba(255, 188, 66, 0.72);
        color: #211306;
        font-weight: 700;
      }
    </style>
  </head>

  <body data-scene="materials">
    <div id="startScreen" class="start-screen">
      <div class="start-content">
        <div>
          <p class="start-kicker">Tongguan Kiln Iron Flower VR Game</p>
          <h1 class="start-title">Iron Soul</h1>
          <p class="start-subtitle">铜官窑 · 打铁花 / Intangible Heritage Iron Flower Experience</p>
        </div>
        <div>
          <button id="startButton" class="start-button" type="button">Start Strike !</button>
          <div class="start-hint">点击按钮开始 / Click to begin</div>
        </div>
      </div>
    </div>

    <button id="langToggle" class="lang-toggle" type="button">English</button>

    <div class="overlay">
      <span class="badge">Iron Flower VR Prototype</span>
      <h1 id="overlayTitle">铜官窑·打铁花</h1>
      <div class="course" id="overlayCourse">设计前沿专题研究-组2</div>
      <p id="overlayIntro">三步体验：选择材料加入炉中、加热点火等待铁水流出、进入表演场景用双手工具打铁花。</p>
    </div>

    <div id="choicePanel" class="choice-panel" hidden>
      <h2 id="choiceTitle">材料名称</h2>
      <p id="choiceBody">材料功能说明</p>
      <div class="choice-actions">
        <button id="choiceYes" type="button">加入熔炉</button>
        <button id="choiceNo" type="button">取消</button>
      </div>
    </div>

    <a-scene
      background="color: #040201"
      renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true"
      xr-mode-ui="enabled: true"
      device-orientation-permission-ui="enabled: true"
      shadow="type: pcfsoft"
      cursor="rayOrigin: mouse"
      raycaster="objects: .clickable"
      manual-interaction
    >
      <a-assets>
        <img id="workshopBg" src="./scene1-vr.jpg" />
        <img id="performanceBg" src="./scene2-vr.jpg" />
        <a-mixin
          id="spark"
          geometry="primitive: sphere; radius: 0.025"
          material="color: #ffb13d; emissive: #ff6a00; emissiveIntensity: 2.6; transparent: true; opacity: 1"
        ></a-mixin>
      </a-assets>

      <a-sky id="environmentSky" src="#workshopBg" color="#040201" rotation="0 -88 0"></a-sky>

      <a-entity id="workshopBackdrop" position="-4.5 2.45 -10.2">
        <a-image
          width="16"
          height="9"
          src="#workshopBg"
          material="shader: flat; side: double; transparent: true; opacity: 0.98"
        ></a-image>
        <a-plane
          position="0 0 -0.035"
          width="16.2"
          height="9.2"
          color="#050302"
          material="shader: flat; transparent: true; opacity: 0.36"
        ></a-plane>
      </a-entity>

      <a-entity id="performanceBackdrop" position="7.2 2.55 -10.4" visible="false">
        <a-image
          width="17"
          height="9.56"
          src="#performanceBg"
          material="shader: flat; side: double; transparent: true; opacity: 0.98"
        ></a-image>
        <a-plane
          position="0 0 -0.035"
          width="17.2"
          height="9.76"
          color="#03070b"
          material="shader: flat; transparent: true; opacity: 0.32"
        ></a-plane>
      </a-entity>

      <a-plane
        rotation="-90 0 0"
        width="34"
        height="34"
        color="#090706"
        material="roughness: 0.88; metalness: 0.04"
        shadow="receive: true"
      ></a-plane>

      <a-entity id="pathGuides">
        <a-ring id="workbenchRing" position="-6.5 0.012 -3.4" rotation="-90 0 0" radius-inner="0.78" radius-outer="0.84" color="#18d0c4" material="transparent: true; opacity: 0.48"></a-ring>
        <a-ring id="furnaceRing" position="-3.6 0.012 -3.4" rotation="-90 0 0" radius-inner="0.78" radius-outer="0.84" color="#ff8a1c" material="transparent: true; opacity: 0.48"></a-ring>
        <a-ring id="bellowsRing" position="-6.5 0.012 -3.4" rotation="-90 0 0" radius-inner="0.78" radius-outer="0.84" color="#18d0c4" material="transparent: true; opacity: 0.48" visible="false"></a-ring>
        <a-cylinder id="workbenchConnector" position="-5.05 0.018 -3.4" radius="0.022" height="2.9" rotation="0 0 90" color="#20d4ff" material="transparent: true; opacity: 0.3"></a-cylinder>
        <a-cylinder id="bellowsConnector" position="-5.05 0.018 -3.4" radius="0.022" height="2.9" rotation="0 0 90" color="#ffaa55" material="transparent: true; opacity: 0.3" visible="false"></a-cylinder>
      </a-entity>

      <a-entity id="kiln-tower" position="7.2 0 -7.2">
        <a-cylinder position="0 0.18 0" radius="1.24" height="0.36" color="#2f1206"></a-cylinder>
        <a-cylinder position="0 0.72 0" radius="0.9" height="0.74" color="#5e2609"></a-cylinder>
        <a-cylinder position="0 1.3 0" radius="0.7" height="0.56" color="#87380c"></a-cylinder>
        <a-cylinder position="0 1.82 0" radius="0.54" height="0.48" color="#a85610"></a-cylinder>
        <a-cone
          position="0 2.22 0"
          radius-bottom="0.9"
          radius-top="0.16"
          height="0.42"
          color="#dc8619"
          material="metalness: 0.12; roughness: 0.45"
        ></a-cone>
        <a-cone
          position="0 2.63 0"
          radius-bottom="0.38"
          radius-top="0.03"
          height="0.55"
          color="#ffb02e"
          material="emissive: #9a4600; emissiveIntensity: 0.45"
        ></a-cone>
      </a-entity>

      <a-entity id="flowerShed" position="7.2 0 -5.2">
        <a-cylinder position="-1.25 1.4 0" radius="0.035" height="2.8" color="#6b3b18"></a-cylinder>
        <a-cylinder position="1.25 1.4 0" radius="0.035" height="2.8" color="#6b3b18"></a-cylinder>
        <a-cylinder position="0 2.75 0" radius="0.03" height="2.7" rotation="0 0 90" color="#8a521f"></a-cylinder>
        <a-cylinder position="0 2.45 0.15" radius="0.022" height="2.55" rotation="84 0 90" color="#3f6d2d"></a-cylinder>
        <a-cylinder position="0 2.45 -0.15" radius="0.022" height="2.55" rotation="96 0 90" color="#3f6d2d"></a-cylinder>
        <a-sphere position="-0.8 2.52 0" radius="0.055" color="#ffb13d" material="emissive: #ff6a00; emissiveIntensity: 0.9"></a-sphere>
        <a-sphere position="0 2.65 0" radius="0.055" color="#ffb13d" material="emissive: #ff6a00; emissiveIntensity: 0.9"></a-sphere>
        <a-sphere position="0.8 2.52 0" radius="0.055" color="#ffb13d" material="emissive: #ff6a00; emissiveIntensity: 0.9"></a-sphere>
      </a-entity>

      <a-entity
        id="labelShed"
        position="7.2 3.35 -5.2"
        canvas-label="text: 花棚与柳枝; width: 2.55; height: 0.5"
        face-camera
      ></a-entity>

      <a-entity id="materialSelection" position="-6.5 0 -3.4">
        <!-- TABLETOP: thick hammered iron slab -->
        <a-box position="0 0.55 0" width="3.8" height="0.1" depth="1.4"
          color="#2a2520" material="metalness: 0.7; roughness: 0.45"></a-box>

        <!-- APRON: slightly recessed skirt under the tabletop -->
        <a-box position="0 0.45 0" width="3.74" height="0.08" depth="1.26"
          color="#1f1a16" material="metalness: 0.7; roughness: 0.5"></a-box>

        <!-- 4 SQUARE CAPS where each leg meets the apron -->
        <a-box position="-1.78 0.41 -0.62" width="0.13" height="0.06" depth="0.13"
          color="#1f1a16" material="metalness: 0.75; roughness: 0.4"></a-box>
        <a-box position="1.78 0.41 -0.62" width="0.13" height="0.06" depth="0.13"
          color="#1f1a16" material="metalness: 0.75; roughness: 0.4"></a-box>
        <a-box position="-1.78 0.41 0.62" width="0.13" height="0.06" depth="0.13"
          color="#1f1a16" material="metalness: 0.75; roughness: 0.4"></a-box>
        <a-box position="1.78 0.41 0.62" width="0.13" height="0.06" depth="0.13"
          color="#1f1a16" material="metalness: 0.75; roughness: 0.4"></a-box>

        <!-- 4 CYLINDRICAL LEGS at the corners -->
        <a-cylinder position="-1.78 0.21 -0.62" radius="0.05" height="0.36"
          color="#2a2520" material="metalness: 0.72; roughness: 0.45"></a-cylinder>
        <a-cylinder position="1.78 0.21 -0.62" radius="0.05" height="0.36"
          color="#2a2520" material="metalness: 0.72; roughness: 0.45"></a-cylinder>
        <a-cylinder position="-1.78 0.21 0.62" radius="0.05" height="0.36"
          color="#2a2520" material="metalness: 0.72; roughness: 0.45"></a-cylinder>
        <a-cylinder position="1.78 0.21 0.62" radius="0.05" height="0.36"
          color="#2a2520" material="metalness: 0.72; roughness: 0.45"></a-cylinder>

        <!-- 4 SQUARE FEET at the bottom of each leg -->
        <a-box position="-1.78 0.025 -0.62" width="0.14" height="0.05" depth="0.14"
          color="#1f1a16" material="metalness: 0.7; roughness: 0.5"></a-box>
        <a-box position="1.78 0.025 -0.62" width="0.14" height="0.05" depth="0.14"
          color="#1f1a16" material="metalness: 0.7; roughness: 0.5"></a-box>
        <a-box position="-1.78 0.025 0.62" width="0.14" height="0.05" depth="0.14"
          color="#1f1a16" material="metalness: 0.7; roughness: 0.5"></a-box>
        <a-box position="1.78 0.025 0.62" width="0.14" height="0.05" depth="0.14"
          color="#1f1a16" material="metalness: 0.7; roughness: 0.5"></a-box>

        <!-- BOTTOM STRETCHERS: two long rails along the length, joined by a centre cross-piece -->
        <a-box position="0 0.11 -0.62" width="3.5" height="0.045" depth="0.05"
          color="#2a2520" material="metalness: 0.72; roughness: 0.5"></a-box>
        <a-box position="0 0.11 0.62" width="3.5" height="0.045" depth="0.05"
          color="#2a2520" material="metalness: 0.72; roughness: 0.5"></a-box>
        <a-box position="0 0.11 0" width="0.05" height="0.045" depth="1.2"
          color="#2a2520" material="metalness: 0.72; roughness: 0.5"></a-box>

        <!-- RIVETS on the apron at each corner -->
        <a-sphere position="-1.72 0.45 -0.635" radius="0.018" color="#4a3e30" material="metalness: 0.85; roughness: 0.35"></a-sphere>
        <a-sphere position="1.72 0.45 -0.635" radius="0.018" color="#4a3e30" material="metalness: 0.85; roughness: 0.35"></a-sphere>
        <a-sphere position="-1.72 0.45 0.635" radius="0.018" color="#4a3e30" material="metalness: 0.85; roughness: 0.35"></a-sphere>
        <a-sphere position="1.72 0.45 0.635" radius="0.018" color="#4a3e30" material="metalness: 0.85; roughness: 0.35"></a-sphere>

        <!-- Row 1: 煨子, 铁钳, 勺子, 木板, 高岭土 (all incorrect/tools) -->
        <a-entity id="matCrucible" class="clickable material-item" position="-1.4 0.71 -0.35" material-choice="key: crucible; correct: false">
          <a-cylinder radius="0.13" height="0.22" color="#c9b890" material="roughness: 0.85"></a-cylinder>
          <a-cylinder position="0 0.12 0" radius="0.14" height="0.03" color="#9e8868"></a-cylinder>
        </a-entity>

        <a-entity id="matTongs" class="clickable material-item" position="-0.7 0.78 -0.35" material-choice="key: tongs; correct: false">
          <a-cylinder position="-0.04 0 0" radius="0.015" height="0.36" rotation="0 0 8" color="#3a2a1c"></a-cylinder>
          <a-cylinder position="0.04 0 0" radius="0.015" height="0.36" rotation="0 0 -8" color="#3a2a1c"></a-cylinder>
          <a-box position="0 -0.16 0" width="0.12" height="0.04" depth="0.05" color="#5a4030"></a-box>
        </a-entity>

        <a-entity id="matLadle" class="clickable material-item" position="0 0.62 -0.35" material-choice="key: ladle; correct: false">
          <a-cylinder position="-0.05 0.04 0" radius="0.08" height="0.05" color="#2b170c"></a-cylinder>
          <a-cylinder position="0.15 0 0" radius="0.014" height="0.4" rotation="0 0 90" color="#8a521f"></a-cylinder>
        </a-entity>

        <a-entity id="matPaddle" class="clickable material-item" position="0.7 0.6 -0.35" material-choice="key: paddle; correct: false">
          <a-box position="-0.06 0.04 0" width="0.16" height="0.04" depth="0.1" color="#7c3a16"></a-box>
          <a-cylinder position="0.13 0.04 0" radius="0.014" height="0.34" rotation="0 0 90" color="#5c2a11"></a-cylinder>
        </a-entity>

        <a-entity id="matClay" class="clickable material-item" position="1.4 0.6 -0.35" material-choice="key: clay; correct: false">
          <!-- Dark iron dish floor -->
          <a-cylinder position="0 0.006 0" radius="0.14" height="0.012"
            color="#2a2520" material="metalness: 0.6; roughness: 0.55"></a-cylinder>
          <!-- Raised dish rim (torus around the edge) -->
          <a-torus position="0 0.014 0" radius="0.13" radius-tubular="0.011"
            rotation="90 0 0" color="#1f1a16" material="metalness: 0.65; roughness: 0.55"></a-torus>
          <!-- Subtle rust patina on the dish -->
          <a-cylinder position="0.06 0.013 0.05" radius="0.025" height="0.002"
            color="#4a2c14" material="metalness: 0.45; roughness: 0.85"></a-cylinder>
          <a-cylinder position="-0.08 0.013 -0.04" radius="0.02" height="0.002"
            color="#3a2010" material="metalness: 0.45; roughness: 0.85"></a-cylinder>

          <!-- Kaolin clay chunks piled in center (irregular white lumps) -->
          <a-sphere position="0 0.055 0" radius="0.04" scale="1.1 0.95 1.05"
            color="#f0eae0" material="roughness: 0.92; metalness: 0.02"></a-sphere>
          <a-sphere position="-0.035 0.045 0.028" radius="0.032" scale="1.05 0.9 1.1"
            color="#f5f0e8" material="roughness: 0.92; metalness: 0.02"></a-sphere>
          <a-sphere position="0.038 0.05 -0.022" radius="0.035" scale="1 1.05 0.95"
            color="#eae5db" material="roughness: 0.92; metalness: 0.02"></a-sphere>
          <a-sphere position="-0.025 0.03 -0.04" radius="0.028" scale="1.1 0.9 1"
            color="#f0eae0" material="roughness: 0.92; metalness: 0.02"></a-sphere>
          <a-sphere position="0.045 0.03 0.035" radius="0.027" scale="0.95 1.05 1.1"
            color="#f5f0e8" material="roughness: 0.92; metalness: 0.02"></a-sphere>
          <a-sphere position="0.005 0.085 0.008" radius="0.026" scale="1.1 0.95 1"
            color="#f8f3eb" material="roughness: 0.92; metalness: 0.02"></a-sphere>
          <a-sphere position="-0.06 0.03 0.005" radius="0.022" scale="1 1.1 0.95"
            color="#ece6dc" material="roughness: 0.92; metalness: 0.02"></a-sphere>

          <!-- Powder spillage on the dish (flat soft mounds) -->

      AFRAME.registerComponent("canvas-label", {
        schema: {
          text: { default: "" },
          width: { default: 2.4 },
          height: { default: 0.58 },
          background: { default: "rgba(18, 10, 4, 0.72)" },
          border: { default: "#ffbd42" },
          color: { default: "#fff4d2" },
        },

        init: function () {
          this.drawLabel();
        },

        update: function () {
          this.drawLabel();
        },

        drawLabel: function () {
          var canvas = document.createElement("canvas");
          var context = canvas.getContext("2d");
          var scale = 3;
          canvas.width = Math.round(720 * scale);
          canvas.height = Math.round(220 * scale);

          context.scale(scale, scale);
          this.roundRect(context, 0, 0, 720, 220, 28, this.data.background, this.data.border);

          // Split on pipe: line1 = title (large), line2 = subtitle (small)
          var parts = (this.data.text || "").split("|");
          var title = parts[0] || "";
          var subtitle = parts[1] || "";

          context.textAlign = "center";
          context.textBaseline = "middle";

          if (subtitle) {
            // Two-line layout: title (wrappable up to 2 lines) + subtitle below
            context.fillStyle = this.data.color;
            context.font = "700 38px Arial, PingFang SC, Microsoft YaHei, sans-serif";
            // Pre-wrap title to know how many lines it needs
            var titleLines = this.computeWrappedLines(context, title, 660, 2);
            var titleLineHeight = 44;
            var titleBlockHeight = titleLines.length * titleLineHeight;
            // Vertically position: title block at top half, subtitle below
            var titleStartY = 40 + titleLineHeight / 2;
            titleLines.forEach(function (lineText, idx) {
              context.fillText(lineText, 360, titleStartY + idx * titleLineHeight, 660);
            });

            context.fillStyle = "#ffd37a";
            context.font = "400 24px Arial, PingFang SC, Microsoft YaHei, sans-serif";
            var subtitleStartY = titleStartY + titleBlockHeight + 18;
            this.wrapText(context, subtitle, 360, subtitleStartY + 16, 660, 30, 3);
          } else {
            // Single line: centered
            context.fillStyle = this.data.color;
            context.font = "700 42px Arial, PingFang SC, Microsoft YaHei, sans-serif";
            this.wrapText(context, title, 360, 110, 660, 50, 3);
          }

          var texture = new THREE.CanvasTexture(canvas);
          texture.needsUpdate = true;
          texture.minFilter = THREE.LinearFilter;

          if (this.mesh) {
            this.el.object3D.remove(this.mesh);
            this.mesh.geometry.dispose();
            this.mesh.material.map.dispose();
            this.mesh.material.dispose();
          }

          var geometry = new THREE.PlaneGeometry(this.data.width, this.data.height);
          var material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false,
          });

          this.mesh = new THREE.Mesh(geometry, material);
          this.el.object3D.add(this.mesh);
        },

        wrapText: function (context, text, x, y, maxWidth, lineHeight, maxLines) {
          var displayLines = this.computeWrappedLines(context, text, maxWidth, maxLines);
          var startY = displayLines.length > 1 ? y - ((displayLines.length - 1) * lineHeight) / 2 : y;

          displayLines.forEach(function (lineText, index) {
            context.fillText(lineText, x, startY + index * lineHeight, maxWidth);
          });
        },

        computeWrappedLines: function (context, text, maxWidth, maxLines) {
          var tokens = (text || "").match(/[\u4e00-\u9fff]|[^\s\u4e00-\u9fff]+/g) || [text || ""];
          var lines = [];
          var line = "";

          tokens.forEach(function (token) {
            var separator = /[\u4e00-\u9fff]/.test(token) ? "" : " ";
            var testLine = line ? line + separator + token : token;

            if (context.measureText(testLine).width > maxWidth && line) {
              lines.push(line);
              line = token;
            } else {
              line = testLine;
            }
          });

          if (line) lines.push(line);

          var displayLines = lines.slice(0, maxLines);
          if (lines.length > maxLines && displayLines.length > 0) {
            var lastIdx = displayLines.length - 1;
            displayLines[lastIdx] = displayLines[lastIdx].replace(/\s+$/, "") + "...";
          }
          return displayLines;
        },

        roundRect: function (context, x, y, width, height, radius, fill, stroke) {
          context.beginPath();
          context.moveTo(x + radius, y);
          context.lineTo(x + width - radius, y);
          context.quadraticCurveTo(x + width, y, x + width, y + radius);
          context.lineTo(x + width, y + height - radius);
          context.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
          context.lineTo(x + radius, y + height);
          context.quadraticCurveTo(x, y + height, x, y + height - radius);
          context.lineTo(x, y + radius);
          context.quadraticCurveTo(x, y, x + radius, y);
          context.closePath();
          context.fillStyle = fill;
          context.fill();
          context.strokeStyle = stroke;
          context.lineWidth = 4;
          context.stroke();
        },
      });

          this.mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

        selectFromCenter: function () {

      AFRAME.registerComponent("pico-thumbstick-move", {
        schema: {
          speed: { default: 1.8 },
          turnSpeed: { default: 90 },
          deadzone: { default: 0.18 },
        },

        init: function () {
          this.move = new THREE.Vector3();
          this.forward = new THREE.Vector3();
          this.right = new THREE.Vector3();
          this.camera = document.querySelector("#mainCamera");
          this.eventInput = { moveX: 0, moveY: 0, turnX: 0, time: 0 };
          this.attachAxisEvents();
        },

        tick: function (time, delta) {
          var gamepadInput = this.readGamepadAxes();
          if (!gamepadInput) return;

          var dt = Math.min(delta / 1000, 0.05);
          var moveX = this.applyDeadzone(gamepadInput.moveX);
          var moveY = this.applyDeadzone(gamepadInput.moveY);
          var turnX = this.applyDeadzone(gamepadInput.turnX);

          if (Math.abs(moveX) > 0 || Math.abs(moveY) > 0) {
            this.moveRig(moveX, moveY, dt);
          }

          if (Math.abs(turnX) > 0) {
            this.el.object3D.rotation.y -= THREE.MathUtils.degToRad(turnX * this.data.turnSpeed * dt);
          }
        },

        readGamepadAxes: function () {
          return this.readWebXRAxes() || this.readNavigatorAxes() || this.readRecentAxisEvent();
        },

        readWebXRAxes: function () {
          var renderer = this.el.sceneEl && this.el.sceneEl.renderer;
          var xr = renderer && renderer.xr;
          var session = xr && xr.getSession ? xr.getSession() : null;
          if (!session || !session.inputSources) return null;

          var leftMove = null;
          var rightMove = null;
          var fallbackMove = null;

          Array.from(session.inputSources).forEach(function (source) {
            if (!source || !source.gamepad || !source.gamepad.axes) return;

            var pair = this.findPrimaryAxisPair(source.gamepad.axes);
            if (!pair) return;

            if (source.handedness === "left") {
              leftMove = pair;
            } else if (source.handedness === "right") {
              rightMove = pair;
            }

            if (!fallbackMove || pair.strength > fallbackMove.strength) {
              fallbackMove = pair;
            }
          }.bind(this));

          if (!leftMove && !rightMove && !fallbackMove) return null;

          var move = leftMove || fallbackMove || rightMove;
          var turnX = leftMove && rightMove ? rightMove.x : 0;

          return {
            moveX: move.x,
            moveY: move.y,
            turnX: turnX,
          };
        },

        readNavigatorAxes: function () {
          var pads = navigator.getGamepads ? navigator.getGamepads() : [];
          var bestMove = null;
          var bestTurn = 0;

          for (var i = 0; i < pads.length; i += 1) {
            var pad = pads[i];
            if (!pad || !pad.axes || pad.axes.length < 2) continue;

            var pair = this.findPrimaryAxisPair(pad.axes);
            if (!pair) continue;

            if (!bestMove || pair.strength > bestMove.strength) {
              bestMove = pair;
            } else if (Math.abs(pair.x) > Math.abs(bestTurn)) {
              bestTurn = pair.x;
            }
          }

          if (!bestMove) return null;

          return {
            moveX: bestMove.x,
            moveY: bestMove.y,
            turnX: bestTurn,
          };
        },

        readRecentAxisEvent: function () {
          if (performance.now() - this.eventInput.time > 350) return null;
          return {
            moveX: this.eventInput.moveX,
            moveY: this.eventInput.moveY,
            turnX: this.eventInput.turnX,
          };
        },

        attachAxisEvents: function () {
          var leftHand = document.querySelector("#leftHand");
          var rightHand = document.querySelector("#rightHand");
          var events = ["axismove", "thumbstickmoved", "trackpadmoved"];

          if (leftHand) {
            events.forEach(function (eventName) {
              leftHand.addEventListener(eventName, function (event) {
                var pair = this.axisPairFromEvent(event);
                if (!pair) return;
                this.eventInput.moveX = pair.x;
                this.eventInput.moveY = pair.y;
                this.eventInput.time = performance.now();
              }.bind(this));
            }.bind(this));
          }

          if (rightHand) {
            events.forEach(function (eventName) {
              rightHand.addEventListener(eventName, function (event) {
                var pair = this.axisPairFromEvent(event);
                if (!pair) return;
                this.eventInput.moveX = pair.x;
                this.eventInput.moveY = pair.y;
                this.eventInput.turnX = 0;
                this.eventInput.time = performance.now();
              }.bind(this));
            }.bind(this));
          }
        },

        axisPairFromEvent: function (event) {
          var detail = event.detail || {};

          if (typeof detail.x === "number" && typeof detail.y === "number") {
            return { x: detail.x, y: detail.y, strength: Math.sqrt(detail.x * detail.x + detail.y * detail.y) };
          }

          if (detail.axis && detail.axis.length >= 2) {
            return this.findPrimaryAxisPair(detail.axis);
          }

          if (detail.axes && detail.axes.length >= 2) {
            return this.findPrimaryAxisPair(detail.axes);
          }

          return null;
        },

        findPrimaryAxisPair: function (axes) {
          if (!axes || axes.length < 2) return null;

          var candidates = [];

          if (axes.length >= 4) {
            candidates.push({ x: axes[2] || 0, y: axes[3] || 0, priority: 2 });
          }

          candidates.push({ x: axes[0] || 0, y: axes[1] || 0, priority: 1 });

          for (var i = 0; i < axes.length - 1; i += 2) {
            candidates.push({ x: axes[i] || 0, y: axes[i + 1] || 0, priority: 0 });
          }

          var best = null;
          candidates.forEach(function (candidate) {
            var strength = Math.sqrt(candidate.x * candidate.x + candidate.y * candidate.y);
            candidate.strength = strength;

            if (strength <= this.data.deadzone) return;
            if (!best || candidate.priority > best.priority || strength > best.strength + 0.12) {
              best = candidate;
            }
          }.bind(this));

          return best;
        },

        findStrongestAxisPair: function (axes) {
          var best = null;

          for (var i = 0; i < axes.length - 1; i += 2) {
            var x = axes[i] || 0;
            var y = axes[i + 1] || 0;
            var strength = Math.sqrt(x * x + y * y);

            if (strength > this.data.deadzone && (!best || strength > best.strength)) {
              best = { x: x, y: y, strength: strength };
            }
          }

          return best;
        },

        applyDeadzone: function (value) {
          if (Math.abs(value) < this.data.deadzone) return 0;
          var sign = value < 0 ? -1 : 1;
          return sign * ((Math.abs(value) - this.data.deadzone) / (1 - this.data.deadzone));
        },

        moveRig: function (moveX, moveY, dt) {
          var yaw = this.getCameraYaw();
          var distance = this.data.speed * dt;
          var forwardAmount = -moveY;
          var rightAmount = -moveX;

          this.forward.set(Math.sin(yaw), 0, Math.cos(yaw));
          this.right.set(Math.cos(yaw), 0, -Math.sin(yaw));
          this.move.copy(this.forward).multiplyScalar(forwardAmount);
          this.move.addScaledVector(this.right, rightAmount);

          if (this.move.lengthSq() > 1) this.move.normalize();
          this.move.multiplyScalar(distance);
          this.el.object3D.position.add(this.move);
        },

        getCameraYaw: function () {
          if (!this.camera) return this.el.object3D.rotation.y;

          var direction = new THREE.Vector3();
          this.camera.object3D.getWorldDirection(direction);
          return Math.atan2(-direction.x, -direction.z);
        },
      });

      function refreshChoicePanelLanguage() {

        var text = uiText[currentLanguage];
        var titleEl = document.querySelector("#choiceTitle");
        var bodyEl = document.querySelector("#choiceBody");
        var yesBtn = document.querySelector("#choiceYes");
        var noBtn = document.querySelector("#choiceNo");

        if (pendingChoice.kind === "material") {
          var info = materialInfo[pendingChoice.key];
          if (info && info[currentLanguage]) {
            if (titleEl) titleEl.textContent = info[currentLanguage].name;
            var suffix = pendingChoice.alreadyAdded
              ? (currentLanguage === "zh" ? "（已加入）" : " (Already added)")
              : (currentLanguage === "zh" ? " 是否加入熔炉？" : " Add to furnace?");
            if (bodyEl) bodyEl.textContent = info[currentLanguage].desc + suffix;
          }
          if (yesBtn) {
            yesBtn.textContent = pendingChoice.alreadyAdded
              ? (currentLanguage === "zh" ? "确定" : "OK")
              : text.choiceYes;
            yesBtn.style.display = "";
          }
          if (noBtn) {
            noBtn.style.display = pendingChoice.alreadyAdded ? "none" : "";
          }
        } else if (pendingChoice.kind === "furnace") {
          var fi = materialInfo.furnace[currentLanguage];
          if (titleEl) titleEl.textContent = fi.name;
          if (bodyEl) bodyEl.textContent = fi.desc + (currentLanguage === "zh" ? " 是否启用熔炉？" : " Activate furnace?");
          if (yesBtn) {
            yesBtn.textContent = text.furnaceYes;
            yesBtn.style.display = "";
          }
          if (noBtn) noBtn.style.display = "";
        } else if (pendingChoice.kind === "error") {
          if (titleEl) titleEl.textContent = currentLanguage === "zh" ? "材料错误" : "Wrong Material";
          if (bodyEl) bodyEl.textContent = currentLanguage === "zh" ? "材料错误，无法添加" : "Wrong material — cannot be added.";
          if (yesBtn) {
            yesBtn.textContent = currentLanguage === "zh" ? "确定" : "OK";
            yesBtn.style.display = "";

          if (noBtn) noBtn.style.display = "none";

        if (noBtn && noBtn.style.display !== "none") noBtn.textContent = text.choiceNo;
      }

      function confirmChoice() {
        if (!pendingChoice) {
          closeChoicePanel();
          return;

        if (pendingChoice.kind === "error") {
          closeChoicePanel();
          return;
        }

        if (pendingChoice.kind === "material") {
          var el = pendingChoice.el;
          var key = pendingChoice.key;
          var correct = pendingChoice.correct;
          var wasAlreadyAdded = pendingChoice.alreadyAdded;
          closeChoicePanel();
          if (wasAlreadyAdded) {
            // Re-click on already-added material: just close the description panel
            return;
          }
          processMaterialChoice(el, key, correct);
          return;

        if (pendingChoice.kind === "furnace") {
          closeChoicePanel();

            setStatus(
              "请先把 5 项正确材料加入炉前准备区",

      function flyMaterialToPrep(el, key) {
        var root = document.querySelector("#fireworks");
        var from = new THREE.Vector3();
        el.object3D.getWorldPosition(from);

        var material = el.cloneNode(true);
        material.setAttribute("position", from.x + " " + from.y + " " + from.z);
        material.setAttribute("scale", "1 1 1");
        stripMaterialCloneInteraction(material);

        // Single parabolic trajectory into the furnace mouth.
        //   Furnace world centre = (-3.6, 0, -3.4); rim top y ≈ 0.86; cavity floor (charcoal) y ≈ 0.18
        root.appendChild(material);
        animateMaterialIntoFurnace(material, from);
      }

      function stripMaterialCloneInteraction(material) {
        var nodes = [material].concat(Array.prototype.slice.call(material.querySelectorAll("[id], .clickable, [material-choice]")));
        nodes.forEach(function (node) {
          node.removeAttribute("id");
          node.removeAttribute("material-choice");
          node.classList.remove("clickable");
          node.classList.remove("material-item");
        });
      }

      function animateMaterialIntoFurnace(material, from) {
        var inside = new THREE.Vector3(-3.6, 0.55, -3.4);
        var mouth = new THREE.Vector3(-3.6, 1.18, -3.4);
        var peakY = Math.max(from.y, mouth.y) + 0.36;
        var approachEnd = 0.7;
        var flightDuration = 760;
        var vanishDuration = 240;
        var totalDuration = flightDuration + vanishDuration;
        var startTime = performance.now();

        function easeInQuad(t) {
          return t * t;
        }

        function easeOutQuad(t) {
          return t * (2 - t);
        }

        function mix(a, b, t) {
          return a + (b - a) * t;
        }

        function smoothstep(t) {
          return t * t * (3 - 2 * t);
        }

        function quadratic(a, b, c, t) {
          var oneMinusT = 1 - t;
          return oneMinusT * oneMinusT * a + 2 * oneMinusT * t * b + t * t * c;
        }

        function render(now) {
          var elapsed = now - startTime;
          var position = material.object3D.position;
          var scale = material.object3D.scale;
          var progress;

          if (elapsed <= flightDuration) {
            progress = elapsed / flightDuration;
            if (progress < approachEnd) {
              var approachProgress = progress / approachEnd;
              var horizontalProgress = smoothstep(approachProgress);
              position.set(
                mix(from.x, mouth.x, horizontalProgress),
                quadratic(from.y, peakY, mouth.y, approachProgress),
                mix(from.z, mouth.z, horizontalProgress)
            );
          } else {
              var dropProgress = easeOutQuad((progress - approachEnd) / (1 - approachEnd));
              position.set(
                mouth.x,
                mix(mouth.y, inside.y, dropProgress),
                mouth.z
              );
            }
            scale.setScalar(mix(1, 0.4, progress));
          } else if (elapsed <= totalDuration) {
            progress = easeInQuad((elapsed - flightDuration) / vanishDuration);
            position.copy(inside);
            scale.setScalar(mix(0.4, 0.01, progress));
          } else {
            material.remove();
            return;
          }

          requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
      }

      function randomizeMaterialPositions() {
        var items = Array.prototype.slice.call(document.querySelectorAll(".material-item"));
        if (items.length === 0) return;

        // Predefined 2×5 slot grid matching the workbench layout.
        // Using fixed coordinates (not getAttribute) avoids any A-Frame
        // timing/parsing issue where the position component may not be
        // ready yet when this runs during the window load handler.
        var slots = [
          { x: -1.4, z: -0.35 },
          { x: -0.7, z: -0.35 },
          { x:  0.0, z: -0.35 },
          { x:  0.7, z: -0.35 },
          { x:  1.4, z: -0.35 },
          { x: -1.4, z:  0.32 },
          { x: -0.7, z:  0.32 },
          { x:  0.0, z:  0.32 },
          { x:  0.7, z:  0.32 },
          { x:  1.4, z:  0.32 },
        ];

        // Fisher–Yates shuffle of slot order
        for (var i = slots.length - 1; i > 0; i -= 1) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = slots[i];
          slots[i] = slots[j];
          slots[j] = tmp;
        }

        // Assign shuffled slots back, preserving each item's own y if known
        items.forEach(function (el, idx) {
          if (idx >= slots.length) return;
          var pos = el.getAttribute("position");
          var y = (pos && typeof pos.y === "number" && !isNaN(pos.y)) ? pos.y : 0.2;
          var slot = slots[idx];
          el.setAttribute("position", slot.x + " " + y + " " + slot.z);
        });
      }

        );

      function updateHeatingProgress() {
        if (!heatingActive) return;

        var now = performance.now();
        var dt = Math.min((now - heatLastTick) / 1000, 0.08);
        heatLastTick = now;
        heatTemperature = Math.max(0, heatTemperature - 15 * dt);
        if (heatTemperature > heatMin && heatTemperature < heatMax) {
          heatHoldTime += dt;
        } else if (heatTemperature > heatMax + 8 || heatTemperature < heatMin - 10) {
          heatHoldTime = Math.max(0, heatHoldTime - 1.5 * dt);
        }

        var progress = Math.min(heatTemperature / 100, 1);
        var holdProgress = Math.min(heatHoldTime / 5, 1);
        // Map bar % → degrees Celsius: 62 % = 1200 °C, 82 % = 1500 °C (linear)
        var tempC = Math.round(270 + heatTemperature * 15);
        var fill = document.querySelector("#heatingFill");
        var readout = document.querySelector("#temperatureReadout");
        var holdReadout = document.querySelector("#heatHoldReadout");
        var statusHint = document.querySelector("#heatStatusHint");
        var heatStateZh = heatTemperature > heatMax ? "过热：暂停拉风箱" : heatTemperature >= heatMin ? "合适：保持节奏" : "偏低：拉风箱供氧";
        var heatStateEn = heatTemperature > heatMax ? "Too hot: pause" : heatTemperature >= heatMin ? "Good: hold rhythm" : "Too low: pull bellows";
        var heatColor = heatTemperature > heatMax ? "#ff3b1f" : heatTemperature >= heatMin ? "#20d482" : "#ff9b26";
        if (fill) {
          fill.object3D.scale.x = Math.max(0.01, progress);
          fill.setAttribute("position", (-0.78 + progress * 0.76) + " 0 0.025");
          fill.setAttribute("color", heatColor);
        }
        if (readout) {
          var readoutText = currentLanguage === "zh"
            ? "熔炉温度 " + tempC + " °C"
            : "Furnace " + tempC + " °C";
          readout.setAttribute("value", readoutText);
          readout.setAttribute("color", heatColor);
        }
        if (holdReadout) {
          var holdText = currentLanguage === "zh"
            ? "已控温 " + heatHoldTime.toFixed(1) + " / 5.0 秒"
            : "Hold " + heatHoldTime.toFixed(1) + " / 5.0 sec";
          holdReadout.setAttribute("value", holdText);
        }
        if (statusHint) {
          var hintText = currentLanguage === "zh"
            ? "目标温区 1200-1500 °C｜" + heatStateZh
            : "Target zone 1200-1500 °C | " + heatStateEn;
          statusHint.setAttribute("value", hintText);
          statusHint.setAttribute("color", heatColor);
        }

        if (performance.now() - lastHeatingEmber > 260) {
          lastHeatingEmber = performance.now();
          createFurnaceEmbers(document.querySelector("#furnace"), 8 + Math.floor(progress * 12), 0.35 + progress * 0.65);
          addFurnaceGlow(document.querySelector("#furnace"), 2.4 + progress * 3.4, "#ff9b26");
          setStatus(
            "温度 " + Math.round(heatTemperature) + "%｜" + heatStateZh + "｜稳定 " + heatHoldTime.toFixed(1) + "/5 秒",
            "Heat " + Math.round(heatTemperature) + "% | " + heatStateEn + " | Stable " + heatHoldTime.toFixed(1) + "/5 sec"
          );
        }

        if (heatHoldTime >= 5) completeHeating();
      }

      function completeHeating() {
        if (!heatingActive) return;
        heatingActive = false;
        moltenIronReady = true;
        var furnace = document.querySelector("#furnace");
        var stream = document.querySelector("#moltenStream");

        if (stream) stream.setAttribute("visible", "true");
        addFurnaceGlow(furnace, 5.8, "#ffb13d");
        createFurnaceEmbers(furnace, 60, 0.72);
        setStatus(
          "材料准备完成：铁水从熔炉流出，进入下一阶段",
          "Material Preparation Complete: molten iron flows from the furnace, moving to the next stage"
        );

        setTimeout(function () {
          goToScene("scene-practice.html");
        }, 1300);
      }

      function pullBellows() {
        if (!materialSelectionComplete) {
          setStatus(
            "先把 5 项正确材料加入炉前准备区",
            "First add all 5 correct materials to the preparation zone"
          );
          return;
        }

        if (!furnacePrepared) {
          setStatus(
            "请先点击熔炉启用，再拉风箱供氧",
            "Activate the furnace first, then pull the bellows"
          );
          return;
        }

        if (moltenIronReady) {
          setStatus(
            "铁水已经流出：材料准备完成",
            "Molten iron has flowed out: material preparation complete"
          );
          return;
        }

        var boost = heatTemperature < 55 ? 9 : heatTemperature < heatMin ? 7 : heatTemperature < heatMax ? 4.5 : 2.5;
        heatTemperature = Math.min(100, heatTemperature + boost);
        animateBellows();
        createBellowsAirPuff();
        createFurnaceEmbers(document.querySelector("#furnace"), 16, 0.55 + heatTemperature / 130);
        var stateZh = heatTemperature > heatMax ? "过热，先停一下" : heatTemperature >= heatMin ? "温度合适，保持节奏" : "偏低，继续拉风箱";
        var stateEn = heatTemperature > heatMax ? "Too hot, pause" : heatTemperature >= heatMin ? "Good range, keep rhythm" : "Too low, keep pulling";
        setStatus(
          "拉风箱升温：当前温度 " + Math.round(heatTemperature) + "%｜" + stateZh,
          "Bellows heat up: " + Math.round(heatTemperature) + "% | " + stateEn
        );
      }

      function completeMelting() {
        var furnace = document.querySelector("#furnace");
        moltenIronReady = true;

        var hotspot = document.querySelector("#furnaceHotspot");
        if (hotspot && hasLadle) hotspot.classList.remove("clickable");

        addFurnaceGlow(furnace, 5.4, "#ffb13d");
        createFurnaceEmbers(furnace, 52, 0.65);

        if (hasLadle) {
          fillLadleWithMoltenIron();
          setStatus("铁水已装入左手铁碗，前往击打点", "Molten iron is in the left-hand bowl. Move to the strike point");
          setTimeout(function () {
            setSceneStep(3);
          }, 500);
        } else {
          setStatus("铁水已流出：点击工具站，拿起铁碗和拍板", "Molten iron has flowed out: pick up the bowl and paddle at the tool station");
          setTimeout(function () {
            setSceneStep(3);
            setStatus("步骤 3 表演场：点击工具站，左手端铁碗、右手拿拍板", "Step 3 Performance Scene: click the tool station, bowl in left hand and paddle in right hand");
          }, 650);
        }
      }

      function startPracticeLevel(level) {
        rhythmMode = "practice";
        rhythmLevel = level;
        rhythmScore = level === 1 ? 0 : rhythmScore;
        rhythmMisses = 0;
        rhythmEnded = false;
        rhythmActive = true;
        rhythmStart = performance.now();
        rhythmLastSpawn = 0;
        resetRhythmEntities();
        buildRhythmLanes(rhythmConfigs[level - 1].lanes);
        setStatus("Practice 第 " + level + " 关：30 秒内击中下落铁花，最多失败 3 次", "Practice Level " + level + ": hit falling sparks for 30 sec. You have 3 misses");
      }

      function startPerformanceShow() {
        rhythmMode = "performance";
        rhythmLevel = 1;
        rhythmScore = 0;
        rhythmMisses = 0;
        rhythmEnded = false;
        rhythmActive = true;
        rhythmStart = performance.now();
        rhythmLastSpawn = 0;
        resetRhythmEntities();
        buildRhythmLanes(5);
        setSceneStep(3);
        updateAudienceReaction();
        setStatus("正式表演：60 秒无限生命，击中得分，漏掉扣分", "Performance: 60 seconds, unlimited life. Hits score, misses subtract");
      }

      function resetRhythmEntities() {
        rhythmNotes = [];
        var lanes = document.querySelector("#rhythmLanes");
        var notes = document.querySelector("#rhythmNotes");
        if (lanes) lanes.innerHTML = "";
        if (notes) notes.innerHTML = "";
      }

      function buildRhythmLanes(count) {
        var lanes = document.querySelector("#rhythmLanes");
        var title = document.querySelector("#rhythmTitle");
        if (!lanes) return;

        var spacing = 0.62;
        var total = (count - 1) * spacing;
        for (var i = 0; i < count; i += 1) {
          var x = -total / 2 + i * spacing;
          var lane = document.createElement("a-entity");
          lane.setAttribute("position", x + " 1.85 0");
          lane.innerHTML =
            '<a-cylinder radius="0.018" height="2.5" rotation="0 0 0" color="#ffd37a" material="transparent: true; opacity: 0.34"></a-cylinder>' +
            '<a-ring class="clickable rhythm-hit" data-lane-index="' + i + '" position="0 -1.05 0.03" radius-inner="0.16" radius-outer="0.23" color="#ffbd42" material="transparent: true; opacity: 0.9; emissive: #ff8a00; emissiveIntensity: 0.65"></a-ring>' +
            '<a-text value="' + (i + 1) + '" align="center" width="1.5" position="0 -1.42 0.04" color="#fff4d2"></a-text>';
          lanes.appendChild(lane);
        }

        if (title) {
          var label = rhythmMode === "practice" ? "Practice Mode 第 " + rhythmLevel + " 关" : "Performance Mode 正式表演";
          var body = rhythmMode === "practice" ? "Hit notes in the judgment rings. Three misses fail the level" : "60 seconds, unlimited life. Audience reacts to your score";
          title.setAttribute("canvas-label", "text: " + label + "|" + body + "; width: 4.8; height: 0.72");
        }
      }

      function updateRhythmGame() {
        if (!rhythmActive) return;
        var now = performance.now();
        var config = rhythmMode === "practice" ? rhythmConfigs[rhythmLevel - 1] : { lanes: 5, speed: 1.65, spawn: 610, duration: 60000 };
        var elapsed = now - rhythmStart;
        var hud = document.querySelector("#rhythmHud");

        if (now - rhythmLastSpawn > config.spawn) {
          rhythmLastSpawn = now;
          spawnRhythmNote(config);
        }

        rhythmNotes.slice().forEach(function (note) {
          note.y -= config.speed / 60;
          note.el.setAttribute("position", note.x + " " + note.y + " 0.08");
          if (note.y < 0.48) {
            note.el.remove();
            rhythmNotes.splice(rhythmNotes.indexOf(note), 1);
            registerRhythmMiss();
          }
        });

        if (hud) {
          var remaining = Math.max(0, Math.ceil((config.duration - elapsed) / 1000));
          if (rhythmMode === "practice") {
            hud.setAttribute("value", "Practice " + rhythmLevel + "/3   Time " + remaining + "   Miss " + rhythmMisses + "/3   Score " + rhythmScore);
          } else {
            hud.setAttribute("value", "Performance   Time " + remaining + "   Score " + rhythmScore + "   Miss " + rhythmMisses);
          }
        }

        if (rhythmMode === "practice" && rhythmMisses >= 3) {
          restartPracticeLevel();
          return;
        }

        if (elapsed >= config.duration && !rhythmEnded) {
          rhythmEnded = true;
          if (rhythmMode === "practice") {
            if (rhythmLevel < 3) {
              setStatus("Practice 第 " + rhythmLevel + " 关通过：进入下一关", "Practice Level " + rhythmLevel + " passed: next level");
              setTimeout(function () { startPracticeLevel(rhythmLevel + 1); }, 1200);
            } else {
              rhythmActive = false;
              setStatus("三关通过：获得打铁花表演资质，进入正式表演", "All three levels passed: performance qualification earned");
              setTimeout(function () { goToScene("scene-performance.html"); }, 1500);
            }
          } else {
            rhythmActive = false;
            updateAudienceReaction();
            setStatus("表演结束：最终得分 " + rhythmScore, "Performance complete: final score " + rhythmScore);
          }
        }
      }

      function spawnRhythmNote(config) {
        var lanes = config.lanes;
        var lane = Math.floor(Math.random() * lanes);
        var spacing = 0.62;
        var total = (lanes - 1) * spacing;
        var x = -total / 2 + lane * spacing;
        var note = document.createElement("a-entity");
        note.setAttribute("geometry", "primitive: sphere; radius: 0.075");
        note.setAttribute("position", x + " 3.1 0.08");
        note.setAttribute("material", "color: #fff4c1; emissive: #ff6a00; emissiveIntensity: 2.8; transparent: true; opacity: 1");
        document.querySelector("#rhythmNotes").appendChild(note);
        rhythmNotes.push({ el: note, lane: lane, x: x, y: 3.1 });
      }

      function hitRhythmLane(laneIndex) {
        if (!rhythmActive) return;
        var targetY = 0.8;
        var best = null;
        rhythmNotes.forEach(function (note) {
          if (note.lane !== laneIndex) return;
          var distance = Math.abs(note.y - targetY);
          if (distance <= 0.34 && (!best || distance < best.distance)) {
            best = { note: note, distance: distance };
          }
        });

        if (!best) {
          registerRhythmMiss();
          return;
        }

        var note = best.note;
        rhythmNotes.splice(rhythmNotes.indexOf(note), 1);
        note.el.remove();
        rhythmScore += best.distance < 0.16 ? 120 : 80;
        createFlash(document.querySelector("#fireworks"), sceneStepX[currentSceneStep], 1.15, -3.4, 4, 5, 280);
        if (rhythmMode === "performance") updateAudienceReaction();
      }

      function registerRhythmMiss() {
        if (!rhythmActive) return;
        rhythmMisses += 1;
        rhythmScore = Math.max(0, rhythmScore - (rhythmMode === "performance" ? 45 : 25));
        if (rhythmMode === "performance") updateAudienceReaction();
      }

      function restartPracticeLevel() {
        rhythmActive = false;
        setStatus("Practice 第 " + rhythmLevel + " 关失败：3 次失误已用完，重新开始本关", "Practice Level " + rhythmLevel + " failed: three misses used. Restarting");
        setTimeout(function () {
          startPracticeLevel(rhythmLevel);
        }, 1400);
      }

      function updateAudienceReaction() {
        var reaction = document.querySelector("#audienceReaction");
        if (!reaction) return;
        var text = "观众屏息等待";
        if (rhythmScore >= 2600) text = "满堂喝彩！铁花如瀑";
        else if (rhythmScore >= 1600) text = "掌声热烈，观众惊叹";
        else if (rhythmScore >= 800) text = "观众点头，节奏稳定";
        else if (rhythmMisses > 4) text = "观众有些紧张，注意节奏";
        reaction.setAttribute("value", text + " / Score " + rhythmScore);
      }

      function animateBellows() {
        var body = document.querySelector("#bellowsBody");
        var handle = document.querySelector("#bellowsHandle");
        var dowelTop = document.querySelector("#bellowsDowelTop");
        var dowelBottom = document.querySelector("#bellowsDowelBottom");
        if (!body || !handle) return;

        body.removeAttribute("animation__compress");
        body.removeAttribute("animation__release");
        handle.removeAttribute("animation__pull");
        handle.removeAttribute("animation__return");
        if (dowelTop) {
          dowelTop.removeAttribute("animation__pull_scale");
          dowelTop.removeAttribute("animation__pull_pos");
          dowelTop.removeAttribute("animation__return_scale");
          dowelTop.removeAttribute("animation__return_pos");
        }
        if (dowelBottom) {
          dowelBottom.removeAttribute("animation__pull_scale");
          dowelBottom.removeAttribute("animation__pull_pos");
          dowelBottom.removeAttribute("animation__return_scale");
          dowelBottom.removeAttribute("animation__return_pos");
        }

        body.setAttribute("animation__compress", "property: scale; to: 1 0.62 0.86; dur: 160; easing: easeOutQuad");
        handle.setAttribute("animation__pull", "property: position; to: 0.78 0.15 0; dur: 160; easing: easeOutQuad");

        // Dowels stretch: scale.y 1 → 1.667 (length 0.18 → 0.30) and center slides x 0.57 → 0.63
        // (-X end stays fixed at post edge x=0.48; +X end follows the slab to x=0.78).
        // Y follows the slab: top dowel y 0.28 → 0.21, bottom dowel y 0.18 → 0.11.
        if (dowelTop) {
          dowelTop.setAttribute("animation__pull_scale", "property: scale; to: 1 1.667 1; dur: 160; easing: easeOutQuad");
          dowelTop.setAttribute("animation__pull_pos", "property: position; to: 0.63 0.21 0; dur: 160; easing: easeOutQuad");
        }
        if (dowelBottom) {
          dowelBottom.setAttribute("animation__pull_scale", "property: scale; to: 1 1.667 1; dur: 160; easing: easeOutQuad");
          dowelBottom.setAttribute("animation__pull_pos", "property: position; to: 0.63 0.11 0; dur: 160; easing: easeOutQuad");
        }

        setTimeout(function () {
          body.setAttribute("animation__release", "property: scale; to: 1 1 1; dur: 260; easing: easeOutElastic");
          handle.setAttribute("animation__return", "property: position; to: 0.66 0.22 0; dur: 260; easing: easeOutElastic");
          if (dowelTop) {
            dowelTop.setAttribute("animation__return_scale", "property: scale; to: 1 1 1; dur: 260; easing: easeOutElastic");
            dowelTop.setAttribute("animation__return_pos", "property: position; to: 0.57 0.28 0; dur: 260; easing: easeOutElastic");
          }
          if (dowelBottom) {
            dowelBottom.setAttribute("animation__return_scale", "property: scale; to: 1 1 1; dur: 260; easing: easeOutElastic");
            dowelBottom.setAttribute("animation__return_pos", "property: position; to: 0.57 0.18 0; dur: 260; easing: easeOutElastic");
          }
        }, 170);
      }

      function updateHeatIndicators() {
        for (var i = 1; i <= 3; i += 1) {
          var dot = document.querySelector("#heatDot" + i);
          if (!dot) continue;
          var active = i <= bellowsPulls;
          dot.setAttribute("color", active ? "#ffb13d" : "#3b2a1c");
          dot.setAttribute("material", active ? "emissive: #ff6a00; emissiveIntensity: 1.7" : "");
        }
      }

      function createBellowsAirPuff() {
        var root = document.querySelector("#fireworks");
        // Gas starts at the horn rim and continues to the right, staying left of the furnace.
        // per-particle fade + shrink (size goes 1.3× → 0.35×, opacity 1 → 0) over the
        // particle's lifetime naturally produces the "dense at the vent, thinning to
        // nothing at the far end" gradient the user asked for — no need to scatter
        // the spawn point across the path.
        for (var i = 0; i < 34; i += 1) {
          var puff = document.createElement("a-entity");
          var radius = 0.008 + Math.random() * 0.010;
          var atRim = i < 10;
          var spawnX = atRim ? -5.54 + Math.random() * 0.035 : -5.48 + Math.random() * 0.08;
          var spawnSpread = atRim ? 0.06 : 0.04;
          puff.setAttribute("geometry", "primitive: sphere; radius: " + radius);
          // Tight emission zone at the horn opening (world x ≈ -5.57)
          puff.setAttribute("position",
            spawnX + " " +
            (0.44 + (Math.random() - 0.5) * spawnSpread) + " " +
            (-3.4 + (Math.random() - 0.5) * spawnSpread)
          );
          // Warm gas colors, not mono-orange
          var palette = ["#ffcc72", "#ffaa50", "#ffb86a", "#e89a60", "#f0b07a", "#d68850"];
          var color = palette[Math.floor(Math.random() * palette.length)];
          puff.setAttribute("material",
            "color: " + color +
            "; emissive: #ff7a1a; emissiveIntensity: " + (0.4 + Math.random() * 0.35).toFixed(2) +
            "; transparent: true; opacity: " + (0.42 + Math.random() * 0.25).toFixed(2)
          );
          puff.setAttribute("spark-move", {
            vx: 0.62 + Math.random() * 0.38, // forward toward furnace, but stays left of it
            vy: 0.03 + Math.random() * 0.16, // hot gas rises gently
            vz: (Math.random() - 0.5) * 0.16,// tight lateral drift
            gravity: -0.005,                 // mild negative gravity → continued upward drift
            life: 520 + Math.random() * 260, // 700-1160 ms — fades naturally before piling up at the far end
            delay: Math.random() * 120,      // staggered so the puff streams rather than appearing all at once
            trail: false,
          });
          root.appendChild(puff);
        }
      }

      function addFurnaceGlow(furnace, intensity, color) {
        var glow = document.createElement("a-light");
        glow.setAttribute("type", "point");
        glow.setAttribute("color", color);
        glow.setAttribute("intensity", String(intensity));
        glow.setAttribute("distance", "7");
        glow.setAttribute("position", "0 0.35 0");
        furnace.appendChild(glow);
      }

      function createFurnaceEmbers(furnace, count, heightBoost) {
        for (var i = 0; i < count; i += 1) {
          var ember = document.createElement("a-entity");
          ember.setAttribute("mixin", "spark");
          ember.setAttribute("position", (Math.random() - 0.5) * 0.45 + " 0.28 " + (Math.random() - 0.5) * 0.45);
          ember.setAttribute("scale", "0.55 0.55 0.55");
          ember.setAttribute("spark-move", {
            vx: (Math.random() - 0.5) * 0.28,
            vy: heightBoost + Math.random() * 0.95,
            vz: (Math.random() - 0.5) * 0.28,
            life: 700 + Math.random() * 420,
          });
          furnace.appendChild(ember);
        }
      }

      function toggleToolsAtStation() {
        if (hasLadle) {
          returnToolsToStation();
        } else {
          if (!moltenIronReady) {
            setStatus("工具在第 3 步使用：请先完成材料入炉和 5 秒加热点火", "Tools are used in Step 3: complete materials and the 5-second heating first");

          pickUpLadle();
        }

      function pickUpLadle() {
        if (hasLadle) return;

        hasLadle = true;

        var toolStation = document.querySelector("#ladle");
        toolStation.classList.remove("clickable");
        toolStation.setAttribute("visible", "true");
        setTimeout(function () {
          toolStation.classList.add("clickable");
        }, 250);

        fillLadleWithMoltenIron();

      }

      function returnToolsToStation() {
        var toolStation = document.querySelector("#ladle");
        var bowl = document.querySelector("#heldBowl");
        var paddle = document.querySelector("#heldPaddle");
        var molten = document.querySelector("#heldMoltenIron");

        if (molten) molten.remove();
        if (bowl) bowl.remove();

        ladleLoaded = false;

        }
      }

      function moveLadleToBestAnchor() {

        paddle.setAttribute("id", "heldPaddle");

      function triggerIronFlower() {
        var now = performance.now();
        if (!hasLadle) {
          setStatus("请先点击工具站，左手拿铁碗、右手拿拍板", "Click the tool station first: left hand takes the bowl, right hand takes the paddle");
          return;
        }

        if (!furnacePrepared) {
          setStatus("请先点击炉火完成发炉", "Click the furnace first to prepare it");
          return;
        }

        if (!moltenIronReady || !ladleLoaded) {
          setStatus("请先完成融铁，并把铁水装入左手铁碗", "Melt the iron first and load it into the left-hand bowl");
          return;
        }

        if (now - lastBurst < 900) return;
        lastBurst = now;
        pourMoltenIronFromBowl();
        animatePaddleStrike();
        launchIronFlower(7.2, 1.45, -4.25);
        setStatus("打铁花：左手泼出铁水，右手拍板拍开，铁花绽放", "Iron Flower: pour with the left hand, slap open with the right, and sparks bloom");
      }

      function pourMoltenIronFromBowl() {
        var molten = document.querySelector("#heldMoltenIron");
        if (molten) molten.setAttribute("visible", "false");

        var root = document.querySelector("#fireworks");
        var bowl = document.querySelector("#heldBowl");
        var origin = new THREE.Vector3(6.8, 1.15, -3.6);
        if (bowl) bowl.object3D.getWorldPosition(origin);

        for (var i = 0; i < 42; i += 1) {
          var stream = document.createElement("a-entity");
          stream.setAttribute("mixin", "spark");
          stream.setAttribute("position", origin.x + " " + origin.y + " " + origin.z);
          stream.setAttribute("scale", "0.8 0.8 0.8");
          stream.setAttribute("material", "color: #fff4c1; emissive: #ff4a00; emissiveIntensity: 3.4; transparent: true; opacity: 1");
          stream.setAttribute("spark-move", {
            vx: 0.15 + Math.random() * 0.65,
            vy: 0.2 + Math.random() * 1.2,
            vz: -1.05 - Math.random() * 1.35,
            gravity: 0.028,
            life: 420 + Math.random() * 280,
            delay: Math.random() * 120,
            trail: true,
          });
          root.appendChild(stream);
        }
      }

      function animatePaddleStrike() {
        var paddle = document.querySelector("#heldPaddle");
        if (!paddle) return;

        paddle.removeAttribute("animation__strike");
        paddle.removeAttribute("animation__return");
        paddle.setAttribute("animation__strike", "property: rotation; to: 34 0 -42; dur: 150; easing: easeOutQuad");
        setTimeout(function () {
          paddle.setAttribute("animation__return", "property: rotation; to: 0 0 -8; dur: 260; easing: easeOutElastic");
        }, 160);
      }

      function launchIronFlower(x, y, z) {
        var root = document.querySelector("#fireworks");
        var origin = new THREE.Vector3(x, y, z + 0.65);
        var burst = new THREE.Vector3(x, y, z);

        createIronComet(root, origin, burst);
        createShockRing(root, x, y, z);
        createFlash(root, x, y, z, 11, 11, 760);

        for (var i = 0; i < 280; i += 1) {
          var spark = document.createElement("a-entity");
          var angle = THREE.MathUtils.degToRad(-18 + Math.random() * 216);
          var fan = Math.pow(Math.random(), 0.55);
          var speed = 1.4 + Math.random() * 6.8;
          var size = 0.45 + Math.random() * 1.8;
          var delay = Math.random() * 180;

          spark.setAttribute("mixin", "spark");
          spark.setAttribute("position", x + " " + y + " " + z);
          spark.setAttribute("scale", size + " " + size + " " + size);
          spark.setAttribute(
            "material",
            "color: " +
              randomFireColor() +
              "; emissive: #ff6a00; emissiveIntensity: " +
              (2.4 + Math.random() * 2.8) +
              "; transparent: true; opacity: 1"
          );
          spark.setAttribute("spark-move", {
            vx: Math.cos(angle) * speed * fan,
            vy: 0.35 + Math.random() * 3.8,
            vz: -Math.abs(Math.sin(angle)) * speed * 0.5 - Math.random() * 0.65,
            gravity: 0.035 + Math.random() * 0.04,
            life: 950 + Math.random() * 1050,
            delay: delay,
            trail: Math.random() > 0.34,
          });
          root.appendChild(spark);
        }

        for (var j = 0; j < 110; j += 1) {
          var ember = document.createElement("a-entity");
          var drift = THREE.MathUtils.degToRad(25 + Math.random() * 130);
          var emberSpeed = 0.6 + Math.random() * 2.4;
          ember.setAttribute("mixin", "spark");
          ember.setAttribute("position", (x + (Math.random() - 0.5) * 2.2) + " " + (y + 1.25 + Math.random() * 1.2) + " " + (z - 0.55 - Math.random() * 1.2));
          ember.setAttribute("scale", "0.55 0.55 0.55");
          ember.setAttribute("material", "color: #ffb13d; emissive: #ff5a14; emissiveIntensity: 2.2; transparent: true; opacity: 0.85");
          ember.setAttribute("spark-move", {
            vx: Math.cos(drift) * emberSpeed * 0.45,
            vy: -0.25 - Math.random() * 0.65,
            vz: -Math.sin(drift) * emberSpeed * 0.18,
            gravity: 0.018,
            life: 1500 + Math.random() * 1500,
            delay: 180 + Math.random() * 450,
            trail: false,
          });
          root.appendChild(ember);
        }
      }

      function createIronComet(root, origin, burst) {
        var comet = document.createElement("a-entity");
        comet.setAttribute("geometry", "primitive: sphere; radius: 0.075");
        comet.setAttribute("material", "color: #fff4c1; emissive: #ff6a00; emissiveIntensity: 4.5; transparent: true; opacity: 1");
        comet.setAttribute("position", origin.x + " " + origin.y + " " + origin.z);
        comet.setAttribute("comet-flight", {
          toX: burst.x,
          toY: burst.y,
          toZ: burst.z,
          life: 360,
        });
        root.appendChild(comet);
      }

      function createShockRing(root, x, y, z) {
        var ring = document.createElement("a-ring");
        ring.setAttribute("position", x + " " + y + " " + z);
        ring.setAttribute("rotation", "0 0 0");
        ring.setAttribute("radius-inner", "0.12");
        ring.setAttribute("radius-outer", "0.16");
        ring.setAttribute("color", "#fff4c1");
        ring.setAttribute("material", "shader: flat; transparent: true; opacity: 0.86; side: double");
        ring.setAttribute("shock-ring", "");
        root.appendChild(ring);
      }

      function createFlash(root, x, y, z, intensity, distance, life) {
        var flash = document.createElement("a-light");
        flash.setAttribute("type", "point");
        flash.setAttribute("color", "#ffb13d");
        flash.setAttribute("intensity", String(intensity));
        flash.setAttribute("distance", String(distance));
        flash.setAttribute("position", x + " " + y + " " + z);
        flash.setAttribute("flash-fade", { intensity: intensity, life: life });
        root.appendChild(flash);
      }

      AFRAME.registerComponent("spark-move", {
        schema: {
          vx: { default: 0 },
          vy: { default: 1 },
          vz: { default: 0 },
          gravity: { default: 0.045 },
          life: { default: 1000 },
          delay: { default: 0 },
          trail: { default: false },
        },

        init: function () {
          this.birth = performance.now();
          this.lastTrail = 0;
          this.startScale = this.el.object3D.scale.clone();
          if (this.data.delay > 0) {
            this.el.object3D.visible = false;
          }
        },

        tick: function () {
          var now = performance.now();
          var age = now - this.birth - this.data.delay;
          if (age < 0) return;
          this.el.object3D.visible = true;
          var progress = age / this.data.life;

          this.el.object3D.position.x += this.data.vx / 60;
          this.el.object3D.position.y += this.data.vy / 60;
          this.el.object3D.position.z += this.data.vz / 60;
          this.data.vy -= this.data.gravity;

          var fade = Math.max(0, 1 - progress);
          this.el.object3D.scale.copy(this.startScale).multiplyScalar(0.35 + fade * 0.95);
          this.el.setAttribute("material", "opacity", fade);

          if (this.data.trail && now - this.lastTrail > 42 && fade > 0.16) {
            this.lastTrail = now;
            createTrailDot(this.el.parentElement, this.el.object3D.position, fade);
          }

          if (progress >= 1 || this.el.object3D.position.y < 0) {
            this.el.remove();
          }
        },
      });

      function createTrailDot(root, position, fade) {
        if (!root) return;
        if (root.children.length > 650) return;
        var dot = document.createElement("a-entity");
        dot.setAttribute("geometry", "primitive: sphere; radius: 0.018");
        dot.setAttribute("position", position.x + " " + position.y + " " + position.z);
        dot.setAttribute("material", "color: #ffd06a; emissive: #ff5a14; emissiveIntensity: 1.8; transparent: true; opacity: " + Math.min(0.72, fade));
        dot.setAttribute("trail-fade", "");
        root.appendChild(dot);
      }

      AFRAME.registerComponent("trail-fade", {
        init: function () {
          this.birth = performance.now();
          this.startScale = this.el.object3D.scale.clone();
        },

        tick: function () {
          var progress = (performance.now() - this.birth) / 420;
          this.el.object3D.scale.copy(this.startScale).multiplyScalar(Math.max(0.05, 1 - progress));
          this.el.setAttribute("material", "opacity", Math.max(0, 0.72 * (1 - progress)));
          if (progress >= 1) this.el.remove();
        },
      });

      AFRAME.registerComponent("comet-flight", {
        schema: {
          toX: { default: 0 },
          toY: { default: 0 },
          toZ: { default: 0 },
          life: { default: 360 },
        },

        init: function () {
          this.birth = performance.now();
          this.from = this.el.object3D.position.clone();
          this.to = new THREE.Vector3(this.data.toX, this.data.toY, this.data.toZ);
        },

        tick: function () {
          var progress = Math.min((performance.now() - this.birth) / this.data.life, 1);
          var eased = 1 - Math.pow(1 - progress, 3);
          this.el.object3D.position.lerpVectors(this.from, this.to, eased);
          this.el.setAttribute("material", "opacity", 1 - progress * 0.25);
          createTrailDot(this.el.parentElement, this.el.object3D.position, 0.9);
          if (progress >= 1) this.el.remove();
        },
      });

      AFRAME.registerComponent("shock-ring", {
        init: function () {
          this.birth = performance.now();
        },

        tick: function () {
          var progress = (performance.now() - this.birth) / 680;
          var scale = 1 + progress * 9;
          this.el.object3D.scale.set(scale, scale, scale);
          this.el.setAttribute("material", "opacity", Math.max(0, 0.86 * (1 - progress)));
          if (progress >= 1) this.el.remove();
        },
      });

      AFRAME.registerComponent("flash-fade", {
        schema: {
          intensity: { default: 7 },
          life: { default: 450 },
        },

        init: function () {
          this.birth = performance.now();
        },

        tick: function () {
          var progress = (performance.now() - this.birth) / this.data.life;
          this.el.setAttribute("intensity", this.data.intensity * Math.max(0, 1 - progress));

          if (progress >= 1) {
            this.el.remove();
          }
        },
      });

      function randomFireColor() {
        var colors = ["#fff4c1", "#ffd06a", "#ff9d1e", "#ff5a14", "#db1f13"];
        return colors[Math.floor(Math.random() * colors.length)];
      }

      window.addEventListener("load", function () {
        var scene = document.querySelector("a-scene");
        var startButton = document.querySelector("#startButton");
        applySceneShell();
        document.querySelector("#langToggle").addEventListener("click", toggleLanguage);
        startButton.addEventListener("click", startGame);
        document.addEventListener("keydown", function (event) {
          if (gameStarted) return;
          if (event.code === "Enter" || event.code === "Space") {
            event.preventDefault();
            startGame();
          }
        });

        // Wire up choice panel buttons
        document.querySelector("#choiceYes").addEventListener("click", confirmChoice);
        document.querySelector("#choiceNo").addEventListener("click", closeChoicePanel);

        applyLanguage();
        setInitialScenePreview();
        scene.setAttribute("manual-interaction", "");
        scene.setAttribute("heating-progress-loop", "");
        scene.addEventListener("enter-vr", function () {
          if (hasLadle) {
            setStatus("已进入 VR：左手铁碗、右手拍板，摇杆可移动", "VR mode active: bowl in left hand, paddle in right hand, joystick moves you");
          } else {
            setStatus("已进入 VR：转头可看四周，摇杆可移动", "VR mode active: turn your head to look around and use the joystick to move");
          }
          if (hasLadle) setTimeout(moveLadleToBestAnchor, 120);
        });
        scene.addEventListener("exit-vr", function () {
          setStatus("已退出 VR：电脑可用鼠标视角和 WASD 测试", "Exited VR: on desktop, test with mouse look and WASD");
          if (hasLadle) moveLadleToBestAnchor();
        });
        document.querySelector("#rig").setAttribute("pico-thumbstick-move", "speed: 1.8; turnSpeed: 90");
        document.querySelector("#furnaceHotspot").setAttribute("furnace-step", "");
        document.querySelector("#bellowsHotspot").setAttribute("bellows-step", "");
        document.querySelectorAll(".material-item").forEach(function (item) {
          item.setAttribute("material-choice", item.getAttribute("material-choice"));
        });
        // Randomize after the A-Frame scene reports loaded so position
        // components are fully initialised. Fall back to a delayed timer
        // if 'loaded' has already fired before this handler attaches.
        if (scene.hasLoaded) {
          setTimeout(randomizeMaterialPositions, 0);
        } else {
          scene.addEventListener("loaded", function () {
            randomizeMaterialPositions();
          });
        }
        document.querySelector("#ladle").setAttribute("pickable", "");
        document.querySelector("#strikeTarget").setAttribute("strike-target", "");
      });
    </script>
  </body>
</html>
