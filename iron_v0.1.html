<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>铜官窑打铁花 VR 体验</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #040201;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .overlay {
        position: fixed;
        left: 20px;
        top: 18px;
        z-index: 10;
        width: min(430px, calc(100vw - 40px));
        color: #fff6df;
        pointer-events: none;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.75);
      }

      .overlay-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }

      .overlay h1 {
        margin: 0;
        font-size: 25px;
        line-height: 1.15;
        letter-spacing: 0;
      }

      .lang-toggle {
        pointer-events: auto;
        border: 1px solid rgba(255, 188, 66, 0.65);
        border-radius: 999px;
        background: rgba(20, 12, 5, 0.72);
        color: #fff4d2;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
      }

      .overlay .course {
        margin: 0 0 8px;
        color: #d8eef8;
        font-size: 14px;
        line-height: 1.35;
      }

      .overlay p {
        margin: 0;
        color: #ffd27a;
        font-size: 14px;
        line-height: 1.55;
      }

      .badge {
        display: inline-block;
        margin-bottom: 10px;
        padding: 5px 9px;
        border: 1px solid rgba(255, 188, 66, 0.5);
        border-radius: 999px;
        background: rgba(20, 12, 5, 0.58);
        color: #ffbd42;
        font-size: 12px;
      }
    </style>
  </head>

  <body>
    <div class="overlay">
      <span class="badge">Iron Flower VR Prototype</span>
      <div class="overlay-row">
        <h1 id="overlayTitle">铜官窑·打铁花</h1>
        <button id="langToggle" class="lang-toggle" type="button">English</button>
      </div>
      <div class="course">设计前沿专题研究-组2 / Design Frontiers Research - Group 2</div>
      <p id="overlayIntro">按“发炉、融铁、打铁花”三步体验：左手端铁碗泼出铁水，右手用拍板把铁水拍散成花。</p>
    </div>

    <a-scene
      background="color: #040201"
      renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true"
      xr-mode-ui="enabled: true"
      device-orientation-permission-ui="enabled: true"
      shadow="type: pcfsoft"
      cursor="rayOrigin: mouse"
      raycaster="objects: .clickable"
      manual-interaction
    >
      <a-assets>
        <a-mixin
          id="spark"
          geometry="primitive: sphere; radius: 0.025"
          material="color: #ffb13d; emissive: #ff6a00; emissiveIntensity: 2.6; transparent: true; opacity: 1"
        ></a-mixin>
      </a-assets>

      <a-sky color="#040201"></a-sky>

      <a-plane
        rotation="-90 0 0"
        width="34"
        height="34"
        color="#090706"
        material="roughness: 0.88; metalness: 0.04"
        shadow="receive: true"
      ></a-plane>

      <a-entity id="pathGuides">
        <a-ring position="-5.4 0.012 -3.4" rotation="-90 0 0" radius-inner="0.78" radius-outer="0.84" color="#ff8a1c" material="transparent: true; opacity: 0.48"></a-ring>
        <a-ring position="-1.8 0.012 -3.4" rotation="-90 0 0" radius-inner="0.78" radius-outer="0.84" color="#20d4ff" material="transparent: true; opacity: 0.48"></a-ring>
        <a-ring position="1.8 0.012 -3.4" rotation="-90 0 0" radius-inner="0.72" radius-outer="0.78" color="#ffd37a" material="transparent: true; opacity: 0.5"></a-ring>
        <a-ring position="5.4 0.012 -3.4" rotation="-90 0 0" radius-inner="0.86" radius-outer="0.94" color="#ffcc72" material="transparent: true; opacity: 0.52"></a-ring>
        <a-cylinder position="0 0.018 -3.4" radius="0.022" height="10.8" rotation="0 0 90" color="#20d4ff" material="transparent: true; opacity: 0.3"></a-cylinder>
      </a-entity>

      <a-entity id="kiln-tower" position="5.4 0 -7.2">
        <a-cylinder position="0 0.18 0" radius="1.24" height="0.36" color="#2f1206"></a-cylinder>
        <a-cylinder position="0 0.72 0" radius="0.9" height="0.74" color="#5e2609"></a-cylinder>
        <a-cylinder position="0 1.3 0" radius="0.7" height="0.56" color="#87380c"></a-cylinder>
        <a-cylinder position="0 1.82 0" radius="0.54" height="0.48" color="#a85610"></a-cylinder>
        <a-cone
          position="0 2.22 0"
          radius-bottom="0.9"
          radius-top="0.16"
          height="0.42"
          color="#dc8619"
          material="metalness: 0.12; roughness: 0.45"
        ></a-cone>
        <a-cone
          position="0 2.63 0"
          radius-bottom="0.38"
          radius-top="0.03"
          height="0.55"
          color="#ffb02e"
          material="emissive: #9a4600; emissiveIntensity: 0.45"
        ></a-cone>
      </a-entity>

      <a-entity id="flowerShed" position="5.4 0 -5.2">
        <a-cylinder position="-1.25 1.4 0" radius="0.035" height="2.8" color="#6b3b18"></a-cylinder>
        <a-cylinder position="1.25 1.4 0" radius="0.035" height="2.8" color="#6b3b18"></a-cylinder>
        <a-cylinder position="0 2.75 0" radius="0.03" height="2.7" rotation="0 0 90" color="#8a521f"></a-cylinder>
        <a-cylinder position="0 2.45 0.15" radius="0.022" height="2.55" rotation="84 0 90" color="#3f6d2d"></a-cylinder>
        <a-cylinder position="0 2.45 -0.15" radius="0.022" height="2.55" rotation="96 0 90" color="#3f6d2d"></a-cylinder>
        <a-sphere position="-0.8 2.52 0" radius="0.055" color="#ffb13d" material="emissive: #ff6a00; emissiveIntensity: 0.9"></a-sphere>
        <a-sphere position="0 2.65 0" radius="0.055" color="#ffb13d" material="emissive: #ff6a00; emissiveIntensity: 0.9"></a-sphere>
        <a-sphere position="0.8 2.52 0" radius="0.055" color="#ffb13d" material="emissive: #ff6a00; emissiveIntensity: 0.9"></a-sphere>
      </a-entity>

      <a-entity
        id="labelShed"
        position="5.4 3.35 -5.2"
        canvas-label="text: 花棚与柳枝|Flower shed with willow branches; width: 2.55; height: 0.58"
        face-camera
      ></a-entity>

      <a-entity id="furnace" position="-5.4 0 -3.4">
        <a-cylinder radius="0.5" height="0.34" color="#351206" material="roughness: 0.55"></a-cylinder>
        <a-cylinder
          position="0 0.22 0"
          radius="0.32"
          height="0.08"
          color="#ff8a1c"
          material="emissive: #ff4a00; emissiveIntensity: 1.8"
        ></a-cylinder>
        <a-light type="point" color="#ff7a1a" intensity="2.2" distance="5"></a-light>
      </a-entity>

      <a-entity id="materialPrep" position="-6.22 0 -2.55">
        <a-box position="-0.25 0.08 0" width="0.22" height="0.16" depth="0.22" color="#9a9389" material="roughness: 0.8"></a-box>
        <a-box position="0.02 0.07 0.08" width="0.2" height="0.14" depth="0.2" color="#6f6b66" rotation="0 24 0"></a-box>
        <a-box position="0.22 0.06 -0.06" width="0.18" height="0.12" depth="0.18" color="#b0a99e" rotation="0 -18 0"></a-box>
        <a-sphere position="-0.08 0.08 0.42" radius="0.1" color="#1e1a16"></a-sphere>
        <a-sphere position="0.12 0.07 0.38" radius="0.085" color="#2d2722"></a-sphere>
        <a-sphere position="0.28 0.075 0.48" radius="0.075" color="#181512"></a-sphere>
      </a-entity>

      <a-entity id="bellows" position="-1.8 0.26 -3.4" rotation="0 -18 0">
        <a-box id="bellowsBody" position="0 0.18 0" width="0.92" height="0.26" depth="0.46" color="#4f2410" material="roughness: 0.68"></a-box>
        <a-box position="-0.18 0.34 0" width="0.76" height="0.06" depth="0.42" color="#8a521f"></a-box>
        <a-box id="bellowsHandle" position="-0.62 0.45 0" width="0.1" height="0.38" depth="0.1" color="#b06c2a"></a-box>
        <a-cylinder position="0.58 0.18 0" radius="0.045" height="0.75" rotation="0 0 90" color="#5f3a1d"></a-cylinder>
        <a-cone position="0.98 0.18 0" radius-bottom="0.08" radius-top="0.03" height="0.22" rotation="0 0 -90" color="#3a2514"></a-cone>
      </a-entity>

      <a-entity
        id="bellowsHotspot"
        class="clickable"
        position="-1.8 0.55 -3.4"
        geometry="primitive: box; width: 1.25; height: 0.9; depth: 0.8"
        material="transparent: true; opacity: 0"
        bellows-step
      ></a-entity>

      <a-entity id="heatIndicators" position="-1.8 1.22 -3.4" face-camera>
        <a-sphere id="heatDot1" position="-0.24 0 0" radius="0.055" color="#3b2a1c"></a-sphere>
        <a-sphere id="heatDot2" position="0 0 0" radius="0.055" color="#3b2a1c"></a-sphere>
        <a-sphere id="heatDot3" position="0.24 0 0" radius="0.055" color="#3b2a1c"></a-sphere>
      </a-entity>

      <a-entity
        id="furnaceHotspot"
        class="clickable"
        position="-5.4 0.45 -3.4"
        geometry="primitive: cylinder; radius: 0.78; height: 0.82"
        material="transparent: true; opacity: 0"
        furnace-step
      ></a-entity>

      <a-entity
        id="labelFurnace"
        position="-5.4 1.42 -3.4"
        canvas-label="text: 1 发炉|Prepare furnace: charcoal, ignition, bellows; width: 2.7; height: 0.62"
        face-camera
      ></a-entity>

      <a-entity
        id="labelMelt"
        position="-1.8 2.16 -3.4"
        canvas-label="text: 2 融铁|Pull the bellows to raise furnace heat; width: 2.9; height: 0.62"
        face-camera
      ></a-entity>

      <a-entity
        id="labelBellows"
        position="-1.8 1.62 -3.4"
        canvas-label="text: 拉风箱|Pull 3 times to melt the iron; width: 2.45; height: 0.58"
        face-camera
      ></a-entity>

      <a-entity
        id="ladle"
        class="clickable"
        position="1.8 0.82 -3.4"
        rotation="0 0 -25"
        geometry="primitive: box; width: 1.8; height: 0.62; depth: 0.48"
        material="transparent: true; opacity: 0"
        pickable
      >
        <a-cylinder position="-0.48 0 0" radius="0.22" height="0.13" color="#2b170c" material="metalness: 0.4; roughness: 0.35"></a-cylinder>
        <a-torus position="-0.48 0.08 0" radius="0.23" radius-tubular="0.025" color="#8a521f"></a-torus>
        <a-cylinder position="-0.72 0.03 0" radius="0.018" height="0.55" rotation="0 0 92" color="#8a521f"></a-cylinder>
        <a-box position="0.44 0 0" width="0.72" height="0.08" depth="0.32" color="#7c3a16"></a-box>
        <a-cylinder position="0.95 0 0" radius="0.025" height="0.72" rotation="0 0 90" color="#5c2a11"></a-cylinder>
        <a-text id="ladleSmallText" value="取铁碗和拍板" align="center" width="2.8" position="0 0.42 0" color="#ffd37a"></a-text>
      </a-entity>

      <a-entity
        id="labelLadle"
        position="1.8 1.68 -3.4"
        canvas-label="text: 3 取双手工具|After melting: bowl and paddle; width: 3.0; height: 0.66"
        face-camera
      ></a-entity>

      <a-entity
        id="strikeTarget"
        class="clickable"
        position="5.4 1.32 -3.4"
        geometry="primitive: sphere; radius: 0.72"
        material="transparent: true; opacity: 0"
        strike-target
      >
        <a-torus
          radius="0.52"
          radius-tubular="0.012"
          color="#ffcc72"
          material="transparent: true; opacity: 0.62; emissive: #ff8a00; emissiveIntensity: 0.7"
          pulse
        ></a-torus>
        <a-sphere
          radius="0.06"
          color="#fff1bd"
          material="emissive: #ff8a00; emissiveIntensity: 1.8"
        ></a-sphere>
        <a-text id="targetSmallText" value="拿起后瞄准这里" align="center" width="3" position="0 0.48 0" color="#fff1bd"></a-text>
      </a-entity>

      <a-entity
        id="labelStrike"
        position="5.4 2.18 -3.4"
        canvas-label="text: 4 打铁花|Pour with left hand, slap open with right hand; width: 3.0; height: 0.66"
        face-camera
      ></a-entity>

      <a-entity id="fireworks"></a-entity>

      <a-entity
        id="labelBloom"
        position="6.85 2.45 -5.7"
        canvas-label="text: 视觉结果|铁粒燃烧成花; width: 2.65; height: 0.62"
        face-camera
      ></a-entity>

      <a-entity
        id="labelMove"
        position="0 1.18 0.65"
        canvas-label="text: 移动探索 / Move freely|Pico 摇杆移动，电脑用 WASD; width: 2.75; height: 0.58"
        face-camera
      ></a-entity>

      <a-entity
        id="languageSwitch"
        class="clickable"
        position="-1.95 1.62 0.58"
        geometry="primitive: box; width: 1.65; height: 0.52; depth: 0.2"
        material="transparent: true; opacity: 0"
        canvas-label="text: English|Switch language; width: 1.65; height: 0.52"
        face-camera
        language-switch
      ></a-entity>

      <a-entity id="rig" position="0 0 1.8" pico-thumbstick-move="speed: 1.8; turnSpeed: 90">
        <a-camera
          id="mainCamera"
          position="0 1.6 0"
          wasd-controls="enabled: true; acceleration: 18"
          look-controls="enabled: true; magicWindowTrackingEnabled: true; pointerLockEnabled: false"
        >
          <a-cursor
            raycaster="objects: .clickable"
            cursor="fuse: false"
            color="#ffd37a"
            geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.019"
          ></a-cursor>
        <a-entity id="heldAnchor" position="0.35 -0.28 -0.72" rotation="0 0 -18"></a-entity>
        </a-camera>

        <a-entity
          id="leftHand"
          laser-controls="hand: left"
          raycaster="objects: .clickable"
          cursor="rayOrigin: entity; fuse: false"
          line="color: #2bd4ff; opacity: 0.45"
        >
          <a-entity id="leftBowlAnchor" position="0 -0.04 -0.2" rotation="-18 0 8"></a-entity>
        </a-entity>

        <a-entity
          id="rightHand"
          laser-controls="hand: right"
          raycaster="objects: .clickable"
          cursor="rayOrigin: entity; fuse: false"
          line="color: #ffb13d; opacity: 0.85"
        >
          <a-entity id="handHeldAnchor" position="0 -0.05 -0.24" rotation="-18 0 -10"></a-entity>
        </a-entity>
      </a-entity>

      <a-text
        id="statusText"
        value="步骤 1：点击炉火发炉；点击工具站可拿铁碗和拍板"
        align="center"
        width="4.3"
        position="0 2.45 -3.2"
        color="#fff0c2"
      ></a-text>

      <a-light type="ambient" color="#404060" intensity="1.15"></a-light>
      <a-light type="directional" color="#fff2d0" intensity="1.35" position="3 6 2" castShadow="true"></a-light>
      <a-light type="point" color="#ff9b26" intensity="1.15" distance="12" position="0 2.6 -4.6"></a-light>
    </a-scene>

    <script>
      var hasLadle = false;
      var furnacePrepared = false;
      var bellowsPulls = 0;
      var moltenIronReady = false;
      var ladleLoaded = false;
      var lowerStickAdded = false;
      var lastBurst = 0;
      var currentLanguage = "zh";
      var lastLanguageToggle = 0;

      var uiText = {
        zh: {
          toggle: "English",
          title: "铜官窑·打铁花",
          intro: "沿横向动线从左到右执行：发炉、拉风箱融铁、取双手工具、打铁花。工具在融铁完成后拿起，也可放回。",
          ladleSmall: "取铁碗和拍板",
          targetSmall: "瞄准这里泼拍",
          labels: {
            labelShed: "花棚与柳枝|传统打铁花常设花棚，并用柳枝等材料接住飞溅铁花",
            labelFurnace: "1 发炉|装炭、点火、拉风箱，让炉火旺起来",
            labelMelt: "2 融铁|拉风箱提高炉温，将生铁熔成铁水",
            labelBellows: "拉风箱|点击/扳机拉动 3 次，热度满格后融铁",
            labelLadle: "3 取双手工具|融铁完成后，左手铁碗、右手拍板",
            labelStrike: "4 打铁花|左手泼出铁水，右手拍开形成散射",
            labelBloom: "视觉结果|飞散铁粒氧化燃烧，形成铁花",
            labelMove: "横向流程|从左到右移动执行，Pico 摇杆移动，电脑用 WASD",
            languageSwitch: "English|Switch language",
          },
        },
        en: {
          toggle: "中文",
          title: "Tongguan Kiln Iron Flower",
          intro: "Follow a left-to-right workflow: prepare furnace, pull bellows to melt iron, pick up both tools, then perform Iron Flower. Pick up tools after melting; they can be returned.",
          ladleSmall: "Pick up bowl and paddle",
          targetSmall: "Aim here to pour and slap",
          labels: {
            labelShed: "Flower Shed & Willow Branches|A shed with branches catches and frames the flying sparks",
            labelFurnace: "1 Prepare Furnace|Add charcoal, ignite fire, and pull bellows",
            labelMelt: "2 Melt Iron|Pull the bellows to raise heat and melt raw iron",
            labelBellows: "Pull Bellows|Click or trigger 3 pulls until heat is full",
            labelLadle: "3 Pick Up Both Tools|After melting: left hand bowl, right hand paddle",
            labelStrike: "4 Perform Iron Flower|Pour with left hand, slap open with right hand",
            labelBloom: "Visual Result|Iron particles oxidize and burn into flowers",
            labelMove: "Linear Workflow|Move left to right. Use Pico joystick, or WASD on desktop",
            languageSwitch: "中文|切换语言",
          },
        },
      };

      var currentStatus = {
        zh: "横向流程：发炉 → 拉风箱融铁 → 取工具 → 打铁花",
        en: "Linear workflow: prepare furnace -> pull bellows -> pick up tools -> perform Iron Flower.",
      };

      function setStatus(zh, en) {
        currentStatus = { zh: zh, en: en || zh };
        var statusText = document.querySelector("#statusText");
        if (statusText) statusText.setAttribute("value", currentStatus[currentLanguage]);
      }

      function applyLanguage() {
        var text = uiText[currentLanguage];
        document.documentElement.lang = currentLanguage === "zh" ? "zh-CN" : "en";
        document.querySelector("#langToggle").textContent = text.toggle;
        document.querySelector("#overlayTitle").textContent = text.title;
        document.querySelector("#overlayIntro").textContent = text.intro;
        document.querySelector("#ladleSmallText").setAttribute("value", text.ladleSmall);
        document.querySelector("#targetSmallText").setAttribute("value", text.targetSmall);
        document.querySelector("#statusText").setAttribute("value", currentStatus[currentLanguage]);

        Object.keys(text.labels).forEach(function (id) {
          var label = document.querySelector("#" + id);
          if (label) label.setAttribute("canvas-label", "text: " + text.labels[id] + "; width: 2.85; height: 0.66");
        });
      }

      function toggleLanguage() {
        var now = performance.now();
        if (now - lastLanguageToggle < 250) return;
        lastLanguageToggle = now;
        currentLanguage = currentLanguage === "zh" ? "en" : "zh";
        applyLanguage();
      }

      AFRAME.registerComponent("canvas-label", {
        schema: {
          text: { default: "" },
          width: { default: 2.4 },
          height: { default: 0.58 },
          background: { default: "rgba(18, 10, 4, 0.72)" },
          border: { default: "#ffbd42" },
          color: { default: "#fff4d2" },
        },

        init: function () {
          this.drawLabel();
        },

        update: function () {
          this.drawLabel();
        },

        drawLabel: function () {
          var canvas = document.createElement("canvas");
          var context = canvas.getContext("2d");
          var scale = 3;
          canvas.width = Math.round(720 * scale);
          canvas.height = Math.round(180 * scale);

          context.scale(scale, scale);
          this.roundRect(context, 0, 0, 720, 180, 28, this.data.background, this.data.border);

          var lines = this.data.text.split("|");
          context.textAlign = "center";
          context.textBaseline = "middle";
          context.fillStyle = this.data.color;
          context.font = "700 42px Arial, PingFang SC, Microsoft YaHei, sans-serif";
          context.fillText(lines[0] || "", 360, lines.length > 1 ? 72 : 90);

          if (lines[1]) {
            context.fillStyle = "#ffd37a";
            context.font = "400 30px Arial, PingFang SC, Microsoft YaHei, sans-serif";
            context.fillText(lines[1], 360, 122);
          }

          var texture = new THREE.CanvasTexture(canvas);
          texture.needsUpdate = true;
          texture.minFilter = THREE.LinearFilter;

          if (this.mesh) {
            this.el.object3D.remove(this.mesh);
            this.mesh.geometry.dispose();
            this.mesh.material.map.dispose();
            this.mesh.material.dispose();
          }

          var geometry = new THREE.PlaneGeometry(this.data.width, this.data.height);
          var material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false,
          });

          this.mesh = new THREE.Mesh(geometry, material);
          this.el.object3D.add(this.mesh);
        },

        roundRect: function (context, x, y, width, height, radius, fill, stroke) {
          context.beginPath();
          context.moveTo(x + radius, y);
          context.lineTo(x + width - radius, y);
          context.quadraticCurveTo(x + width, y, x + width, y + radius);
          context.lineTo(x + width, y + height - radius);
          context.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
          context.lineTo(x + radius, y + height);
          context.quadraticCurveTo(x, y + height, x, y + height - radius);
          context.lineTo(x, y + radius);
          context.quadraticCurveTo(x, y, x + radius, y);
          context.closePath();
          context.fillStyle = fill;
          context.fill();
          context.strokeStyle = stroke;
          context.lineWidth = 4;
          context.stroke();
        },
      });

      AFRAME.registerComponent("manual-interaction", {
        init: function () {

        bindInput: function () {

          canvas.addEventListener("pointerdown", this.selectFromMouse.bind(this));

              this.selectFromCenter();
            }
          }.bind(this));

          if (rightHand) {
            ["triggerdown", "gripdown", "abuttondown", "bbuttondown", "selectstart"].forEach(function (eventName) {

        selectFromMouse: function (event) {
          if (!this.canSelect()) return;
          var rect = this.el.canvas.getBoundingClientRect();
          this.mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
          this.mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
          this.raycaster.setFromCamera(this.mouse, this.el.camera);
          this.activateFirstHit();
        },

        selectFromCenter: function () {
          if (!this.canSelect()) return;
          this.raycaster.setFromCamera(new THREE.Vector2(0, 0), this.el.camera);
          this.activateFirstHit();
        },

        selectFromHand: function () {
          if (!this.canSelect()) return;
          var rightHand = document.querySelector("#rightHand");
          if (!rightHand) return;

          var origin = new THREE.Vector3();
          var direction = new THREE.Vector3(0, 0, -1);
          rightHand.object3D.getWorldPosition(origin);
          direction.applyQuaternion(rightHand.object3D.getWorldQuaternion(new THREE.Quaternion()));
          this.raycaster.set(origin, direction);
          this.activateFirstHit();
        },

        canSelect: function () {
          var now = performance.now();
          if (now - this.lastSelect < 220) return false;
          this.lastSelect = now;
          return true;
        },

        activateFirstHit: function () {
          var objects = Array.from(document.querySelectorAll(".clickable")).map(function (el) {
            return el.object3D;
          });
          var hits = this.raycaster.intersectObjects(objects, true);
          if (!hits.length) return;

          var target = this.findClickableElement(hits[0].object);
          if (!target) return;

          if (target.id === "furnaceHotspot") {
            prepareMoltenIron();
          }

          if (target.id === "bellowsHotspot") {
            pullBellows();
          }

        if (target.id === "ladle") {
            toggleToolsAtStation();
        }

          if (target.id === "strikeTarget" && hasLadle) {
            triggerIronFlower();
          }

          if (target.id === "languageSwitch") {
            toggleLanguage();

        findClickableElement: function (object3D) {
          var current = object3D;
          while (current) {
            if (current.el && current.el.classList && current.el.classList.contains("clickable")) {
              return current.el;
            }
            current = current.parent;
          }
          return null;
        },
      });

      AFRAME.registerComponent("pico-thumbstick-move", {
        schema: {
          speed: { default: 1.8 },
          turnSpeed: { default: 90 },
          deadzone: { default: 0.18 },
        },

        init: function () {
          this.move = new THREE.Vector3();
          this.forward = new THREE.Vector3();
          this.right = new THREE.Vector3();
          this.camera = document.querySelector("#mainCamera");
          this.eventInput = { moveX: 0, moveY: 0, turnX: 0, time: 0 };
          this.attachAxisEvents();
        },

        tick: function (time, delta) {
          var gamepadInput = this.readGamepadAxes();
          if (!gamepadInput) return;

          var dt = Math.min(delta / 1000, 0.05);
          var moveX = this.applyDeadzone(gamepadInput.moveX);
          var moveY = this.applyDeadzone(gamepadInput.moveY);
          var turnX = this.applyDeadzone(gamepadInput.turnX);

          if (Math.abs(moveX) > 0 || Math.abs(moveY) > 0) {
            this.moveRig(moveX, moveY, dt);
          }

          if (Math.abs(turnX) > 0) {
            this.el.object3D.rotation.y -= THREE.MathUtils.degToRad(turnX * this.data.turnSpeed * dt);
          }
        },

        readGamepadAxes: function () {
          return this.readWebXRAxes() || this.readNavigatorAxes() || this.readRecentAxisEvent();
        },

        readWebXRAxes: function () {
          var renderer = this.el.sceneEl && this.el.sceneEl.renderer;
          var xr = renderer && renderer.xr;
          var session = xr && xr.getSession ? xr.getSession() : null;
          if (!session || !session.inputSources) return null;

          var leftMove = null;
          var rightMove = null;
          var fallbackMove = null;

          Array.from(session.inputSources).forEach(function (source) {
            if (!source || !source.gamepad || !source.gamepad.axes) return;

            var pair = this.findPrimaryAxisPair(source.gamepad.axes);
            if (!pair) return;

            if (source.handedness === "left") {
              leftMove = pair;
            } else if (source.handedness === "right") {
              rightMove = pair;
            }

            if (!fallbackMove || pair.strength > fallbackMove.strength) {
              fallbackMove = pair;
            }
          }.bind(this));

          if (!leftMove && !rightMove && !fallbackMove) return null;

          var move = leftMove || fallbackMove || rightMove;
          var turnX = leftMove && rightMove ? rightMove.x : 0;

          return {
            moveX: move.x,
            moveY: move.y,
            turnX: turnX,
          };
        },

        readNavigatorAxes: function () {
          var pads = navigator.getGamepads ? navigator.getGamepads() : [];
          var bestMove = null;
          var bestTurn = 0;

          for (var i = 0; i < pads.length; i += 1) {
            var pad = pads[i];
            if (!pad || !pad.axes || pad.axes.length < 2) continue;

            var pair = this.findPrimaryAxisPair(pad.axes);
            if (!pair) continue;

            if (!bestMove || pair.strength > bestMove.strength) {
              bestMove = pair;
            } else if (Math.abs(pair.x) > Math.abs(bestTurn)) {
              bestTurn = pair.x;
            }
          }

          if (!bestMove) return null;

          return {
            moveX: bestMove.x,
            moveY: bestMove.y,
            turnX: bestTurn,
          };
        },

        readRecentAxisEvent: function () {
          if (performance.now() - this.eventInput.time > 350) return null;
          return {
            moveX: this.eventInput.moveX,
            moveY: this.eventInput.moveY,
            turnX: this.eventInput.turnX,
          };
        },

        attachAxisEvents: function () {
          var leftHand = document.querySelector("#leftHand");
          var rightHand = document.querySelector("#rightHand");
          var events = ["axismove", "thumbstickmoved", "trackpadmoved"];

          if (leftHand) {
            events.forEach(function (eventName) {
              leftHand.addEventListener(eventName, function (event) {
                var pair = this.axisPairFromEvent(event);
                if (!pair) return;
                this.eventInput.moveX = pair.x;
                this.eventInput.moveY = pair.y;
                this.eventInput.time = performance.now();
              }.bind(this));
            }.bind(this));
          }

          if (rightHand) {
            events.forEach(function (eventName) {
              rightHand.addEventListener(eventName, function (event) {
                var pair = this.axisPairFromEvent(event);
                if (!pair) return;
                this.eventInput.moveX = pair.x;
                this.eventInput.moveY = pair.y;
                this.eventInput.turnX = 0;
                this.eventInput.time = performance.now();
              }.bind(this));
            }.bind(this));
          }
        },

        axisPairFromEvent: function (event) {
          var detail = event.detail || {};

          if (typeof detail.x === "number" && typeof detail.y === "number") {
            return { x: detail.x, y: detail.y, strength: Math.sqrt(detail.x * detail.x + detail.y * detail.y) };
          }

          if (detail.axis && detail.axis.length >= 2) {
            return this.findPrimaryAxisPair(detail.axis);
          }

          if (detail.axes && detail.axes.length >= 2) {
            return this.findPrimaryAxisPair(detail.axes);
          }

          return null;
        },

        findPrimaryAxisPair: function (axes) {
          if (!axes || axes.length < 2) return null;

          var candidates = [];

          if (axes.length >= 4) {
            candidates.push({ x: axes[2] || 0, y: axes[3] || 0, priority: 2 });
          }

          candidates.push({ x: axes[0] || 0, y: axes[1] || 0, priority: 1 });

          for (var i = 0; i < axes.length - 1; i += 2) {
            candidates.push({ x: axes[i] || 0, y: axes[i + 1] || 0, priority: 0 });
          }

          var best = null;
          candidates.forEach(function (candidate) {
            var strength = Math.sqrt(candidate.x * candidate.x + candidate.y * candidate.y);
            candidate.strength = strength;

            if (strength <= this.data.deadzone) return;
            if (!best || candidate.priority > best.priority || strength > best.strength + 0.12) {
              best = candidate;
            }
          }.bind(this));

          return best;
        },

        findStrongestAxisPair: function (axes) {
          var best = null;

          for (var i = 0; i < axes.length - 1; i += 2) {
            var x = axes[i] || 0;
            var y = axes[i + 1] || 0;
            var strength = Math.sqrt(x * x + y * y);

            if (strength > this.data.deadzone && (!best || strength > best.strength)) {
              best = { x: x, y: y, strength: strength };
            }
          }

          return best;
        },

        applyDeadzone: function (value) {
          if (Math.abs(value) < this.data.deadzone) return 0;
          var sign = value < 0 ? -1 : 1;
          return sign * ((Math.abs(value) - this.data.deadzone) / (1 - this.data.deadzone));
        },

        moveRig: function (moveX, moveY, dt) {
          var yaw = this.getCameraYaw();
          var distance = this.data.speed * dt;
          var forwardAmount = -moveY;
          var rightAmount = -moveX;

          this.forward.set(Math.sin(yaw), 0, Math.cos(yaw));
          this.right.set(Math.cos(yaw), 0, -Math.sin(yaw));
          this.move.copy(this.forward).multiplyScalar(forwardAmount);
          this.move.addScaledVector(this.right, rightAmount);

          if (this.move.lengthSq() > 1) this.move.normalize();
          this.move.multiplyScalar(distance);
          this.el.object3D.position.add(this.move);
        },

        getCameraYaw: function () {
          if (!this.camera) return this.el.object3D.rotation.y;

          var direction = new THREE.Vector3();
          this.camera.object3D.getWorldDirection(direction);
          return Math.atan2(-direction.x, -direction.z);
        },
      });

      function prepareMoltenIron() {
        var furnace = document.querySelector("#furnace");

        if (!furnacePrepared) {
          furnacePrepared = true;
          addFurnaceGlow(furnace, 3.2, "#ff8a1c");
          createFurnaceEmbers(furnace, 28, 0.35);
          setStatus("步骤 1 发炉完成：现在去左侧风箱，拉动 3 次完成融铁", "Stage 1 complete: go to the bellows and pull 3 times to melt the iron");
          return;
        }

        if (moltenIronReady) {
          if (hasLadle && !ladleLoaded) {
            fillLadleWithMoltenIron();
            setStatus("铁水已装入左手铁碗：移动到击打点，左手泼、右手拍", "Molten iron is in the left-hand bowl: move to the strike point, pour and slap");
          }
          return;
        }

        setStatus("融铁需要拉风箱：请点击炉旁风箱，把热度拉满", "Melting requires the bellows: click the bellows beside the furnace until heat is full");
      }

      function pullBellows() {
        if (!furnacePrepared) {
          setStatus("请先点击炉火完成发炉，再拉风箱", "Prepare the furnace first, then pull the bellows");
          return;
        }

        if (moltenIronReady) {
          setStatus("铁水已经融好，可以装入左手铁碗", "The iron is already molten and can be loaded into the left-hand bowl");
          return;
        }

        bellowsPulls = Math.min(3, bellowsPulls + 1);
        animateBellows();
        createBellowsAirPuff();
        updateHeatIndicators();
        createFurnaceEmbers(document.querySelector("#furnace"), 18 + bellowsPulls * 8, 0.5 + bellowsPulls * 0.18);
        addFurnaceGlow(document.querySelector("#furnace"), 2.6 + bellowsPulls * 1.2, "#ff9b26");

        if (bellowsPulls < 3) {
          setStatus("拉风箱中：炉温上升 " + bellowsPulls + "/3", "Pulling bellows: furnace heat rising " + bellowsPulls + "/3");
          return;
        }

        completeMelting();
      }

      function completeMelting() {
        var furnace = document.querySelector("#furnace");
        moltenIronReady = true;

        var hotspot = document.querySelector("#furnaceHotspot");
        if (hotspot && hasLadle) hotspot.classList.remove("clickable");

        addFurnaceGlow(furnace, 5.4, "#ffb13d");
        createFurnaceEmbers(furnace, 52, 0.65);

        if (hasLadle) {
          fillLadleWithMoltenIron();
          setStatus("步骤 2 融铁完成：铁水已装入左手铁碗，前往击打点", "Stage 2 complete: molten iron is in the left-hand bowl. Move to the strike point");
        } else {
          setStatus("步骤 2 融铁完成：点击右侧工具站，拿起铁碗和拍板", "Stage 2 complete: pick up the bowl and paddle at the tool station");
        }
      }

      function animateBellows() {
        var body = document.querySelector("#bellowsBody");
        var handle = document.querySelector("#bellowsHandle");
        if (!body || !handle) return;

        body.removeAttribute("animation__compress");
        body.removeAttribute("animation__release");
        handle.removeAttribute("animation__pull");
        handle.removeAttribute("animation__return");

        body.setAttribute("animation__compress", "property: scale; to: 1 0.62 0.86; dur: 160; easing: easeOutQuad");
        handle.setAttribute("animation__pull", "property: position; to: -0.74 0.32 0; dur: 160; easing: easeOutQuad");

        setTimeout(function () {
          body.setAttribute("animation__release", "property: scale; to: 1 1 1; dur: 260; easing: easeOutElastic");
          handle.setAttribute("animation__return", "property: position; to: -0.62 0.45 0; dur: 260; easing: easeOutElastic");
        }, 170);
      }

      function updateHeatIndicators() {
        for (var i = 1; i <= 3; i += 1) {
          var dot = document.querySelector("#heatDot" + i);
          if (!dot) continue;
          var active = i <= bellowsPulls;
          dot.setAttribute("color", active ? "#ffb13d" : "#3b2a1c");
          dot.setAttribute("material", active ? "emissive: #ff6a00; emissiveIntensity: 1.7" : "");
        }
      }

      function createBellowsAirPuff() {
        var root = document.querySelector("#fireworks");
        for (var i = 0; i < 22; i += 1) {
          var puff = document.createElement("a-entity");
          puff.setAttribute("geometry", "primitive: sphere; radius: 0.018");
          puff.setAttribute("position", "1.18 0.44 -3.38");
          puff.setAttribute("material", "color: #ffcc72; emissive: #ff6a00; emissiveIntensity: 1.4; transparent: true; opacity: 0.55");
          puff.setAttribute("spark-move", {
            vx: -2.35 - Math.random() * 0.75,
            vy: -0.05 + Math.random() * 0.25,

            gravity: 0.006,
            life: 420 + Math.random() * 220,
            delay: Math.random() * 90,
            trail: false,
          });
          root.appendChild(puff);

      function createFurnaceEmbers(furnace, count, heightBoost) {

          ember.setAttribute("mixin", "spark");

          ember.setAttribute("scale", "0.55 0.55 0.55");

            vx: (Math.random() - 0.5) * 0.28,

      function toggleToolsAtStation() {
        if (hasLadle) {

      function pickUpLadle() {
        if (hasLadle) return;

      function returnToolsToStation() {
        var toolStation = document.querySelector("#ladle");

      function fillLadleWithMoltenIron() {
        addLowerStick();
        var bowl = document.querySelector("#heldBowl");
        if (!bowl || ladleLoaded) return;
        ladleLoaded = true;

        var molten = document.createElement("a-sphere");
        molten.setAttribute("id", "heldMoltenIron");
        molten.setAttribute("radius", "0.145");
        molten.setAttribute("scale", "1 0.24 1");
        molten.setAttribute("position", "0 0.08 0");
        molten.setAttribute("color", "#fff0ae");
        molten.setAttribute("material", "emissive: #ff4a00; emissiveIntensity: 3.4; transparent: true; opacity: 0.96");
        bowl.appendChild(molten);
      }

      function addLowerStick() {
        if (lowerStickAdded) return;
        lowerStickAdded = true;

        var bowl = document.createElement("a-entity");
        bowl.setAttribute("id", "heldBowl");
        bowl.innerHTML =
          '<a-cylinder radius="0.18" height="0.1" color="#2b170c" material="metalness: 0.55; roughness: 0.32"></a-cylinder>' +
          '<a-torus position="0 0.07 0" radius="0.19" radius-tubular="0.023" color="#9a5a24"></a-torus>' +
          '<a-cylinder position="-0.27 0.02 0" radius="0.018" height="0.54" rotation="0 0 88" color="#8a521f"></a-cylinder>';

        var paddle = document.createElement("a-entity");
        paddle.setAttribute("id", "heldPaddle");
        paddle.innerHTML =
          '<a-box position="0 0 0" width="0.5" height="0.08" depth="0.28" color="#7c3a16"></a-box>' +
          '<a-cylinder position="0.42 0 0" radius="0.024" height="0.68" rotation="0 0 90" color="#5c2a11"></a-cylinder>';

        document.querySelector("#fireworks").appendChild(bowl);
        document.querySelector("#fireworks").appendChild(paddle);
      }

      function triggerIronFlower() {
        var now = performance.now();
        if (!hasLadle) {
          setStatus("请先点击工具站，左手拿铁碗、右手拿拍板", "Click the tool station first: left hand takes the bowl, right hand takes the paddle");
          return;
        }

        if (!furnacePrepared) {
          setStatus("请先点击炉火完成发炉", "Click the furnace first to prepare it");
          return;
        }

        if (!moltenIronReady || !ladleLoaded) {
          setStatus("请先完成融铁，并把铁水装入左手铁碗", "Melt the iron first and load it into the left-hand bowl");
          return;
        }

        if (now - lastBurst < 900) return;
        lastBurst = now;
        pourMoltenIronFromBowl();
        animatePaddleStrike();
        launchIronFlower(5.4, 1.45, -4.25);
        setStatus("打铁花：左手泼出铁水，右手拍板拍开，铁花绽放", "Iron Flower: pour with the left hand, slap open with the right, and sparks bloom");
      }

      function pourMoltenIronFromBowl() {
        var molten = document.querySelector("#heldMoltenIron");
        if (molten) molten.setAttribute("visible", "false");

        var root = document.querySelector("#fireworks");
        var bowl = document.querySelector("#heldBowl");
        var origin = new THREE.Vector3(5.0, 1.15, -3.6);
        if (bowl) bowl.object3D.getWorldPosition(origin);

        for (var i = 0; i < 42; i += 1) {
          var stream = document.createElement("a-entity");
          stream.setAttribute("mixin", "spark");
          stream.setAttribute("position", origin.x + " " + origin.y + " " + origin.z);
          stream.setAttribute("scale", "0.8 0.8 0.8");
          stream.setAttribute("material", "color: #fff4c1; emissive: #ff4a00; emissiveIntensity: 3.4; transparent: true; opacity: 1");
          stream.setAttribute("spark-move", {
            vx: 0.15 + Math.random() * 0.65,
            vy: 0.2 + Math.random() * 1.2,
            vz: -1.05 - Math.random() * 1.35,
            gravity: 0.028,
            life: 420 + Math.random() * 280,
            delay: Math.random() * 120,
            trail: true,
          });
          root.appendChild(stream);
        }
      }

      function animatePaddleStrike() {
        var paddle = document.querySelector("#heldPaddle");
        if (!paddle) return;

        paddle.removeAttribute("animation__strike");
        paddle.removeAttribute("animation__return");
        paddle.setAttribute("animation__strike", "property: rotation; to: 34 0 -42; dur: 150; easing: easeOutQuad");
        setTimeout(function () {
          paddle.setAttribute("animation__return", "property: rotation; to: 0 0 -8; dur: 260; easing: easeOutElastic");
        }, 160);
      }

      function launchIronFlower(x, y, z) {
        var root = document.querySelector("#fireworks");
        var origin = new THREE.Vector3(x, y, z + 0.65);
        var burst = new THREE.Vector3(x, y, z);

        createIronComet(root, origin, burst);
        createShockRing(root, x, y, z);
        createFlash(root, x, y, z, 11, 11, 760);

        for (var i = 0; i < 280; i += 1) {
          var spark = document.createElement("a-entity");
          var angle = THREE.MathUtils.degToRad(-18 + Math.random() * 216);
          var fan = Math.pow(Math.random(), 0.55);
          var speed = 1.4 + Math.random() * 6.8;
          var size = 0.45 + Math.random() * 1.8;
          var delay = Math.random() * 180;

          spark.setAttribute("mixin", "spark");
          spark.setAttribute("position", x + " " + y + " " + z);
          spark.setAttribute("scale", size + " " + size + " " + size);
          spark.setAttribute(
            "material",
            "color: " +
              randomFireColor() +
              "; emissive: #ff6a00; emissiveIntensity: " +
              (2.4 + Math.random() * 2.8) +
              "; transparent: true; opacity: 1"
          );
          spark.setAttribute("spark-move", {
            vx: Math.cos(angle) * speed * fan,
            vy: 0.35 + Math.random() * 3.8,
            vz: -Math.abs(Math.sin(angle)) * speed * 0.5 - Math.random() * 0.65,
            gravity: 0.035 + Math.random() * 0.04,
            life: 950 + Math.random() * 1050,
            delay: delay,
            trail: Math.random() > 0.34,
          });
          root.appendChild(spark);
        }

        for (var j = 0; j < 110; j += 1) {
          var ember = document.createElement("a-entity");
          var drift = THREE.MathUtils.degToRad(25 + Math.random() * 130);
          var emberSpeed = 0.6 + Math.random() * 2.4;
          ember.setAttribute("mixin", "spark");
          ember.setAttribute("position", (x + (Math.random() - 0.5) * 2.2) + " " + (y + 1.25 + Math.random() * 1.2) + " " + (z - 0.55 - Math.random() * 1.2));
          ember.setAttribute("scale", "0.55 0.55 0.55");
          ember.setAttribute("material", "color: #ffb13d; emissive: #ff5a14; emissiveIntensity: 2.2; transparent: true; opacity: 0.85");
          ember.setAttribute("spark-move", {
            vx: Math.cos(drift) * emberSpeed * 0.45,
            vy: -0.25 - Math.random() * 0.65,
            vz: -Math.sin(drift) * emberSpeed * 0.18,
            gravity: 0.018,
            life: 1500 + Math.random() * 1500,
            delay: 180 + Math.random() * 450,
            trail: false,
          });
          root.appendChild(ember);
        }
      }

      function createIronComet(root, origin, burst) {
        var comet = document.createElement("a-entity");
        comet.setAttribute("geometry", "primitive: sphere; radius: 0.075");
        comet.setAttribute("material", "color: #fff4c1; emissive: #ff6a00; emissiveIntensity: 4.5; transparent: true; opacity: 1");
        comet.setAttribute("position", origin.x + " " + origin.y + " " + origin.z);
        comet.setAttribute("comet-flight", {
          toX: burst.x,
          toY: burst.y,
          toZ: burst.z,
          life: 360,
        });
        root.appendChild(comet);
      }

      function createShockRing(root, x, y, z) {
        var ring = document.createElement("a-ring");
        ring.setAttribute("position", x + " " + y + " " + z);
        ring.setAttribute("rotation", "0 0 0");
        ring.setAttribute("radius-inner", "0.12");
        ring.setAttribute("radius-outer", "0.16");
        ring.setAttribute("color", "#fff4c1");
        ring.setAttribute("material", "shader: flat; transparent: true; opacity: 0.86; side: double");
        ring.setAttribute("shock-ring", "");
        root.appendChild(ring);
      }

      function createFlash(root, x, y, z, intensity, distance, life) {
        var flash = document.createElement("a-light");
        flash.setAttribute("type", "point");
        flash.setAttribute("color", "#ffb13d");
        flash.setAttribute("intensity", String(intensity));
        flash.setAttribute("distance", String(distance));
        flash.setAttribute("position", x + " " + y + " " + z);
        flash.setAttribute("flash-fade", { intensity: intensity, life: life });
        root.appendChild(flash);
      }

      AFRAME.registerComponent("spark-move", {
        schema: {
          vx: { default: 0 },
          vy: { default: 1 },
          vz: { default: 0 },
          gravity: { default: 0.045 },
          life: { default: 1000 },
          delay: { default: 0 },
          trail: { default: false },
        },

        init: function () {
          this.birth = performance.now();
          this.lastTrail = 0;
          this.startScale = this.el.object3D.scale.clone();
          if (this.data.delay > 0) {
            this.el.object3D.visible = false;
          }
        },

        tick: function () {
          var now = performance.now();
          var age = now - this.birth - this.data.delay;
          if (age < 0) return;
          this.el.object3D.visible = true;
          var progress = age / this.data.life;

          this.el.object3D.position.x += this.data.vx / 60;
          this.el.object3D.position.y += this.data.vy / 60;
          this.el.object3D.position.z += this.data.vz / 60;
          this.data.vy -= this.data.gravity;

          var fade = Math.max(0, 1 - progress);
          this.el.object3D.scale.copy(this.startScale).multiplyScalar(0.35 + fade * 0.95);
          this.el.setAttribute("material", "opacity", fade);

          if (this.data.trail && now - this.lastTrail > 42 && fade > 0.16) {
            this.lastTrail = now;
            createTrailDot(this.el.parentElement, this.el.object3D.position, fade);
          }

          if (progress >= 1 || this.el.object3D.position.y < 0) {
            this.el.remove();
          }
        },
      });

      function createTrailDot(root, position, fade) {
        if (!root) return;
        if (root.children.length > 650) return;
        var dot = document.createElement("a-entity");
        dot.setAttribute("geometry", "primitive: sphere; radius: 0.018");
        dot.setAttribute("position", position.x + " " + position.y + " " + position.z);
        dot.setAttribute("material", "color: #ffd06a; emissive: #ff5a14; emissiveIntensity: 1.8; transparent: true; opacity: " + Math.min(0.72, fade));
        dot.setAttribute("trail-fade", "");
        root.appendChild(dot);
      }

      AFRAME.registerComponent("trail-fade", {
        init: function () {
          this.birth = performance.now();
          this.startScale = this.el.object3D.scale.clone();
        },

        tick: function () {
          var progress = (performance.now() - this.birth) / 420;
          this.el.object3D.scale.copy(this.startScale).multiplyScalar(Math.max(0.05, 1 - progress));
          this.el.setAttribute("material", "opacity", Math.max(0, 0.72 * (1 - progress)));
          if (progress >= 1) this.el.remove();
        },
      });

      AFRAME.registerComponent("comet-flight", {
        schema: {
          toX: { default: 0 },
          toY: { default: 0 },
          toZ: { default: 0 },
          life: { default: 360 },
        },

        init: function () {
          this.birth = performance.now();
          this.from = this.el.object3D.position.clone();
          this.to = new THREE.Vector3(this.data.toX, this.data.toY, this.data.toZ);
        },

        tick: function () {
          var progress = Math.min((performance.now() - this.birth) / this.data.life, 1);
          var eased = 1 - Math.pow(1 - progress, 3);
          this.el.object3D.position.lerpVectors(this.from, this.to, eased);
          this.el.setAttribute("material", "opacity", 1 - progress * 0.25);
          createTrailDot(this.el.parentElement, this.el.object3D.position, 0.9);
          if (progress >= 1) this.el.remove();
        },
      });

      AFRAME.registerComponent("shock-ring", {
        init: function () {
          this.birth = performance.now();
        },

        tick: function () {
          var progress = (performance.now() - this.birth) / 680;
          var scale = 1 + progress * 9;
          this.el.object3D.scale.set(scale, scale, scale);
          this.el.setAttribute("material", "opacity", Math.max(0, 0.86 * (1 - progress)));
          if (progress >= 1) this.el.remove();
        },
      });

      AFRAME.registerComponent("flash-fade", {
        schema: {
          intensity: { default: 7 },
          life: { default: 450 },
        },

        init: function () {
          this.birth = performance.now();
        },

        tick: function () {
          var progress = (performance.now() - this.birth) / this.data.life;
          this.el.setAttribute("intensity", this.data.intensity * Math.max(0, 1 - progress));

          if (progress >= 1) {
            this.el.remove();
          }
        },
      });

      function randomFireColor() {
        var colors = ["#fff4c1", "#ffd06a", "#ff9d1e", "#ff5a14", "#db1f13"];
        return colors[Math.floor(Math.random() * colors.length)];
      }

      window.addEventListener("load", function () {
        var scene = document.querySelector("a-scene");
        document.querySelector("#langToggle").addEventListener("click", toggleLanguage);
        applyLanguage();
        scene.setAttribute("manual-interaction", "");
        scene.addEventListener("enter-vr", function () {
          if (hasLadle) {
            setStatus("已进入 VR：左手铁碗、右手拍板，摇杆可移动", "VR mode active: bowl in left hand, paddle in right hand, joystick moves you");
          } else {
            setStatus("已进入 VR：转头可看四周，摇杆可移动", "VR mode active: turn your head to look around and use the joystick to move");
          }
          if (hasLadle) setTimeout(moveLadleToBestAnchor, 120);
        });
        scene.addEventListener("exit-vr", function () {
          setStatus("已退出 VR：电脑可用鼠标视角和 WASD 测试", "Exited VR: on desktop, test with mouse look and WASD");
          if (hasLadle) moveLadleToBestAnchor();
        });
        document.querySelector("#rig").setAttribute("pico-thumbstick-move", "speed: 1.8; turnSpeed: 90");
        document.querySelector("#furnaceHotspot").setAttribute("furnace-step", "");
        document.querySelector("#bellowsHotspot").setAttribute("bellows-step", "");
        document.querySelector("#ladle").setAttribute("pickable", "");
        document.querySelector("#strikeTarget").setAttribute("strike-target", "");
        document.querySelector("#languageSwitch").setAttribute("language-switch", "");
      });
    </script>
  </body>
</html>
