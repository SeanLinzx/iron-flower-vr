<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>表演场景｜铜官窑打铁花 VR 体验</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #040201;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .overlay {
        position: fixed;
        left: 20px;
        top: 18px;
        z-index: 10;
        width: min(430px, calc(100vw - 40px));
        color: #fff6df;
        pointer-events: none;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.75);
      }

      .overlay-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }

      .overlay h1 {
        margin: 0;
        font-size: 25px;
        line-height: 1.15;
        letter-spacing: 0;
      }

      .lang-toggle {
        pointer-events: auto;
        border: 1px solid rgba(255, 188, 66, 0.65);
        border-radius: 999px;
        background: rgba(20, 12, 5, 0.72);
        color: #fff4d2;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
      }

      .overlay .course {
        margin: 0 0 8px;
        color: #d8eef8;
        font-size: 14px;
        line-height: 1.35;
      }

      .overlay p {
        margin: 0;
        color: #ffd27a;
        font-size: 14px;
        line-height: 1.55;
      }

      .badge {
        display: inline-block;
        margin-bottom: 10px;
        padding: 5px 9px;
        border: 1px solid rgba(255, 188, 66, 0.5);
        border-radius: 999px;
        background: rgba(20, 12, 5, 0.58);
        color: #ffbd42;
        font-size: 12px;
      }

      body:not(.game-started) .overlay {
        opacity: 0;
      }

      .start-screen {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          linear-gradient(180deg, rgba(2, 4, 8, 0.15), rgba(2, 4, 8, 0.4)),
          url("./start-screen.jpg") center / cover no-repeat;
        color: #fff8ce;
        transition: opacity 520ms ease, visibility 520ms ease;
      }

      .start-screen::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 30%, rgba(255, 211, 122, 0.22), transparent 28%),
          linear-gradient(90deg, rgba(0, 0, 0, 0.38), transparent 28%, transparent 72%, rgba(0, 0, 0, 0.38));
        pointer-events: none;
      }

      .game-started .start-screen {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .start-content {
        position: relative;
        z-index: 1;
        width: min(980px, calc(100vw - 40px));
        min-height: 62vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: clamp(28px, 5vw, 64px) 0 clamp(34px, 6vw, 72px);
        text-align: center;
        text-shadow: 0 4px 24px rgba(0, 0, 0, 0.84);
      }

      .start-kicker {
        margin: 0;
        color: #ffd27a;
        font-size: clamp(14px, 1.6vw, 19px);
        letter-spacing: 0;
      }

      .start-title {
        margin: clamp(8px, 1.8vw, 18px) 0 0;
        font-size: clamp(56px, 13vw, 168px);
        line-height: 0.82;
        font-weight: 950;
        font-style: italic;
        letter-spacing: 0;
        color: #fff6b8;
        text-transform: uppercase;
        transform: skewX(-8deg);
        filter: drop-shadow(0 0 18px rgba(255, 186, 52, 0.42));
      }

      .start-subtitle {
        margin: 14px auto 0;
        max-width: 720px;
        color: #ffe4a6;
        font-size: clamp(15px, 2vw, 22px);
        line-height: 1.45;
      }

      .start-button {
        border: 1px solid rgba(255, 245, 202, 0.48);
        min-width: min(520px, calc(100vw - 68px));
        padding: clamp(15px, 2.2vw, 24px) 32px;
        border-radius: 2px;
        background: rgba(232, 207, 151, 0.7);
        color: #fffdf0;
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.42), inset 0 0 0 1px rgba(255, 255, 255, 0.18);
        font-size: clamp(30px, 5vw, 64px);
        line-height: 1;
        font-weight: 850;
        letter-spacing: 0;
        cursor: pointer;
        text-shadow: 0 3px 16px rgba(0, 0, 0, 0.45);
        transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
      }

      .start-button:hover,
      .start-button:focus-visible {
        transform: translateY(-2px) scale(1.015);
        background: rgba(255, 220, 144, 0.82);
        outline: none;
        box-shadow: 0 24px 90px rgba(255, 172, 46, 0.24), 0 20px 80px rgba(0, 0, 0, 0.42);
      }

      .start-hint {
        margin-top: 14px;
        color: rgba(255, 244, 210, 0.82);
        font-size: 15px;
      }

      .choice-panel {
        position: fixed;
        left: 50%;
        bottom: 28px;
        z-index: 20;
        width: min(520px, calc(100vw - 36px));
        transform: translateX(-50%);
        padding: 18px;
        border: 1px solid rgba(255, 188, 66, 0.7);
        border-radius: 8px;
        background: rgba(12, 7, 3, 0.86);
        box-shadow: 0 20px 70px rgba(0, 0, 0, 0.42);
        color: #fff4d2;
        pointer-events: auto;
      }

      .choice-panel[hidden] {
        display: none;
      }

      .choice-panel h2 {
        margin: 0 0 8px;
        font-size: 19px;
        line-height: 1.25;
      }

      .choice-panel p {
        margin: 0 0 14px;
        color: #ffd27a;
        font-size: 15px;
        line-height: 1.5;
      }

      .choice-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }

      .choice-actions button {
        border: 1px solid rgba(255, 188, 66, 0.72);
        border-radius: 6px;
        background: rgba(255, 188, 66, 0.18);
        color: #fff4d2;
        padding: 9px 14px;
        font-size: 14px;
        cursor: pointer;
      }

      .choice-actions button:first-child {
        background: rgba(255, 188, 66, 0.72);
        color: #211306;
        font-weight: 700;
      }

      body.vr-mode .choice-panel {
        display: none !important;
      }
    </style>
  </head>

  <body data-scene="materials">
    <div id="startScreen" class="start-screen">
      <div class="start-content">
        <div>
          <p class="start-kicker">Tongguan Kiln Iron Flower VR Game</p>
          <h1 class="start-title">Iron Soul</h1>
          <p class="start-subtitle">铜官窑 · 打铁花 / Intangible Heritage Iron Flower Experience</p>
        </div>
        <div>
          <button id="startButton" class="start-button" type="button">Start Strike !</button>
          <div class="start-hint">点击按钮开始 / Click to begin</div>
        </div>
      </div>
    </div>

    <div class="overlay">
      <span class="badge">Iron Flower VR Prototype</span>
      <div class="overlay-row">
        <h1 id="overlayTitle">铜官窑·打铁花</h1>
        <button id="langToggle" class="lang-toggle" type="button">English</button>
      </div>
      <div class="course">设计前沿专题研究-组2 / Design Frontiers Research - Group 2</div>
      <p id="overlayIntro">三步体验：选择材料加入炉中、加热点火等待铁水流出、进入表演场景用双手工具打铁花。</p>
    </div>

    <div id="choicePanel" class="choice-panel" hidden>
      <h2 id="choiceTitle">材料名称</h2>
      <p id="choiceBody">材料功能说明</p>
      <div class="choice-actions">
        <button id="choiceYes" type="button">加入熔炉</button>
        <button id="choiceNo" type="button">取消</button>
      </div>
    </div>

    <a-scene
      background="color: #040201"
      renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true"
      xr-mode-ui="enabled: true"
      device-orientation-permission-ui="enabled: true"
      shadow="type: pcfsoft"
      cursor="rayOrigin: mouse"
      raycaster="objects: .clickable"
      manual-interaction
    >
      <a-assets>
        <img id="workshopBg" src="./scene1-vr.jpg" />
        <img id="performanceBg" src="./scene2-vr.jpg" />
        <a-asset-item id="personModel1Asset" src="./人物模型1/4df5a557-e5dc-43f5-a4ad-05ac560be566.glb"></a-asset-item>
        <a-asset-item id="personModel2Asset" src="./人物模型2/4795824a-ac11-4adc-9ada-d5666b0dda4a.glb"></a-asset-item>
        <a-asset-item id="performanceFurnaceAsset" src="./燃烧熔铁炉/b45a0d6e-f521-4c08-9bb0-5739077b35d4.glb"></a-asset-item>
        <a-asset-item id="shovelAsset" src="./模型1/铁锹/249b749e-8bc3-4492-bff4-7bc3acb5946c.glb"></a-asset-item>

          geometry="primitive: sphere; radius: 0.025"

      </a-assets>

      <a-sky id="environmentSky" src="#workshopBg" color="#040201" rotation="0 -88 0"></a-sky>

      <a-entity id="workshopBackdrop" position="-4.5 2.45 -10.2">

          <a-cylinder position="-0.04 0 0" radius="0.015" height="0.36" rotation="0 0 8" color="#3a2a1c"></a-cylinder>
          <a-cylinder position="0.04 0 0" radius="0.015" height="0.36" rotation="0 0 -8" color="#3a2a1c"></a-cylinder>

        update: function () {

        drawLabel: function () {
          var canvas = document.createElement("canvas");
          var context = canvas.getContext("2d");
          var scale = 3;
          canvas.width = Math.round(720 * scale);
          canvas.height = Math.round(220 * scale);

          context.scale(scale, scale);
          this.roundRect(context, 0, 0, 720, 220, 28, this.data.background, this.data.border);

          var lines = this.data.text.split("|");
          context.textAlign = "center";
          context.textBaseline = "middle";
          context.fillStyle = this.data.color;
          context.font = "700 40px Arial, PingFang SC, Microsoft YaHei, sans-serif";
          context.fillText(lines[0] || "", 360, lines[1] ? 58 : 110, 640);

          if (lines[1]) {
            context.fillStyle = "#ffd37a";
            context.font = "400 26px Arial, PingFang SC, Microsoft YaHei, sans-serif";
            this.wrapText(context, lines[1], 360, 120, 620, 34, 3);

          var texture = new THREE.CanvasTexture(canvas);
          texture.needsUpdate = true;
          texture.minFilter = THREE.LinearFilter;

          if (this.mesh) {
            this.el.object3D.remove(this.mesh);
            this.mesh.geometry.dispose();
            this.mesh.material.map.dispose();
            this.mesh.material.dispose();
          }

          var geometry = new THREE.PlaneGeometry(this.data.width, this.data.height);
          var material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false,
          });

          this.mesh = new THREE.Mesh(geometry, material);
          this.el.object3D.add(this.mesh);
        },

        wrapText: function (context, text, x, y, maxWidth, lineHeight, maxLines) {
          var tokens = text.match(/[\u4e00-\u9fff]|[^\s\u4e00-\u9fff]+/g) || [text];
          var lines = [];
          var line = "";

          tokens.forEach(function (token) {
            var separator = /[\u4e00-\u9fff]/.test(token) ? "" : " ";
            var testLine = line ? line + separator + token : token;

            if (context.measureText(testLine).width > maxWidth && line) {
              lines.push(line);
              line = token;
            } else {
              line = testLine;
            }
          });

          if (line) lines.push(line);

          lines.slice(0, maxLines).forEach(function (lineText, index) {
            var output = lineText;
            if (index === maxLines - 1 && lines.length > maxLines) output = lineText.replace(/\s+$/, "") + "...";
            context.fillText(output, x, y + index * lineHeight, maxWidth);
          });
        },

        roundRect: function (context, x, y, width, height, radius, fill, stroke) {

          context.moveTo(x + radius, y);
          context.lineTo(x + width - radius, y);
          context.quadraticCurveTo(x + width, y, x + width, y + radius);
          context.lineTo(x + width, y + height - radius);
          context.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
          context.lineTo(x + radius, y + height);
          context.quadraticCurveTo(x, y + height, x, y + height - radius);
          context.lineTo(x, y + radius);
          context.quadraticCurveTo(x, y, x + radius, y);
          context.closePath();
          context.fillStyle = fill;
          context.fill();
          context.strokeStyle = stroke;
          context.lineWidth = 4;
          context.stroke();
        },
      });

      AFRAME.registerComponent("person-throw-loop", {

            this.loadedCount += 1;
            this.setPoseOpacity(this.rest, 1);
            this.setPoseOpacity(this.throwPose, 0);
            if (this.loadedCount >= 2) {
              this.alignPoseFeet();
              this.placeGroupOnGround();
              this.resetBase();
              this.ready = true;
            }
          }.bind(this);

          if (this.rest) this.rest.addEventListener("model-loaded", this.onModelLoaded);
          if (this.throwPose) this.throwPose.addEventListener("model-loaded", this.onModelLoaded);
          this.setPoseOpacity(this.rest, 1);
          this.setPoseOpacity(this.throwPose, 0);
        },

        resetBase: function () {
          this.baseY = this.el.object3D.position.y;
          this.baseRotationX = this.el.object3D.rotation.x;
          this.baseRotationZ = this.el.object3D.rotation.z;
        },

        tick: function (time) {
          if (!this.rest || !this.throwPose) return;
          if (!this.ready) return;
          if (this.stopped) return;
          if (rhythmMode === "performance" && !performanceRoundStarted) return;
          var shiftedTime = time + this.data.offset;
          var phase = (shiftedTime % this.data.period) / this.data.period;
          var raw = phase < 0.5 ? phase * 2 : (1 - phase) * 2;
          var progress = this.easeInOut(raw);
          this.phase = phase;
          this.progress = progress;
          this.cycle = Math.floor(shiftedTime / this.data.period);

          this.setPoseOpacity(this.rest, 1 - progress);
          this.setPoseOpacity(this.throwPose, progress);
          this.el.object3D.position.y = this.baseY;
          this.el.object3D.rotation.x = this.baseRotationX + THREE.MathUtils.degToRad(-this.data.lean * progress);
          this.el.object3D.rotation.z = this.baseRotationZ + THREE.MathUtils.degToRad(2 * progress);
        },

        easeInOut: function (value) {
          return value < 0.5 ? 4 * value * value * value : 1 - Math.pow(-2 * value + 2, 3) / 2;

          var throwPoseVisible = this.phase >= 0.28 && this.phase <= 0.46 && this.progress >= 0.42;
          if (!throwPoseVisible || this.lastReleaseCycle === this.cycle) return false;
          return true;
        },

        markThrowReleased: function () {
          this.lastReleaseCycle = this.cycle;
        },

        shouldReleaseThrow: function () {
          if (!this.canReleaseThrow()) return false;
          this.markThrowReleased();
          return true;
        },

        stopAtRest: function () {
          this.stopped = true;
          this.progress = 0;
          this.setPoseOpacity(this.rest, 1);
          this.setPoseOpacity(this.throwPose, 0);

          this.el.object3D.rotation.x = this.baseRotationX;
          this.el.object3D.rotation.z = this.baseRotationZ;
        },

          this.alignPoseToFootPoint(this.rest);
          this.alignPoseToFootPoint(this.throwPose);
        },

        placeGroupOnGround: function () {
          var box = new THREE.Box3().setFromObject(this.el.object3D);
          if (!isFinite(box.min.y)) return;
          this.el.object3D.position.y += this.data.groundY - box.min.y;
        },

        alignPoseToFootPoint: function (pose) {
          if (!pose) return;
          if (pose.dataset.feetAligned === "true") return;
          var box = new THREE.Box3().setFromObject(pose.object3D);
          if (!isFinite(box.min.y)) return;

          var footCenter = new THREE.Vector3(
            (box.min.x + box.max.x) / 2,
            box.min.y,
            (box.min.z + box.max.z) / 2
          );
          var localFootCenter = this.el.object3D.worldToLocal(footCenter.clone());
          pose.object3D.position.x -= localFootCenter.x;
          pose.object3D.position.y -= localFootCenter.y;

              if (!material.userData.opacityClone) {
                var cloned = material.clone();
                cloned.userData.opacityClone = true;
                if (Array.isArray(node.material)) node.material[index] = cloned;
                else node.material = cloned;
                material = cloned;
              }
              material.transparent = true;
              material.opacity = opacity;
              material.depthWrite = opacity > 0.98;
              material.needsUpdate = true;
            });
          });
        },

        remove: function () {
          if (this.rest) this.rest.removeEventListener("model-loaded", this.onModelLoaded);
          if (this.throwPose) this.throwPose.removeEventListener("model-loaded", this.onModelLoaded);

        },

        tick: function (time, delta) {
          var gamepadInput = this.readGamepadAxes();
          if (!gamepadInput) return;

          var dt = Math.min(delta / 1000, 0.05);
          var moveX = this.applyDeadzone(gamepadInput.moveX);
          var moveY = this.applyDeadzone(gamepadInput.moveY);
          var turnX = this.applyDeadzone(gamepadInput.turnX);

          if (Math.abs(moveX) > 0 || Math.abs(moveY) > 0) {
            this.moveRig(moveX, moveY, dt);
          }

          if (Math.abs(turnX) > 0) {
            this.el.object3D.rotation.y -= THREE.MathUtils.degToRad(turnX * this.data.turnSpeed * dt);
          }

        readGamepadAxes: function () {

          var renderer = this.el.sceneEl && this.el.sceneEl.renderer;

          var session = xr && xr.getSession ? xr.getSession() : null;
          if (!session || !session.inputSources) return null;

          var leftMove = null;
          var rightMove = null;
          var fallbackMove = null;

          Array.from(session.inputSources).forEach(function (source) {
            if (!source || !source.gamepad || !source.gamepad.axes) return;

            var pair = this.findPrimaryAxisPair(source.gamepad.axes);
            if (!pair) return;

            if (source.handedness === "left") {
              leftMove = pair;
            } else if (source.handedness === "right") {
              rightMove = pair;
            }

            if (!fallbackMove || pair.strength > fallbackMove.strength) {
              fallbackMove = pair;
            }
          }.bind(this));

          if (!leftMove && !rightMove && !fallbackMove) return null;

          var move = leftMove || fallbackMove || rightMove;
          var turnX = leftMove && rightMove ? rightMove.x : 0;

            turnX: turnX,

            var pair = this.findPrimaryAxisPair(pad.axes);
            if (!pair) continue;

            if (!bestMove || pair.strength > bestMove.strength) {
              bestMove = pair;
            } else if (Math.abs(pair.x) > Math.abs(bestTurn)) {
              bestTurn = pair.x;

          }

          if (!bestMove) return null;

          return {
            moveX: bestMove.x,
            moveY: bestMove.y,
            turnX: bestTurn,

        attachAxisEvents: function () {
          var leftHand = document.querySelector("#leftHand");
          var rightHand = document.querySelector("#rightHand");
          var events = ["axismove", "thumbstickmoved", "trackpadmoved"];

          if (leftHand) {
            events.forEach(function (eventName) {
              leftHand.addEventListener(eventName, function (event) {
                var pair = this.axisPairFromEvent(event);
                if (!pair) return;
                this.eventInput.moveX = pair.x;
                this.eventInput.moveY = pair.y;
                this.eventInput.time = performance.now();
              }.bind(this));
            }.bind(this));
          }

          if (rightHand) {
            events.forEach(function (eventName) {
              rightHand.addEventListener(eventName, function (event) {
                var pair = this.axisPairFromEvent(event);
                if (!pair) return;
                this.eventInput.moveX = pair.x;
                this.eventInput.moveY = pair.y;
                this.eventInput.turnX = 0;
                this.eventInput.time = performance.now();
              }.bind(this));
            }.bind(this));
          }
        },

        axisPairFromEvent: function (event) {
          var detail = event.detail || {};

          if (typeof detail.x === "number" && typeof detail.y === "number") {
            return { x: detail.x, y: detail.y, strength: Math.sqrt(detail.x * detail.x + detail.y * detail.y) };
          }

          if (detail.axis && detail.axis.length >= 2) {
            return this.findPrimaryAxisPair(detail.axis);
          }

          if (detail.axes && detail.axes.length >= 2) {
            return this.findPrimaryAxisPair(detail.axes);
          }

          return null;
        },

        findPrimaryAxisPair: function (axes) {
          if (!axes || axes.length < 2) return null;

          var candidates = [];

          if (axes.length >= 4) {
            candidates.push({ x: axes[2] || 0, y: axes[3] || 0, priority: 2 });
          }

          candidates.push({ x: axes[0] || 0, y: axes[1] || 0, priority: 1 });

          for (var i = 0; i < axes.length - 1; i += 2) {
            candidates.push({ x: axes[i] || 0, y: axes[i + 1] || 0, priority: 0 });
          }

          var best = null;
          candidates.forEach(function (candidate) {
            var strength = Math.sqrt(candidate.x * candidate.x + candidate.y * candidate.y);
            candidate.strength = strength;

            if (strength <= this.data.deadzone) return;
            if (!best || candidate.priority > best.priority || strength > best.strength + 0.12) {
              best = candidate;
            }
          }.bind(this));

          return best;
        },

        findStrongestAxisPair: function (axes) {
          var best = null;

          for (var i = 0; i < axes.length - 1; i += 2) {
            var x = axes[i] || 0;
            var y = axes[i + 1] || 0;
            var strength = Math.sqrt(x * x + y * y);

            if (strength > this.data.deadzone && (!best || strength > best.strength)) {
              best = { x: x, y: y, strength: strength };
            }
          }

          return best;
        },

        applyDeadzone: function (value) {
          if (Math.abs(value) < this.data.deadzone) return 0;
          var sign = value < 0 ? -1 : 1;
          return sign * ((Math.abs(value) - this.data.deadzone) / (1 - this.data.deadzone));
        },

        moveRig: function (moveX, moveY, dt) {
          var yaw = this.getCameraYaw();
          var distance = this.data.speed * dt;
          var forwardAmount = -moveY;
          var rightAmount = -moveX;

          this.forward.set(Math.sin(yaw), 0, Math.cos(yaw));
          this.right.set(Math.cos(yaw), 0, -Math.sin(yaw));
          this.move.copy(this.forward).multiplyScalar(forwardAmount);
          this.move.addScaledVector(this.right, rightAmount);

          if (this.move.lengthSq() > 1) this.move.normalize();
          this.move.multiplyScalar(distance);
          this.el.object3D.position.add(this.move);
        },

        getCameraYaw: function () {
          if (!this.camera) return this.el.object3D.rotation.y;

          var direction = new THREE.Vector3();
          this.camera.object3D.getWorldDirection(direction);
          return Math.atan2(-direction.x, -direction.z);
        },
      });

      function refreshChoicePanelLanguage() {
        if (!pendingChoice) return;
        var text = uiText[currentLanguage];
        var titleEl = document.querySelector("#choiceTitle");
        var bodyEl = document.querySelector("#choiceBody");
        var yesBtn = document.querySelector("#choiceYes");
        var noBtn = document.querySelector("#choiceNo");
        var vrTitle = document.querySelector("#vrChoiceTitle");
        var vrBody = document.querySelector("#vrChoiceBody");

        if (pendingChoice.kind === "material") {

          if (info && info[currentLanguage]) {
            var suffix = pendingChoice.alreadyAdded
              ? (currentLanguage === "zh" ? "（已加入）" : " (Already added)")
              : (currentLanguage === "zh" ? " 是否加入熔炉？" : " Add to furnace?");
            var title = info[currentLanguage].name;
            var body = info[currentLanguage].desc + suffix;
            if (titleEl) titleEl.textContent = title;
            if (bodyEl) bodyEl.textContent = body;
            if (vrTitle) vrTitle.setAttribute("value", title);
            if (vrBody) vrBody.setAttribute("value", body);
          }
          if (yesBtn) {
            yesBtn.textContent = pendingChoice.alreadyAdded
              ? (currentLanguage === "zh" ? "确定" : "OK")
              : text.choiceYes;
            yesBtn.style.display = "";
          }
          if (noBtn) noBtn.style.display = pendingChoice.alreadyAdded ? "none" : "";
          if (vrYes) {
            vrYes.setAttribute("value", pendingChoice.alreadyAdded
              ? (currentLanguage === "zh" ? "确定" : "OK")
              : text.choiceYes);
          }
        } else if (pendingChoice.kind === "error") {
          var errTitle = currentLanguage === "zh" ? "材料错误" : "Wrong Material";
          var errBody = currentLanguage === "zh" ? "材料错误，无法添加" : "Wrong material — cannot be added.";
          if (titleEl) titleEl.textContent = errTitle;
          if (bodyEl) bodyEl.textContent = errBody;
          if (vrTitle) vrTitle.setAttribute("value", errTitle);
          if (vrBody) vrBody.setAttribute("value", errBody);
          if (yesBtn) {
            yesBtn.textContent = currentLanguage === "zh" ? "确定" : "OK";
            yesBtn.style.display = "";
          }
          if (noBtn) noBtn.style.display = "none";
          if (vrNo) vrNo.parentElement.setAttribute("visible", "false");

      function confirmChoice() {
        if (!pendingChoice) {
          closeChoicePanel();
          return;
        }
        if (pendingChoice.kind === "error") {
          closeChoicePanel();
          return;
        }
        if (pendingChoice.kind === "material") {
          var el = pendingChoice.el;
          var key = pendingChoice.key;
          var correct = pendingChoice.correct;
          var wasAlreadyAdded = pendingChoice.alreadyAdded;
          closeChoicePanel();
          if (wasAlreadyAdded) return;
          processMaterialChoice(el, key, correct);
        }
      }

      function processMaterialChoice(el, key, correct) {
        if (materialSelectionComplete) {
          setStatus("材料已全部入炉：现在点击风箱升温，并让温度保持在绿色区间 5 秒", "All materials are in the furnace. Click the bellows to heat up and hold the green zone for 5 seconds");
          return;
        }
        if (!correct) {
          el.setAttribute("animation__shake", "property: rotation; to: 0 18 0; dur: 80; dir: alternate; loop: 4");
          setTimeout(showErrorPopup, 60);
          return;
        }
        if (selectedMaterials[key]) return;

        selectedMaterials[key] = true;
        el.setAttribute("scale", "1.18 1.18 1.18");
        el.setAttribute("material", "emissive: #12d8c8; emissiveIntensity: 0.8");
        var halo = el.querySelector(".material-halo");
        if (halo) halo.setAttribute("visible", "false");
        flyMaterialToFurnace(el, key);
        updateMaterialProgress();

        var count = Object.keys(selectedMaterials).length;
        if (count < 5) {
          setStatus("材料已加入炉中：" + count + "/5", "Material added into furnace: " + count + "/5");
          return;
        }

        materialSelectionComplete = true;
        setStatus("材料已全部入炉：现在点击风箱升温，并让温度保持在绿色区间 5 秒", "All materials are in the furnace. Click the bellows to heat up and hold the green zone for 5 seconds");
        setTimeout(function () {
          startHeatingFurnace(document.querySelector("#furnace"));
        }, 650);
      }

      function chooseMaterial(el) {
        if (!el || !el.components || !el.components["material-choice"]) return;
        showMaterialChoice(el);
      }

      function randomizeMaterialPositions() {
        var items = Array.prototype.slice.call(document.querySelectorAll(".material-item"));
        if (items.length === 0) return;
        var slots = [
          { x: -1.4, z: -0.35 }, { x: -0.7, z: -0.35 }, { x: 0.0, z: -0.35 }, { x: 0.7, z: -0.35 }, { x: 1.4, z: -0.35 },
          { x: -1.4, z: 0.32 }, { x: -0.7, z: 0.32 }, { x: 0.0, z: 0.32 }, { x: 0.7, z: 0.32 }, { x: 1.4, z: 0.32 },
        ];
        for (var i = slots.length - 1; i > 0; i -= 1) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = slots[i]; slots[i] = slots[j]; slots[j] = tmp;
        }
        items.forEach(function (el, idx) {
          if (idx >= slots.length) return;
          var pos = el.getAttribute("position");
          var y = (pos && typeof pos.y === "number" && !isNaN(pos.y)) ? pos.y : 0.2;
          var slot = slots[idx];
          el.setAttribute("position", slot.x + " " + y + " " + slot.z);
        });
      }

      function stripMaterialCloneInteraction(material) {
        var nodes = [material].concat(Array.prototype.slice.call(material.querySelectorAll("[id], .clickable, [material-choice], .material-halo")));
        nodes.forEach(function (node) {
          node.removeAttribute("id");
          node.removeAttribute("material-choice");
          node.classList.remove("clickable");
          node.classList.remove("material-item");
        });
      }

      function flyMaterialToFurnace(el, key) {
        var root = document.querySelector("#fireworks");
        var from = new THREE.Vector3();
        el.object3D.getWorldPosition(from);
        var target = sceneLayout.furnaceX + " 0.52 " + sceneLayout.furnaceZ;

        var material = el.cloneNode(true);
        material.setAttribute("position", from.x + " " + from.y + " " + from.z);
        material.setAttribute("scale", "1 1 1");
        stripMaterialCloneInteraction(material);
        material.setAttribute("animation__fly", "property: position; to: " + target + "; dur: 720; easing: easeInOutQuad");
        material.setAttribute("animation__shrink", "property: scale; to: 0.16 0.16 0.16; dur: 720; easing: easeInQuad");
        root.appendChild(material);

        setTimeout(function () {
          material.remove();
          createFurnaceEmbers(document.querySelector("#furnace"), 8, 0.22);
        }, 760);
      }

          var dot = document.querySelector("#matDot" + i);

      function prepareMoltenIron() {
        var furnace = document.querySelector("#furnace");

        if (!materialSelectionComplete) {
          setStatus("请先选择 5 项正确材料加入熔炉：稻草卷、铁炭、生铁片、黄铜、食盐", "First add all 5 correct materials: Straw Rolls, Charcoal, Pig Iron, Brass, Salt");

      function startHeatingFurnace(furnace) {
        heatingActive = true;
        furnacePrepared = true;
        heatTemperature = 35;
        heatHoldTime = 0;
        heatLastTick = performance.now();
        lastHeatingEmber = 0;
        var fill = document.querySelector("#heatingFill");
        var stream = document.querySelector("#moltenStream");
        var readout = document.querySelector("#temperatureReadout");
        var holdReadout = document.querySelector("#heatHoldReadout");

        if (fill) {
          fill.object3D.scale.x = 0.01;
          fill.setAttribute("position", "-0.78 0 0.025");
          fill.setAttribute("color", "#ff9b26");
        }
        if (readout) readout.setAttribute("value", "温度 35%｜偏低：点击风箱");
        if (holdReadout) holdReadout.setAttribute("value", "绿色温区 62-82%，保持 0.0/5 秒");

        if (stream) stream.setAttribute("visible", "false");
        addFurnaceGlow(furnace, 2.4, "#ff8a1c");
        createFurnaceEmbers(furnace, 32, 0.35);
        setStatus("控温融铁：绿色温区是 62-82%。温度下降更快，请适时点击风箱补温", "Temperature control: green zone is 62-82%. Heat falls faster now, click bellows to maintain it");
      }

      function updateHeatingProgress() {
        if (!heatingActive) return;

        var now = performance.now();
        var dt = Math.min((now - heatLastTick) / 1000, 0.08);
        heatLastTick = now;
        heatTemperature = Math.max(0, heatTemperature - 15 * dt);
        if (heatTemperature > heatMin && heatTemperature < heatMax) {
          heatHoldTime += dt;
        } else if (heatTemperature > heatMax + 8 || heatTemperature < heatMin - 10) {
          heatHoldTime = Math.max(0, heatHoldTime - 1.5 * dt);
        }

        var progress = Math.min(heatTemperature / 100, 1);
        var holdProgress = Math.min(heatHoldTime / 5, 1);
        var fill = document.querySelector("#heatingFill");
        var readout = document.querySelector("#temperatureReadout");
        var holdReadout = document.querySelector("#heatHoldReadout");
        var heatState = heatTemperature > heatMax ? "过热：暂停拉风箱" : heatTemperature >= heatMin ? "合适：保持节奏" : "偏低：点击风箱";
        var heatColor = heatTemperature > heatMax ? "#ff3b1f" : heatTemperature >= heatMin ? "#20d482" : "#ff9b26";
        if (fill) {
          fill.object3D.scale.x = Math.max(0.01, progress);
          fill.setAttribute("position", (-0.78 + progress * 0.76) + " 0 0.025");
          fill.setAttribute("color", heatColor);
        }
        if (readout) {
          readout.setAttribute("value", "温度 " + Math.round(heatTemperature) + "%｜" + heatState);
          readout.setAttribute("color", heatColor);
        }
        if (holdReadout) {
          holdReadout.setAttribute("value", "绿色温区 62-82%，保持 " + heatHoldTime.toFixed(1) + "/5 秒");
        }

        if (performance.now() - lastHeatingEmber > 260) {
          lastHeatingEmber = performance.now();
          createFurnaceEmbers(document.querySelector("#furnace"), 8 + Math.floor(progress * 12), 0.35 + progress * 0.65);
          addFurnaceGlow(document.querySelector("#furnace"), 2.4 + progress * 3.4, "#ff9b26");
          setStatus(
            "温度 " + Math.round(heatTemperature) + "%｜" + heatState + "｜稳定 " + heatHoldTime.toFixed(1) + "/5 秒",
            "Heat " + Math.round(heatTemperature) + "% | " + (heatTemperature > heatMax ? "Too hot" : heatTemperature >= heatMin ? "Good range" : "Too low") + " | Stable " + heatHoldTime.toFixed(1) + "/5 sec"
          );
        }

        if (heatHoldTime >= 5) completeHeating();
      }

      function completeHeating() {
        if (!heatingActive) return;
        heatingActive = false;
        moltenIronReady = true;
        var furnace = document.querySelector("#furnace");
        var stream = document.querySelector("#moltenStream");

        if (stream) stream.setAttribute("visible", "true");
        addFurnaceGlow(furnace, 5.8, "#ffb13d");
        createFurnaceEmbers(furnace, 60, 0.72);
        setStatus("铁水已经流出：即将进入表演场，用双手工具完成打铁花", "Molten iron is flowing: entering the performance scene to perform Iron Flower with both tools");

        setTimeout(function () {
          goToScene("scene-practice.html");
        }, 1300);
      }

      function pullBellows() {
        if (!materialSelectionComplete) {
          setStatus("先把正确材料全部加入炉中，再拉风箱", "Add all correct materials into the furnace before pulling the bellows");
          return;
        }

        if (!heatingActive && !moltenIronReady) {
          startHeatingFurnace(document.querySelector("#furnace"));
        }

        if (moltenIronReady) {
          setStatus("铁水已经流出：进入 Practice 模式", "Molten iron has flowed out: enter Practice mode");
          return;
        }

        var boost = heatTemperature < 55 ? 9 : heatTemperature < heatMin ? 7 : heatTemperature < heatMax ? 4.5 : 2.5;
        heatTemperature = Math.min(100, heatTemperature + boost);
        animateBellows();
        createBellowsAirPuff();
        createFurnaceEmbers(document.querySelector("#furnace"), 16, 0.55 + heatTemperature / 130);
        var state = heatTemperature > heatMax ? "过热，先停一下" : heatTemperature >= heatMin ? "温度合适，保持节奏" : "偏低，继续拉风箱";
        setStatus("拉风箱升温：当前温度 " + Math.round(heatTemperature) + "%｜" + state, "Bellows heat up: current heat " + Math.round(heatTemperature) + "%. " + state);
      }

      function completeMelting() {
        var furnace = document.querySelector("#furnace");
        moltenIronReady = true;

        var hotspot = document.querySelector("#furnaceHotspot");
        if (hotspot && hasLadle) hotspot.classList.remove("clickable");

        addFurnaceGlow(furnace, 5.4, "#ffb13d");
        createFurnaceEmbers(furnace, 52, 0.65);

        if (hasLadle) {
          setStatus("右手铁锹已就位，前往击打点", "Right-hand shovel is ready. Move to the strike point");
          setTimeout(function () {
            setSceneStep(3);
          }, 500);
        } else {
          setStatus("铁水已流出：点击工具站，拿起右手铁锹", "Molten iron has flowed out: pick up the right-hand shovel at the tool station");
          setTimeout(function () {
            setSceneStep(3);
            setStatus("步骤 3 表演场：点击工具站，右手拿铁锹", "Step 3 Performance Scene: click the tool station and take the shovel in your right hand");
          }, 650);
        }
      }

      function startPracticeLevel(level) {
        rhythmMode = "practice";
        rhythmLevel = level;
        rhythmScore = level === 1 ? 0 : rhythmScore;
        rhythmMisses = 0;
        rhythmEnded = false;
        rhythmActive = true;
        rhythmStart = performance.now();
        rhythmLastSpawn = 0;
        resetRhythmEntities();
        buildRhythmLanes(rhythmConfigs[level - 1].lanes);
        setStatus("Practice 第 " + level + " 关：30 秒内击中下落铁花，最多失败 3 次", "Practice Level " + level + ": hit falling sparks for 30 sec. You have 3 misses");
      }

      function startPerformanceShow() {
        rhythmMode = "performance";
        rhythmLevel = 1;
        rhythmScore = 0;
        rhythmMisses = 0;
        rhythmEnded = false;
        rhythmActive = false;
        performanceRoundStarted = false;
        rhythmStart = 0;
        rhythmLastSpawn = 0;
        rhythmFallbackLane = 0;
        resetRhythmEntities();
        buildRhythmLanes(2);
        setSceneStep(3);
        stopPersonAtRest();
        var hud = document.querySelector("#rhythmHud");
        if (hud) hud.setAttribute("value", "点击开始游戏后开始计时 / Click Start Game to begin");
        setPerformanceStartButtonVisible(true);
        updateAudienceReaction();
        setStatus("表演场已就位：点击圆环上方“开始游戏”后，人物和圆圈开始运动", "Performance stage ready: click Start Game above the rings to start characters and notes");
      }

      function startPerformanceRound() {
        if (rhythmMode !== "performance" || performanceRoundStarted) return;
        performanceRoundStarted = true;
        rhythmActive = true;
        rhythmEnded = false;
        rhythmStart = performance.now();
        rhythmLastSpawn = rhythmStart;
        rhythmFallbackLane = 0;
        rhythmScore = 0;
        rhythmMisses = 0;
        resetRhythmEntities();
        buildRhythmLanes(2);
        startPersonThrowLoops();
        var hud = document.querySelector("#rhythmHud");
        setPerformanceStartButtonVisible(false);
        if (hud) hud.setAttribute("value", "Time 60  Score 0  Miss 0");
        updateAudienceReaction();
        setStatus("正式表演开始：圆圈任意部分进入圆环外径范围时，点击圆环任意部位打出铁花", "Performance starts: when any part of the falling circle enters the ring's outer radius, click anywhere on the ring target to burst Iron Flower");
      }

      function setPerformanceStartButtonVisible(visible) {
        var startButton = document.querySelector("#performanceStartButton");
        if (!startButton) return;
        startButton.setAttribute("visible", visible);
        startButton.object3D.visible = visible;
        startButton.classList.toggle("clickable", visible);
      }

      function resetRhythmEntities() {
        rhythmNotes = [];
        var lanes = document.querySelector("#rhythmLanes");
        var notes = document.querySelector("#rhythmNotes");
        if (lanes) lanes.innerHTML = "";
        if (notes) notes.innerHTML = "";
      }

      function buildRhythmLanes(count) {
        var lanes = document.querySelector("#rhythmLanes");
        var title = document.querySelector("#rhythmTitle");
        if (!lanes) return;

        var spacing = rhythmMode === "performance" ? 0.82 : 0.62;
        var total = (count - 1) * spacing;
        for (var i = 0; i < count; i += 1) {
          var x = -total / 2 + i * spacing;
          var lane = document.createElement("a-entity");
          lane.setAttribute("position", x + " 1.85 0");
          var laneGuide = rhythmMode === "performance" ? "" : '<a-cylinder radius="0.018" height="2.5" rotation="0 0 0" color="#ffd37a" material="transparent: true; opacity: 0.34"></a-cylinder>';
          lane.innerHTML =
            laneGuide +
            '<a-circle class="clickable rhythm-hit" data-lane-index="' + i + '" position="0 -1.05 0.015" radius="0.26" material="shader: flat; transparent: true; opacity: 0; depthWrite: false; side: double"></a-circle>' +
            '<a-ring position="0 -1.05 0.03" radius-inner="0.16" radius-outer="0.23" color="#ffbd42" material="transparent: true; opacity: 0.9; emissive: #ff8a00; emissiveIntensity: 0.65"></a-ring>' +
            '<a-text value="' + (i + 1) + '" align="center" width="1.5" position="0 -1.42 0.04" color="#fff4d2"></a-text>';
          lanes.appendChild(lane);
        }

        if (title) {
          var label = rhythmMode === "practice" ? "Practice Mode 第 " + rhythmLevel + " 关" : "Performance Mode 正式表演";
          var body = rhythmMode === "practice" ? "Hit notes in the judgment rings. Three misses fail the level" : "60 seconds, unlimited life. Audience reacts to your score";
          title.setAttribute("canvas-label", "text: " + label + "|" + body + "; width: 4.8; height: 0.72");
        }
      }

      function updateRhythmGame() {
        if (!rhythmActive) return;
        var now = performance.now();
        var config = rhythmMode === "practice" ? rhythmConfigs[rhythmLevel - 1] : { lanes: 2, speed: 1.45, spawn: 610, duration: 60000 };
        var elapsed = now - rhythmStart;
        var hud = document.querySelector("#rhythmHud");

        if (rhythmMode === "performance") {
          spawnReadyPerformanceNotes(config, now);
        } else if (shouldSpawnRhythmNote(now, config)) {
          rhythmLastSpawn = now;
          spawnRhythmNote(config);
        }

        rhythmNotes.slice().forEach(function (note) {
          updateRhythmNotePosition(note, now, config);
          if (isRhythmNoteMissed(note)) {
            note.el.remove();
            rhythmNotes.splice(rhythmNotes.indexOf(note), 1);
            registerRhythmMiss();
          }
        });

        if (hud) {
          var remaining = Math.max(0, Math.ceil((config.duration - elapsed) / 1000));
          if (rhythmMode === "practice") {
            hud.setAttribute("value", "Practice " + rhythmLevel + "/3   Time " + remaining + "   Miss " + rhythmMisses + "/3   Score " + rhythmScore);
          } else {
            hud.setAttribute("value", "Time " + remaining + "  Score " + rhythmScore + "  Miss " + rhythmMisses);
          }
        }

        if (rhythmMode === "practice" && rhythmMisses >= 3) {
          restartPracticeLevel();
          return;
        }

        if (elapsed >= config.duration && !rhythmEnded) {
          rhythmEnded = true;
          if (rhythmMode === "practice") {
            if (rhythmLevel < 3) {
              setStatus("Practice 第 " + rhythmLevel + " 关通过：进入下一关", "Practice Level " + rhythmLevel + " passed: next level");
              setTimeout(function () { startPracticeLevel(rhythmLevel + 1); }, 1200);
            } else {
              rhythmActive = false;
              setStatus("三关通过：获得打铁花表演资质，进入正式表演", "All three levels passed: performance qualification earned");
              setTimeout(function () { goToScene("scene-performance.html"); }, 1500);
            }
          } else {
            rhythmActive = false;
            updateAudienceReaction();
            stopPersonAtRest();
            setStatus("表演结束：最终得分 " + rhythmScore, "Performance complete: final score " + rhythmScore);
          }
        }
      }

      function stopPersonAtRest() {
        ["#personModelMirror", "#personModel1"].forEach(function (selector) {
          var person = document.querySelector(selector);
          var throwLoop = person && person.components && person.components["person-throw-loop"];
          if (throwLoop) throwLoop.stopAtRest();
        });
      }

      function startPersonThrowLoops() {
        ["#personModelMirror", "#personModel1"].forEach(function (selector) {
          var person = document.querySelector(selector);
          var throwLoop = person && person.components && person.components["person-throw-loop"];
          if (!throwLoop) return;
          throwLoop.stopped = false;
          throwLoop.phase = 0;
          throwLoop.progress = 0;
          throwLoop.lastReleaseCycle = -1;
          throwLoop.resetBase();
        });
      }

      function spawnRhythmNote(config, forcedLane) {
        var lanes = config.lanes;
        var lane = typeof forcedLane === "number" ? forcedLane : Math.floor(Math.random() * lanes);
        var spacing = 0.62;
        var total = (lanes - 1) * spacing;
        var x = -total / 2 + lane * spacing;
        var note = document.createElement("a-entity");
        note.setAttribute("geometry", "primitive: sphere; radius: 0.075");
        note.setAttribute("material", "color: #fff4c1; emissive: #ff6a00; emissiveIntensity: 2.8; transparent: true; opacity: 1");
        document.querySelector("#rhythmNotes").appendChild(note);

        if (rhythmMode === "performance") {
          var ringCenter = getRhythmRingLocalCenter(lane);
          var end = ringCenter.clone();
          end.y -= 0.31;
          var start = getThrowStartLocalPosition(end, lane);
          var control = new THREE.Vector3(
            (start.x + ringCenter.x) / 2,
            Math.max(start.y, ringCenter.y) + 1.75,
            (start.z + ringCenter.z) / 2
          );
          var exitControl = new THREE.Vector3(
            ringCenter.x,
            ringCenter.y - 0.16,
            ringCenter.z
          );
          var birth = performance.now();
          var duration = choosePerformanceNoteDuration(birth, 1200);
          note.setAttribute("position", start.x + " " + start.y + " " + start.z);
          rhythmNotes.push({
            el: note,
            lane: lane,
            x: start.x,
            y: start.y,
            z: start.z,
            curve: true,
            start: start,
            control: control,
            end: end,
            ringCenter: ringCenter,
            exitControl: exitControl,
            birth: birth,
            duration: duration,
            arrivalTime: birth + duration * 0.82,
          });
        } else {
          note.setAttribute("position", x + " 3.1 0.08");
          rhythmNotes.push({ el: note, lane: lane, x: x, y: 3.1, z: 0.08 });
        }
      }

      function shouldSpawnRhythmNote(now, config) {
        if (rhythmMode !== "performance") return now - rhythmLastSpawn > config.spawn;
        return false;
      }

      function spawnReadyPerformanceNotes(config, now) {
        var hasReadyThrower = false;
        var firstLane = rhythmFallbackLane % config.lanes;
        var candidateLane = -1;
        for (var index = 0; index < config.lanes; index += 1) {
          var lane = (firstLane + index) % config.lanes;
          var person = getPerformancePersonForLane(lane, config.lanes);
          var throwLoop = person && person.components && person.components["person-throw-loop"];
          if (throwLoop && throwLoop.ready && !throwLoop.stopped) hasReadyThrower = true;
          if (throwLoop && throwLoop.canReleaseThrow()) {
            candidateLane = lane;
            break;
          }
        }

        if (candidateLane >= 0 && canSpawnPerformanceNote(now)) {
          var candidatePerson = getPerformancePersonForLane(candidateLane, config.lanes);
          var candidateLoop = candidatePerson && candidatePerson.components && candidatePerson.components["person-throw-loop"];
          if (candidateLoop) candidateLoop.markThrowReleased();
          rhythmLastSpawn = now;
          spawnRhythmNote(config, candidateLane);
          rhythmFallbackLane = candidateLane + 1;
          return;
        }

        if (!hasReadyThrower && now - rhythmLastSpawn > Math.max(config.spawn, performanceSpawnGap)) {
          rhythmLastSpawn = now;
          spawnRhythmNote(config, firstLane);
          rhythmFallbackLane = firstLane + 1;
        }
      }

      function canSpawnPerformanceNote(now) {
        return now - rhythmLastSpawn >= performanceSpawnGap;
      }

      function choosePerformanceNoteDuration(now, baseDuration) {
        var nextArrival = now + baseDuration * 0.82;
        var nearestArrivalGap = rhythmNotes.reduce(function (nearest, note) {
          if (!note.arrivalTime) return nearest;
          return Math.min(nearest, Math.abs(note.arrivalTime - nextArrival));
        }, Infinity);
        var crowdingDelay = nearestArrivalGap < 180 ? 180 - nearestArrivalGap : 0;
        return baseDuration + crowdingDelay + Math.random() * 180;
      }

      function updateRhythmNotePosition(note, now, config) {
        if (note.curve) {
          var progress = Math.min((now - note.birth) / note.duration, 1.2);
          note.progress = progress;
          var clamped = Math.min(progress, 1);
          var pos = getThrowCurvePoint(note, clamped);
          note.x = pos.x;
          note.y = pos.y;
          note.z = pos.z;
          note.el.setAttribute("position", note.x + " " + note.y + " " + note.z);
          return;
        }

        note.y -= config.speed / 60;
        note.el.setAttribute("position", note.x + " " + note.y + " " + note.z);
      }

      function isRhythmNoteMissed(note) {
        if (note.curve) return note.progress >= 1;
        return note.y < 0.48;
      }

      function quadraticPoint(start, control, end, progress) {
        var inverse = 1 - progress;
        return new THREE.Vector3(
          inverse * inverse * start.x + 2 * inverse * progress * control.x + progress * progress * end.x,
          inverse * inverse * start.y + 2 * inverse * progress * control.y + progress * progress * end.y,
          inverse * inverse * start.z + 2 * inverse * progress * control.z + progress * progress * end.z
        );
      }

      function getThrowCurvePoint(note, progress) {
        if (progress <= 0.82) {
          return quadraticPoint(note.start, note.control, note.ringCenter, progress / 0.82);
        }
        return note.ringCenter.clone().lerp(note.end, (progress - 0.82) / 0.18);
      }

      function hitRhythmLane(laneIndex) {
        if (!rhythmActive) return;
        var targetY = 0.8;
        var noteRadius = 0.075;
        var ringOuterRadius = 0.23;
        var best = null;
        rhythmNotes.forEach(function (note) {
          if (note.lane !== laneIndex) return;
          var ringCenter = getRhythmRingLocalCenter(laneIndex);
          var distance = note.curve
            ? Math.sqrt(Math.pow(note.x - ringCenter.x, 2) + Math.pow(note.y - ringCenter.y, 2))
            : Math.abs(note.y - targetY);
          var entersOuterRadius = distance <= ringOuterRadius + noteRadius;
          if (entersOuterRadius && (!best || distance < best.distance)) {
            best = { note: note, distance: distance };
          }
        });

        if (!best) {
          registerRhythmMiss();
          return;
        }

        var note = best.note;
        rhythmNotes.splice(rhythmNotes.indexOf(note), 1);
        note.el.remove();
        rhythmScore += best.distance >= 0.16 && best.distance <= 0.23 ? 120 : 80;
        var ringCenter = getRhythmRingCenter(laneIndex);
        if (rhythmMode === "performance") {
          launchIronFlower(ringCenter.x, ringCenter.y, ringCenter.z);
          setStatus("圆圈进入圆环外径范围：铁花从圆环中散开", "The falling circle entered the ring's outer radius: Iron Flower bursts from the ring");
        } else {
          createFlash(document.querySelector("#fireworks"), ringCenter.x, ringCenter.y, ringCenter.z, 4, 5, 280);
        }
        if (rhythmMode === "performance") updateAudienceReaction();
      }

      function getRhythmRingCenter(laneIndex) {
        var ring = document.querySelector('.rhythm-hit[data-lane-index="' + laneIndex + '"]');
        var center = new THREE.Vector3(sceneStepX[currentSceneStep], 0.8, -3.47);
        if (ring) ring.object3D.getWorldPosition(center);
        return center;
      }

      function getRhythmRingLocalCenter(laneIndex) {
        var notesRoot = document.querySelector("#rhythmNotes");
        var worldCenter = getRhythmRingCenter(laneIndex);
        if (notesRoot) return notesRoot.object3D.worldToLocal(worldCenter.clone());
        return new THREE.Vector3(0, 0.8, 0.03);
      }

      function getThrowStartLocalPosition(endLocal, laneIndex) {
        var notesRoot = document.querySelector("#rhythmNotes");
        var person = getPerformancePersonForLane(laneIndex, 2);
        var pose = person && person.querySelector("#personPoseThrow");
        var ringWorld = endLocal.clone();
        if (notesRoot) notesRoot.object3D.localToWorld(ringWorld);

        var startWorld = getSpoonLikeWorldPosition(pose, ringWorld, person);
        if (notesRoot) return notesRoot.object3D.worldToLocal(startWorld);
        return new THREE.Vector3(2.0, 1.6, -1.2);
      }

      function getSpoonLikeWorldPosition(pose, ringWorld, person) {
        if (pose && pose.components && pose.components["gltf-model"]) {
          var spoonBowlLocal = new THREE.Vector3(-0.62, 0.72, 0.03);
          return pose.object3D.localToWorld(spoonBowlLocal);
        }

        var fallback = new THREE.Vector3(9.05, 1.35, -4.25);
        if (person) {
          person.object3D.getWorldPosition(fallback);
          var direction = ringWorld.clone().sub(fallback);
          direction.y = 0;
          if (direction.lengthSq() > 0.001) direction.normalize();
          fallback.addScaledVector(direction, 0.7);
          fallback.y += 1.35;
        }
        return fallback;
      }

      function getPerformancePersonForLane(laneIndex, laneCount) {
        if (laneCount > 1 && laneIndex === 0) return document.querySelector("#personModelMirror");
        return document.querySelector("#personModel1");
      }

      function registerRhythmMiss() {
        if (!rhythmActive) return;
        rhythmMisses += 1;
        rhythmScore = Math.max(0, rhythmScore - (rhythmMode === "performance" ? 45 : 25));
        if (rhythmMode === "performance") updateAudienceReaction();
      }

      function restartPracticeLevel() {
        rhythmActive = false;
        setStatus("Practice 第 " + rhythmLevel + " 关失败：3 次失误已用完，重新开始本关", "Practice Level " + rhythmLevel + " failed: three misses used. Restarting");
        setTimeout(function () {
          startPracticeLevel(rhythmLevel);
        }, 1400);
      }

      function updateAudienceReaction() {
        var reaction = document.querySelector("#audienceReaction");
        if (!reaction) return;
        var text = "观众屏息等待";
        if (rhythmScore >= 2600) text = "满堂喝彩！铁花如瀑";
        else if (rhythmScore >= 1600) text = "掌声热烈，观众惊叹";
        else if (rhythmScore >= 800) text = "观众点头，节奏稳定";
        else if (rhythmMisses > 4) text = "观众有些紧张，注意节奏";
        reaction.setAttribute("value", text);
      }

      function animateBellows() {
        var body = document.querySelector("#bellowsBody");
        var handle = document.querySelector("#bellowsHandle");
        if (!body || !handle) return;

        body.removeAttribute("animation__compress");
        body.removeAttribute("animation__release");
        handle.removeAttribute("animation__pull");
        handle.removeAttribute("animation__return");

        body.setAttribute("animation__compress", "property: scale; to: 1 0.62 0.86; dur: 160; easing: easeOutQuad");
        handle.setAttribute("animation__pull", "property: position; to: -0.74 0.32 0; dur: 160; easing: easeOutQuad");

        setTimeout(function () {
          body.setAttribute("animation__release", "property: scale; to: 1 1 1; dur: 260; easing: easeOutElastic");
          handle.setAttribute("animation__return", "property: position; to: -0.62 0.45 0; dur: 260; easing: easeOutElastic");
        }, 170);
      }

      function updateHeatIndicators() {
        for (var i = 1; i <= 3; i += 1) {
          var dot = document.querySelector("#heatDot" + i);
          if (!dot) continue;
          var active = i <= bellowsPulls;
          dot.setAttribute("color", active ? "#ffb13d" : "#3b2a1c");
          dot.setAttribute("material", active ? "emissive: #ff6a00; emissiveIntensity: 1.7" : "");
        }
      }

      function createBellowsAirPuff() {
        var root = document.querySelector("#fireworks");
        for (var i = 0; i < 22; i += 1) {
          var puff = document.createElement("a-entity");
          puff.setAttribute("geometry", "primitive: sphere; radius: 0.018");
          puff.setAttribute("position", "-0.62 0.44 -3.38");
          puff.setAttribute("material", "color: #ffcc72; emissive: #ff6a00; emissiveIntensity: 1.4; transparent: true; opacity: 0.55");
          puff.setAttribute("spark-move", {
            vx: -2.35 - Math.random() * 0.75,
            vy: -0.05 + Math.random() * 0.25,
            vz: (Math.random() - 0.5) * 0.22,
            gravity: 0.006,
            life: 420 + Math.random() * 220,
            delay: Math.random() * 90,
            trail: false,
          });
          root.appendChild(puff);
        }
      }

      function addFurnaceGlow(furnace, intensity, color) {
        var glow = document.createElement("a-light");
        glow.setAttribute("type", "point");
        glow.setAttribute("color", color);
        glow.setAttribute("intensity", String(intensity));
        glow.setAttribute("distance", "7");
        glow.setAttribute("position", "0 0.35 0");
        furnace.appendChild(glow);
      }

      function createFurnaceEmbers(furnace, count, heightBoost) {
        for (var i = 0; i < count; i += 1) {
          var ember = document.createElement("a-entity");
          ember.setAttribute("mixin", "spark");
          ember.setAttribute("position", (Math.random() - 0.5) * 0.45 + " 0.28 " + (Math.random() - 0.5) * 0.45);
          ember.setAttribute("scale", "0.55 0.55 0.55");
          ember.setAttribute("spark-move", {
            vx: (Math.random() - 0.5) * 0.28,
            vy: heightBoost + Math.random() * 0.95,
            vz: (Math.random() - 0.5) * 0.28,
            life: 700 + Math.random() * 420,
          });
          furnace.appendChild(ember);
        }
      }

      function toggleToolsAtStation() {
        if (hasLadle) {
          returnToolsToStation();
        } else {
          if (!moltenIronReady) {
            setStatus("工具在第 3 步使用：请先完成材料入炉和 5 秒加热点火", "Tools are used in Step 3: complete materials and the 5-second heating first");
            return;
          }
          pickUpLadle();
        }
      }

      function pickUpLadle() {
        if (hasLadle) return;

        hasLadle = true;

        var toolStation = document.querySelector("#ladle");
        toolStation.classList.remove("clickable");
        toolStation.setAttribute("visible", "true");
        setTimeout(function () {
          toolStation.classList.add("clickable");
        }, 250);

        addHeldShovel();
        moveLadleToBestAnchor();
        setSceneStep(3);
        setLadleHintVisible(false);
        setStatus("右手铁锹已就位：等待圆圈进入圆环后点击圆环打铁花", "Right-hand shovel is ready: click the ring when the circle enters it");
      }

      function returnToolsToStation() {
        var toolStation = document.querySelector("#ladle");
        var bowl = document.querySelector("#heldBowl");
        var paddle = document.querySelector("#heldPaddle");
        var shovel = document.querySelector("#heldShovel");
        var molten = document.querySelector("#heldMoltenIron");

        if (molten) molten.remove();
        if (bowl) bowl.remove();
        if (paddle) paddle.remove();
        if (shovel) shovel.remove();

        hasLadle = false;
        ladleLoaded = false;
        lowerStickAdded = false;

        toolStation.setAttribute("visible", "true");
        toolStation.classList.add("clickable");
        toolStation.setAttribute("scale", "1 1 1");

        if (moltenIronReady) {
          setSceneStep(3);
          setStatus("铁锹已放回：可再次点击工具站拿起右手铁锹", "Shovel returned: click the tool station again to take the right-hand shovel");
        } else {
          setStatus("工具已放回：按三步流程继续执行", "Tools returned: continue following the three-step flow");
        }
      }

      function setLadleHintVisible(visible) {
        var label = document.querySelector("#labelLadle");
        if (!label) return;
        label.setAttribute("visible", visible);
        label.object3D.visible = visible;
      }

      function moveLadleToBestAnchor() {
        addHeldShovel();
        var shovel = document.querySelector("#heldShovel");
        var scene = document.querySelector("a-scene");
        var rightAnchor = document.querySelector("#handHeldAnchor");
        var cameraAnchor = document.querySelector("#heldAnchor");
        var useHand = scene && scene.is("vr-mode") && rightAnchor;

        if (!shovel) return;

        if (useHand) {
          rightAnchor.appendChild(shovel);
          shovel.setAttribute("position", "0 0 -0.04");
          shovel.setAttribute("rotation", "0 90 0");
          shovel.setAttribute("scale", "0.5 0.5 0.5");
        } else if (cameraAnchor) {
          cameraAnchor.appendChild(shovel);
          shovel.setAttribute("position", "0.34 -0.03 -0.02");
          shovel.setAttribute("rotation", "0 90 0");
          shovel.setAttribute("scale", "0.5 0.5 0.5");
        }
      }

      function fillLadleWithMoltenIron() {
        addHeldShovel();
        if (ladleLoaded) return;
        ladleLoaded = true;
      }

      function addLowerStick() {
        if (lowerStickAdded) return;
        lowerStickAdded = true;

        addHeldShovel();
      }

      function addHeldShovel() {
        if (document.querySelector("#heldShovel")) return;

        var shovel = document.createElement("a-entity");
        shovel.setAttribute("id", "heldShovel");
        shovel.setAttribute("gltf-model", "#shovelAsset");
        shovel.setAttribute("shadow", "cast: true; receive: true");
        document.querySelector("#fireworks").appendChild(shovel);
      }

      function launchIronFlower(x, y, z) {
        var root = document.querySelector("#fireworks");
        var origin = new THREE.Vector3(x, y, z + 0.65);
        var burst = new THREE.Vector3(x, y, z);

        createIronComet(root, origin, burst);
        createShockRing(root, x, y, z);
        createFlash(root, x, y, z, 11, 11, 760);

        for (var i = 0; i < 420; i += 1) {
          var spark = document.createElement("a-entity");
          var angle = THREE.MathUtils.degToRad(-28 + Math.random() * 236);
          var fan = Math.pow(Math.random(), 0.55);
          var speed = 1.2 + Math.random() * 7.6;
          var size = 0.42 + Math.random() * 1.9;
          var delay = Math.random() * 240;

          spark.setAttribute("mixin", "spark");
          spark.setAttribute("position", x + " " + y + " " + z);
          spark.setAttribute("scale", size + " " + size + " " + size);
          spark.setAttribute(
            "material",
            "color: " +
              randomFireColor() +
              "; emissive: #ff6a00; emissiveIntensity: " +
              (2.4 + Math.random() * 2.8) +
              "; transparent: true; opacity: 1"
          );
          spark.setAttribute("spark-move", {
            vx: Math.cos(angle) * speed * fan,
            vy: 0.35 + Math.random() * 3.8,
            vz: -Math.abs(Math.sin(angle)) * speed * 0.5 - Math.random() * 0.65,
            gravity: 0.035 + Math.random() * 0.04,
            life: 980 + Math.random() * 1050,
            delay: delay,
            trail: Math.random() > 0.5,
          });
          root.appendChild(spark);
        }

        for (var j = 0; j < 130; j += 1) {
          var ember = document.createElement("a-entity");
          var drift = THREE.MathUtils.degToRad(25 + Math.random() * 130);
          var emberSpeed = 0.6 + Math.random() * 2.4;
          ember.setAttribute("mixin", "spark");
          ember.setAttribute("position", (x + (Math.random() - 0.5) * 2.8) + " " + (y + 1.1 + Math.random() * 1.45) + " " + (z - 0.55 - Math.random() * 1.35));
          ember.setAttribute("scale", "0.55 0.55 0.55");
          ember.setAttribute("material", "color: #ffb13d; emissive: #ff5a14; emissiveIntensity: 2.2; transparent: true; opacity: 0.85");
          ember.setAttribute("spark-move", {
            vx: Math.cos(drift) * emberSpeed * 0.45,
            vy: -0.25 - Math.random() * 0.65,
            vz: -Math.sin(drift) * emberSpeed * 0.18,
            gravity: 0.018,
            life: 1400 + Math.random() * 1300,
            delay: 180 + Math.random() * 450,
            trail: false,
          });
          root.appendChild(ember);
        }
      }

      function createIronComet(root, origin, burst) {
        var comet = document.createElement("a-entity");
        comet.setAttribute("geometry", "primitive: sphere; radius: 0.075");
        comet.setAttribute("material", "color: #fff4c1; emissive: #ff6a00; emissiveIntensity: 4.5; transparent: true; opacity: 1");
        comet.setAttribute("position", origin.x + " " + origin.y + " " + origin.z);
        comet.setAttribute("comet-flight", {
          toX: burst.x,
          toY: burst.y,
          toZ: burst.z,
          life: 360,
        });
        root.appendChild(comet);
      }

      function createShockRing(root, x, y, z) {
        var ring = document.createElement("a-ring");
        ring.setAttribute("position", x + " " + y + " " + z);
        ring.setAttribute("rotation", "0 0 0");
        ring.setAttribute("radius-inner", "0.12");
        ring.setAttribute("radius-outer", "0.16");
        ring.setAttribute("color", "#fff4c1");
        ring.setAttribute("material", "shader: flat; transparent: true; opacity: 0.86; side: double");
        ring.setAttribute("shock-ring", "");
        root.appendChild(ring);
      }

      function createFlash(root, x, y, z, intensity, distance, life) {
        var flash = document.createElement("a-light");
        flash.setAttribute("type", "point");
        flash.setAttribute("color", "#ffb13d");
        flash.setAttribute("intensity", String(intensity));
        flash.setAttribute("distance", String(distance));
        flash.setAttribute("position", x + " " + y + " " + z);
        flash.setAttribute("flash-fade", { intensity: intensity, life: life });
        root.appendChild(flash);
      }

      AFRAME.registerComponent("spark-move", {
        schema: {
          vx: { default: 0 },
          vy: { default: 1 },
          vz: { default: 0 },
          gravity: { default: 0.045 },
          life: { default: 1000 },
          delay: { default: 0 },
          trail: { default: false },
        },

        init: function () {
          this.birth = performance.now();
          this.lastTrail = 0;
          this.startScale = this.el.object3D.scale.clone();
          if (this.data.delay > 0) {
            this.el.object3D.visible = false;
          }
        },

        tick: function () {
          var now = performance.now();
          var age = now - this.birth - this.data.delay;
          if (age < 0) return;
          this.el.object3D.visible = true;
          var progress = age / this.data.life;

          this.el.object3D.position.x += this.data.vx / 60;
          this.el.object3D.position.y += this.data.vy / 60;
          this.el.object3D.position.z += this.data.vz / 60;
          this.data.vy -= this.data.gravity;

          var fade = Math.max(0, 1 - progress);
          this.el.object3D.scale.copy(this.startScale).multiplyScalar(0.35 + fade * 0.95);
          this.el.setAttribute("material", "opacity", fade);

          if (this.data.trail && now - this.lastTrail > 42 && fade > 0.16) {
            this.lastTrail = now;
            createTrailDot(this.el.parentElement, this.el.object3D.position, fade);
          }

          if (progress >= 1 || this.el.object3D.position.y < 0) {
            this.el.remove();
          }
        },
      });

      function createTrailDot(root, position, fade) {
        if (!root) return;
        if (root.children.length > 850) return;
        var dot = document.createElement("a-entity");
        dot.setAttribute("geometry", "primitive: sphere; radius: 0.018");
        dot.setAttribute("position", position.x + " " + position.y + " " + position.z);
        dot.setAttribute("material", "color: #ffd06a; emissive: #ff5a14; emissiveIntensity: 1.8; transparent: true; opacity: " + Math.min(0.72, fade));
        dot.setAttribute("trail-fade", "");
        root.appendChild(dot);
      }

      AFRAME.registerComponent("trail-fade", {
        init: function () {
          this.birth = performance.now();
          this.startScale = this.el.object3D.scale.clone();
        },

        tick: function () {
          var progress = (performance.now() - this.birth) / 420;
          this.el.object3D.scale.copy(this.startScale).multiplyScalar(Math.max(0.05, 1 - progress));
          this.el.setAttribute("material", "opacity", Math.max(0, 0.72 * (1 - progress)));
          if (progress >= 1) this.el.remove();
        },
      });

      AFRAME.registerComponent("comet-flight", {
        schema: {
          toX: { default: 0 },
          toY: { default: 0 },
          toZ: { default: 0 },
          life: { default: 360 },
        },

        init: function () {
          this.birth = performance.now();
          this.from = this.el.object3D.position.clone();
          this.to = new THREE.Vector3(this.data.toX, this.data.toY, this.data.toZ);
        },

        tick: function () {
          var progress = Math.min((performance.now() - this.birth) / this.data.life, 1);
          var eased = 1 - Math.pow(1 - progress, 3);
          this.el.object3D.position.lerpVectors(this.from, this.to, eased);
          this.el.setAttribute("material", "opacity", 1 - progress * 0.25);
          createTrailDot(this.el.parentElement, this.el.object3D.position, 0.9);
          if (progress >= 1) this.el.remove();
        },
      });

      AFRAME.registerComponent("shock-ring", {
        init: function () {
          this.birth = performance.now();
        },

        tick: function () {
          var progress = (performance.now() - this.birth) / 680;
          var scale = 1 + progress * 3.2;
          this.el.object3D.scale.set(scale, scale, scale);
          this.el.setAttribute("material", "opacity", Math.max(0, 0.86 * (1 - progress)));
          if (progress >= 1) this.el.remove();
        },
      });

      AFRAME.registerComponent("flash-fade", {
        schema: {
          intensity: { default: 7 },
          life: { default: 450 },
        },

        init: function () {
          this.birth = performance.now();
        },

        tick: function () {
          var progress = (performance.now() - this.birth) / this.data.life;
          this.el.setAttribute("intensity", this.data.intensity * Math.max(0, 1 - progress));

          if (progress >= 1) {
            this.el.remove();
          }
        },
      });

      function randomFireColor() {
        var colors = ["#fff4c1", "#ffd06a", "#ff9d1e", "#ff5a14", "#db1f13"];
        return colors[Math.floor(Math.random() * colors.length)];
      }

      window.addEventListener("load", function () {
        var scene = document.querySelector("a-scene");
        var startButton = document.querySelector("#startButton");
        applySceneShell();
        document.querySelector("#langToggle").addEventListener("click", toggleLanguage);
        startButton.addEventListener("click", startGame);
        document.addEventListener("keydown", function (event) {
          if (gameStarted) return;
          if (event.code === "Enter" || event.code === "Space") {
            event.preventDefault();
            startGame();
          }
        });
        document.querySelector("#choiceYes").addEventListener("click", confirmChoice);
        document.querySelector("#choiceNo").addEventListener("click", closeChoicePanel);

        applyLanguage();
        setInitialScenePreview();
        scene.setAttribute("manual-interaction", "");
        scene.setAttribute("heating-progress-loop", "");
        scene.addEventListener("enter-vr", function () {
          document.body.classList.add("vr-mode");
          closeChoicePanel();
          if (hasLadle) {
            setStatus("已进入 VR：右手铁锹，摇杆可移动", "VR mode active: right-hand shovel, joystick moves you");
          } else {
            setStatus("已进入 VR：转头可看四周，摇杆可移动", "VR mode active: turn your head to look around and use the joystick to move");
          }
          if (hasLadle) setTimeout(moveLadleToBestAnchor, 120);
        });
        scene.addEventListener("exit-vr", function () {
          document.body.classList.remove("vr-mode");
          closeChoicePanel();
          setStatus("已退出 VR：电脑可用鼠标视角和 WASD 测试", "Exited VR: on desktop, test with mouse look and WASD");
          if (hasLadle) moveLadleToBestAnchor();
        });
        document.querySelector("#rig").setAttribute("pico-thumbstick-move", "speed: 1.8; turnSpeed: 90");
        document.querySelector("#furnaceHotspot").setAttribute("furnace-step", "");
        document.querySelector("#bellowsHotspot").setAttribute("bellows-step", "");
        document.querySelectorAll(".material-item").forEach(function (item) {
          item.setAttribute("material-choice", item.getAttribute("material-choice"));
        });
        if (scene.hasLoaded) {
          setTimeout(randomizeMaterialPositions, 0);
        } else {
          scene.addEventListener("loaded", function () {
            randomizeMaterialPositions();
          });
        }
        document.querySelector("#ladle").setAttribute("pickable", "");
        document.querySelector("#strikeTarget").setAttribute("strike-target", "");
        document.querySelector("#languageSwitch").setAttribute("language-switch", "");
      });
    </script>
  </body>
</html>
