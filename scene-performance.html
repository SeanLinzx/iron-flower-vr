    <script>
      AFRAME.registerComponent("local-texture-sky", {
        schema: {
          src: { type: "string", default: "" },
        },

        init: function () {
          this._texture = null;
          this.refreshSky = this.refreshSky.bind(this);
          this.el.sceneEl.addEventListener("loaded", this.refreshSky);
          if (this.el.sceneEl.hasLoaded) this.refreshSky();
        },

        update: function () {
          this.refreshSky();
        },

        remove: function () {
          if (this._texture) this._texture.dispose();
        },

        resolveSrc: function () {
          var src = (this.data.src || "").trim();
          if (!src) return "";
          if (src.charAt(0) !== "#") return src;

          var asset = document.querySelector(src);
          if (!asset) return "";
          return asset.getAttribute("src") || asset.src || "";
        },

        refreshSky: function () {
          var self = this;
          var src = (this.data.src || "").trim();
          var url = this.resolveSrc();
          if (!url) url = "./assets/backgrounds/per.png";

          if (src.charAt(0) === "#") {
            var asset = document.querySelector(src);
            if (asset && (!asset.complete || !asset.naturalWidth)) {
              asset.addEventListener("load", function () {
                self.refreshSky();
              });
              return;
            }
          }

          var mesh = this.el.getObject3D("mesh");
          if (!mesh) {
            requestAnimationFrame(function () {
              self.refreshSky();
            });
            return;
          }

          if (this._texture) {
            this._texture.dispose();
            this._texture = null;
          }

          var loader = new THREE.TextureLoader();
          if (url.indexOf("http") === 0 || url.indexOf("data:") === 0) {
            loader.setCrossOrigin("anonymous");
          } else {
            loader.setCrossOrigin(undefined);
          }

          loader.load(
            url,
            function (texture) {
              texture.colorSpace = THREE.SRGBColorSpace;
              texture.mapping = THREE.EquirectangularReflectionMapping;
              texture.minFilter = THREE.LinearFilter;
              texture.magFilter = THREE.LinearFilter;
              texture.generateMipmaps = false;
              texture.needsUpdate = true;
              self._texture = texture;
              mesh.material = new THREE.MeshBasicMaterial({
                map: texture,
                side: THREE.BackSide,
                fog: false,
                toneMapped: false,
              });
              mesh.material.needsUpdate = true;
            },
            undefined,
            function (error) {
              console.warn("[local-texture-sky] failed to load:", url, error);
            }
          );
        },
      });
    </script>

      var pageScene = document.body.dataset.scene || "materials";

      function isPerformanceWorkflow() {
        return pageScene === "performance" || rhythmMode === "performance";
      }

      function advanceToStrikeStepIfNeeded() {
        if (isPerformanceWorkflow()) return;
        setSceneStep(3);
      }
      var storyMode = pageQuery.get("story") === "1";
      var sceneShell = {
        materials: {
          title: "准备素材",
          button: "Start Prepare",
          hint: "选择材料、控温融铁 / Prepare materials",
        },
        practice: {
          title: "练习场景",
          button: "Start Practice",
          hint: "完成四关练习 / Practice levels",
        },
        performance: {
          title: "表演场景",
          button: "Start Show",
          hint: "正式打铁花表演 / Performance",
        },
      };

      function sceneHref(file) {
        return "./" + file + (storyMode ? "?story=1" : "?mode=level");
      }

      function goToScene(file) {
        if (storyMode && window.IronFlowerStory) {
          window.IronFlowerStory.goToSceneWithStoryBridge(file, true);
          return;
        }
        window.location.href = sceneHref(file);
      }

      function applySceneShell() {
        var shell = sceneShell[pageScene] || sceneShell.materials;
        document.title = shell.title + "｜铜官窑打铁花 VR 体验";
        document.querySelector(".start-title").textContent = shell.title;
        document.querySelector("#startButton").textContent = shell.button;
        document.querySelector(".start-hint").textContent = shell.hint;
      }

      function setInitialScenePreview() {
        if (pageScene === "practice") {
          materialSelectionComplete = true;
          furnacePrepared = true;
          moltenIronReady = true;
          setSceneStep(2);
          setStatus("练习场景：点击开始后进入四关节奏练习", "Practice scene: click start to enter the four rhythm levels");
          return;
        }
        if (pageScene === "performance") {
          materialSelectionComplete = true;
          furnacePrepared = true;
          moltenIronReady = true;
          setSceneStep(2);
          stopPersonAtRest();
          setStatus("表演场景：点击工具站拿起铁锹，再点击开始表演", "Performance scene: pick up the shovel at the tool station, then tap Start Show");

          if (lines[1]) {
            context.fillStyle = "#ffd37a";
            context.font = "400 26px Arial, PingFang SC, Microsoft YaHei, sans-serif";
            this.wrapText(context, lines[1], 360, 120, 620, 34, 3);
          }

          var texture = new THREE.CanvasTexture(canvas);
          texture.needsUpdate = true;
          texture.minFilter = THREE.LinearFilter;

          if (this.mesh) {
            this.el.object3D.remove(this.mesh);

            this.mesh.material.map.dispose();
            this.mesh.material.dispose();

          var geometry = new THREE.PlaneGeometry(this.data.width, this.data.height);
          var material = new THREE.MeshBasicMaterial({
            map: texture,

            side: THREE.DoubleSide,
            depthWrite: false,
          });

          this.mesh = new THREE.Mesh(geometry, material);
          this.el.object3D.add(this.mesh);
        },

        wrapText: function (context, text, x, y, maxWidth, lineHeight, maxLines) {
          var tokens = text.match(/[\u4e00-\u9fff]|[^\s\u4e00-\u9fff]+/g) || [text];
          var lines = [];
          var line = "";

          tokens.forEach(function (token) {
            var separator = /[\u4e00-\u9fff]/.test(token) ? "" : " ";
            var testLine = line ? line + separator + token : token;

            if (context.measureText(testLine).width > maxWidth && line) {
              lines.push(line);
              line = token;
            } else {
              line = testLine;
            }
          });

          if (line) lines.push(line);

          lines.slice(0, maxLines).forEach(function (lineText, index) {
            var output = lineText;
            if (index === maxLines - 1 && lines.length > maxLines) output = lineText.replace(/\s+$/, "") + "...";
            context.fillText(output, x, y + index * lineHeight, maxWidth);
          });
        },

        roundRect: function (context, x, y, width, height, radius, fill, stroke) {
          context.beginPath();
          context.moveTo(x + radius, y);
          context.lineTo(x + width - radius, y);
          context.quadraticCurveTo(x + width, y, x + width, y + radius);
          context.lineTo(x + width, y + height - radius);
          context.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
          context.lineTo(x + radius, y + height);
          context.quadraticCurveTo(x, y + height, x, y + height - radius);
          context.lineTo(x, y + radius);
          context.quadraticCurveTo(x, y, x + radius, y);
          context.closePath();
          context.fillStyle = fill;
          context.fill();
          context.strokeStyle = stroke;
          context.lineWidth = 4;
          context.stroke();
        },
      });

      AFRAME.registerComponent("person-throw-loop", {
        schema: {
          period: { default: 2400 },
          offset: { default: 0 },

        init: function () {
          this.rest = this.el.querySelector("#personPoseRest");
          this.throwPose = this.el.querySelector("#personPoseThrow");
          this.baseY = this.el.object3D.position.y;
          this.baseRotationX = this.el.object3D.rotation.x;
          this.baseRotationZ = this.el.object3D.rotation.z;
          this.ready = false;
          this.stopped = false;
          this.loadedCount = 0;
          this.phase = 0;
          this.progress = 0;
          this.lastReleaseCycle = -1;
          this.onModelLoaded = function () {
            this.loadedCount += 1;
            this.setPoseOpacity(this.rest, 1);
            this.setPoseOpacity(this.throwPose, 0);
            if (this.loadedCount >= 2) {
              this.alignPoseFeet();
              this.placeGroupOnGround();
              this.resetBase();
              this.ready = true;
            }
          }.bind(this);
          if (this.rest) this.rest.addEventListener("model-loaded", this.onModelLoaded);
          if (this.throwPose) this.throwPose.addEventListener("model-loaded", this.onModelLoaded);
          this.setPoseOpacity(this.rest, 1);
          this.setPoseOpacity(this.throwPose, 0);
        },
        resetBase: function () {
          this.baseY = this.el.object3D.position.y;
          this.baseRotationX = this.el.object3D.rotation.x;
          this.baseRotationZ = this.el.object3D.rotation.z;
        },
        tick: function (time) {
          if (!this.rest || !this.throwPose || !this.ready || this.stopped) return;
          if (rhythmMode === "performance" && !performanceRoundStarted) return;
          var shiftedTime = time + this.data.offset;
          var phase = (shiftedTime % this.data.period) / this.data.period;
          var raw = phase < 0.5 ? phase * 2 : (1 - phase) * 2;
          var progress = this.easeInOut(raw);
          this.phase = phase;
          this.progress = progress;
          this.cycle = Math.floor(shiftedTime / this.data.period);
          this.setPoseOpacity(this.rest, 1 - progress);
          this.setPoseOpacity(this.throwPose, progress);
          this.el.object3D.position.y = this.baseY;
          this.el.object3D.rotation.x = this.baseRotationX + THREE.MathUtils.degToRad(-this.data.lean * progress);
          this.el.object3D.rotation.z = this.baseRotationZ + THREE.MathUtils.degToRad(2 * progress);
        },
        easeInOut: function (value) {
          return value < 0.5 ? 4 * value * value * value : 1 - Math.pow(-2 * value + 2, 3) / 2;
        },
        canReleaseThrow: function () {
          if (!this.ready || this.stopped) return false;
          var throwPoseVisible = this.phase >= 0.28 && this.phase <= 0.46 && this.progress >= 0.42;
          if (!throwPoseVisible || this.lastReleaseCycle === this.cycle) return false;
          return true;
        },
        markThrowReleased: function () {
          this.lastReleaseCycle = this.cycle;
        },
        stopAtRest: function () {
          this.stopped = true;
          this.progress = 0;
          this.setPoseOpacity(this.rest, 1);
          this.setPoseOpacity(this.throwPose, 0);
          this.el.object3D.position.y = this.baseY;
          this.el.object3D.rotation.x = this.baseRotationX;
          this.el.object3D.rotation.z = this.baseRotationZ;
        },
        alignPoseFeet: function () {
          this.alignPoseToFootPoint(this.rest);
          this.alignPoseToFootPoint(this.throwPose);
        },
        placeGroupOnGround: function () {
          var box = new THREE.Box3().setFromObject(this.el.object3D);
          if (!isFinite(box.min.y)) return;
          this.el.object3D.position.y += this.data.groundY - box.min.y;
        },
        alignPoseToFootPoint: function (pose) {
          if (!pose || pose.dataset.feetAligned === "true") return;
          var box = new THREE.Box3().setFromObject(pose.object3D);
          if (!isFinite(box.min.y)) return;
          var footCenter = new THREE.Vector3((box.min.x + box.max.x) / 2, box.min.y, (box.min.z + box.max.z) / 2);
          var localFootCenter = this.el.object3D.worldToLocal(footCenter.clone());
          pose.object3D.position.x -= localFootCenter.x;
          pose.object3D.position.y -= localFootCenter.y;
          pose.object3D.position.z -= localFootCenter.z;
          pose.dataset.feetAligned = "true";
        },
        setPoseOpacity: function (pose, opacity) {
          if (!pose) return;
          pose.object3D.traverse(function (node) {
            if (!node.isMesh || !node.material) return;
            var materials = Array.isArray(node.material) ? node.material : [node.material];
            materials.forEach(function (material, index) {
              if (!material.userData.opacityClone) {
                var cloned = material.clone();
                cloned.userData.opacityClone = true;
                if (Array.isArray(node.material)) node.material[index] = cloned;
                else node.material = cloned;

      AFRAME.registerComponent("pico-thumbstick-move", {
        schema: {
          speed: { default: 1.8 },
          turnSpeed: { default: 90 },
          deadzone: { default: 0.18 },
        },

        init: function () {
          this.move = new THREE.Vector3();
          this.forward = new THREE.Vector3();
          this.right = new THREE.Vector3();
          this.camera = document.querySelector("#mainCamera");
          this.eventInput = { moveX: 0, moveY: 0, turnX: 0, time: 0 };
          this.attachAxisEvents();
        },

        tick: function (time, delta) {
          var gamepadInput = this.readGamepadAxes();
          if (!gamepadInput) return;

          var dt = Math.min(delta / 1000, 0.05);
          var moveX = this.applyDeadzone(gamepadInput.moveX);
          var moveY = this.applyDeadzone(gamepadInput.moveY);
          var turnX = this.applyDeadzone(gamepadInput.turnX);

          if (Math.abs(moveX) > 0 || Math.abs(moveY) > 0) {
            this.moveRig(moveX, moveY, dt);
          }

          if (Math.abs(turnX) > 0) {
            this.el.object3D.rotation.y -= THREE.MathUtils.degToRad(turnX * this.data.turnSpeed * dt);
          }
        },

        readGamepadAxes: function () {
          return this.readWebXRAxes() || this.readNavigatorAxes() || this.readRecentAxisEvent();
        },

        readWebXRAxes: function () {
          var renderer = this.el.sceneEl && this.el.sceneEl.renderer;
          var xr = renderer && renderer.xr;
          var session = xr && xr.getSession ? xr.getSession() : null;
          if (!session || !session.inputSources) return null;

          var leftMove = null;
          var rightMove = null;
          var fallbackMove = null;

          Array.from(session.inputSources).forEach(function (source) {
            if (!source || !source.gamepad || !source.gamepad.axes) return;

            var pair = this.findPrimaryAxisPair(source.gamepad.axes);
            if (!pair) return;

            if (source.handedness === "left") {
              leftMove = pair;
            } else if (source.handedness === "right") {
              rightMove = pair;
            }

            if (!fallbackMove || pair.strength > fallbackMove.strength) {
              fallbackMove = pair;
            }
          }.bind(this));

          if (!leftMove && !rightMove && !fallbackMove) return null;

          var move = leftMove || fallbackMove || rightMove;
          var turnX = leftMove && rightMove ? rightMove.x : 0;

          return {
            moveX: move.x,
            moveY: move.y,
            turnX: turnX,
          };
        },

        readNavigatorAxes: function () {
          var pads = navigator.getGamepads ? navigator.getGamepads() : [];
          var bestMove = null;
          var bestTurn = 0;

          for (var i = 0; i < pads.length; i += 1) {
            var pad = pads[i];
            if (!pad || !pad.axes || pad.axes.length < 2) continue;

            var pair = this.findPrimaryAxisPair(pad.axes);
            if (!pair) continue;

            if (!bestMove || pair.strength > bestMove.strength) {
              bestMove = pair;
            } else if (Math.abs(pair.x) > Math.abs(bestTurn)) {
              bestTurn = pair.x;
            }
          }

          if (!bestMove) return null;

          return {
            moveX: bestMove.x,
            moveY: bestMove.y,
            turnX: bestTurn,
          };
        },

        readRecentAxisEvent: function () {
          if (performance.now() - this.eventInput.time > 350) return null;
          return {
            moveX: this.eventInput.moveX,
            moveY: this.eventInput.moveY,
            turnX: this.eventInput.turnX,
          };
        },

        attachAxisEvents: function () {
          var leftHand = document.querySelector("#leftHand");
          var rightHand = document.querySelector("#rightHand");
          var events = ["axismove", "thumbstickmoved", "trackpadmoved"];

          if (leftHand) {
            events.forEach(function (eventName) {
              leftHand.addEventListener(eventName, function (event) {
                var pair = this.axisPairFromEvent(event);
                if (!pair) return;
                this.eventInput.moveX = pair.x;
                this.eventInput.moveY = pair.y;
                this.eventInput.time = performance.now();
              }.bind(this));
            }.bind(this));
          }

          if (rightHand) {
            events.forEach(function (eventName) {
              rightHand.addEventListener(eventName, function (event) {
                var pair = this.axisPairFromEvent(event);
                if (!pair) return;
                this.eventInput.moveX = pair.x;
                this.eventInput.moveY = pair.y;
                this.eventInput.turnX = 0;
                this.eventInput.time = performance.now();
              }.bind(this));
            }.bind(this));
          }
        },

        axisPairFromEvent: function (event) {
          var detail = event.detail || {};

          if (typeof detail.x === "number" && typeof detail.y === "number") {
            return { x: detail.x, y: detail.y, strength: Math.sqrt(detail.x * detail.x + detail.y * detail.y) };
          }

          if (detail.axis && detail.axis.length >= 2) {
            return this.findPrimaryAxisPair(detail.axis);
          }

          if (detail.axes && detail.axes.length >= 2) {
            return this.findPrimaryAxisPair(detail.axes);
          }

          return null;
        },

        findPrimaryAxisPair: function (axes) {
          if (!axes || axes.length < 2) return null;

          var candidates = [];

          if (axes.length >= 4) {
            candidates.push({ x: axes[2] || 0, y: axes[3] || 0, priority: 2 });
          }

          candidates.push({ x: axes[0] || 0, y: axes[1] || 0, priority: 1 });

          for (var i = 0; i < axes.length - 1; i += 2) {
            candidates.push({ x: axes[i] || 0, y: axes[i + 1] || 0, priority: 0 });
          }

          var best = null;
          candidates.forEach(function (candidate) {
            var strength = Math.sqrt(candidate.x * candidate.x + candidate.y * candidate.y);
            candidate.strength = strength;

            if (strength <= this.data.deadzone) return;
            if (!best || candidate.priority > best.priority || strength > best.strength + 0.12) {
              best = candidate;
            }
          }.bind(this));

          return best;
        },

        findStrongestAxisPair: function (axes) {
          var best = null;

          for (var i = 0; i < axes.length - 1; i += 2) {
            var x = axes[i] || 0;
            var y = axes[i + 1] || 0;
            var strength = Math.sqrt(x * x + y * y);

            if (strength > this.data.deadzone && (!best || strength > best.strength)) {
              best = { x: x, y: y, strength: strength };
            }
          }

          return best;
        },

        applyDeadzone: function (value) {
          if (Math.abs(value) < this.data.deadzone) return 0;
          var sign = value < 0 ? -1 : 1;
          return sign * ((Math.abs(value) - this.data.deadzone) / (1 - this.data.deadzone));
        },

        moveRig: function (moveX, moveY, dt) {
          var yaw = this.getCameraYaw();
          var distance = this.data.speed * dt;
          var forwardAmount = -moveY;
          var rightAmount = -moveX;

          this.forward.set(Math.sin(yaw), 0, Math.cos(yaw));
          this.right.set(Math.cos(yaw), 0, -Math.sin(yaw));
          this.move.copy(this.forward).multiplyScalar(forwardAmount);
          this.move.addScaledVector(this.right, rightAmount);

          if (this.move.lengthSq() > 1) this.move.normalize();
          this.move.multiplyScalar(distance);
          this.el.object3D.position.add(this.move);
        },

        getCameraYaw: function () {
          if (!this.camera) return this.el.object3D.rotation.y;

          var direction = new THREE.Vector3();
          this.camera.object3D.getWorldDirection(direction);
          return Math.atan2(-direction.x, -direction.z);
        },
      });

        }
        if (readout) readout.setAttribute("value", "温度 35%｜偏低：点击风箱");
        if (holdReadout) holdReadout.setAttribute("value", "绿色温区 62-82%，保持 0.0/5 秒");

        if (stream) stream.setAttribute("visible", "false");
        addFurnaceGlow(furnace, 2.4, "#ff8a1c");
        createFurnaceEmbers(furnace, 32, 0.35);
        setStatus("控温融铁：绿色温区是 62-82%。温度下降更快，请适时点击风箱补温", "Temperature control: green zone is 62-82%. Heat falls faster now, click bellows to maintain it");
      }

      function updateHeatingProgress() {
        if (!heatingActive) return;

        var now = performance.now();
        var dt = Math.min((now - heatLastTick) / 1000, 0.08);
        heatLastTick = now;
        heatTemperature = Math.max(0, heatTemperature - 15 * dt);
        if (heatTemperature > heatMin && heatTemperature < heatMax) {
          heatHoldTime += dt;
        } else if (heatTemperature > heatMax + 8 || heatTemperature < heatMin - 10) {
          heatHoldTime = Math.max(0, heatHoldTime - 1.5 * dt);
        }

        var progress = Math.min(heatTemperature / 100, 1);
        var holdProgress = Math.min(heatHoldTime / 5, 1);
        var fill = document.querySelector("#heatingFill");
        var readout = document.querySelector("#temperatureReadout");
        var holdReadout = document.querySelector("#heatHoldReadout");
        var heatState = heatTemperature > heatMax ? "过热：暂停拉风箱" : heatTemperature >= heatMin ? "合适：保持节奏" : "偏低：点击风箱";
        var heatColor = heatTemperature > heatMax ? "#ff3b1f" : heatTemperature >= heatMin ? "#20d482" : "#ff9b26";
        if (fill) {
          fill.object3D.scale.x = Math.max(0.01, progress);
          fill.setAttribute("position", (-0.78 + progress * 0.76) + " 0 0.025");
          fill.setAttribute("color", heatColor);
        }
        if (readout) {
          readout.setAttribute("value", "温度 " + Math.round(heatTemperature) + "%｜" + heatState);
          readout.setAttribute("color", heatColor);
        }
        if (holdReadout) {
          holdReadout.setAttribute("value", "绿色温区 62-82%，保持 " + heatHoldTime.toFixed(1) + "/5 秒");
        }

        if (performance.now() - lastHeatingEmber > 260) {
          lastHeatingEmber = performance.now();
          createFurnaceEmbers(document.querySelector("#furnace"), 8 + Math.floor(progress * 12), 0.35 + progress * 0.65);
          addFurnaceGlow(document.querySelector("#furnace"), 2.4 + progress * 3.4, "#ff9b26");
          setStatus(
            "温度 " + Math.round(heatTemperature) + "%｜" + heatState + "｜稳定 " + heatHoldTime.toFixed(1) + "/5 秒",
            "Heat " + Math.round(heatTemperature) + "% | " + (heatTemperature > heatMax ? "Too hot" : heatTemperature >= heatMin ? "Good range" : "Too low") + " | Stable " + heatHoldTime.toFixed(1) + "/5 sec"
          );
        }

        if (heatHoldTime >= 5) completeHeating();
      }

      function completeHeating() {
        if (!heatingActive) return;
        heatingActive = false;
        moltenIronReady = true;
        var furnace = document.querySelector("#furnace");
        var stream = document.querySelector("#moltenStream");

        if (stream) stream.setAttribute("visible", "true");

          return;

      function buildRhythmLanes(count) {
        var lanes = document.querySelector("#rhythmLanes");
        if (!lanes) return;

        var spacing = rhythmMode === "performance" ? 0.82 : 0.62;
        var total = (count - 1) * spacing;
        for (var i = 0; i < count; i += 1) {
          var x = -total / 2 + i * spacing;
          var lane = document.createElement("a-entity");
          lane.setAttribute("position", x + " 1.85 0");
          var laneGuide = rhythmMode === "performance" ? "" : '<a-cylinder radius="0.018" height="2.5" rotation="0 0 0" color="#ffd37a" material="transparent: true; opacity: 0.34"></a-cylinder>';
          lane.innerHTML =
            laneGuide +
            '<a-sphere class="clickable rhythm-hit" rhythm-lane-hit="lane: ' + i + '" position="0 -1.05 0.04" radius="0.32" material="shader: flat; transparent: true; opacity: 0.14; depthWrite: false"></a-sphere>' +
            '<a-ring class="rhythm-judge-ring" data-lane-ring-index="' + i + '" position="0 -1.05 0.03" radius-inner="0.16" radius-outer="0.23" color="#ffbd42" material="transparent: true; opacity: 0.9; emissive: #ff8a00; emissiveIntensity: 0.65"></a-ring>' +
            '<a-sphere radius="0.018" position="0 -1.42 0.04" color="#ffe7b2" material="emissive: #ff8a00; emissiveIntensity: 0.55"></a-sphere>';
          lanes.appendChild(lane);
        }
        refreshPerformanceTitle();
      }

      function updateRhythmGame() {
        if (!rhythmActive) return;
        var now = performance.now();
        var config = rhythmMode === "practice" ? rhythmConfigs[rhythmLevel - 1] : performanceConfig;
        var elapsed = now - rhythmStart;
        var hud = document.querySelector("#rhythmHud");

        if (rhythmMode === "performance") {
          spawnReadyPerformanceNotes(config, now);
        } else if (now - rhythmLastSpawn > config.spawn) {
          rhythmLastSpawn = now;
          spawnRhythmNote(config);
        }

        rhythmNotes.slice().forEach(function (note) {
          updateRhythmNotePosition(note, now, config);
          if (isRhythmNoteMissed(note)) {
            note.el.remove();
            rhythmNotes.splice(rhythmNotes.indexOf(note), 1);
            registerRhythmMiss();
          }
        });

        if (hud) {
          var remaining = Math.max(0, Math.ceil((config.duration - elapsed) / 1000));
          if (rhythmMode === "practice") {
            hud.setAttribute("value", "Practice " + rhythmLevel + "/3   Time " + remaining + "   Miss " + rhythmMisses + "/3   Score " + rhythmScore);
          } else {
            hud.setAttribute(
              "value",
              "Performance   Time " + remaining + "   Score " + rhythmScore + "   Combo " + rhythmCombo + "   Miss " + rhythmMisses
            );
          }
        }

        if (rhythmMode === "practice" && rhythmMisses >= 3) {
          restartPracticeLevel();
          return;
        }

        if (elapsed >= config.duration && !rhythmEnded) {
          rhythmEnded = true;
          rhythmActive = false;
          if (rhythmMode === "performance") stopPersonAtRest();
          syncRankHudForVr();
          updateAudienceReaction();
          if (rhythmMode === "performance") showPerformanceEndPrompt();
        }
      }

      function spawnReadyPerformanceNotes(config, now) {
        var hasReadyThrower = false;
        var firstLane = rhythmFallbackLane % config.lanes;
        var candidateLane = -1;
        for (var index = 0; index < config.lanes; index += 1) {
          var lane = (firstLane + index) % config.lanes;
          var person = getPerformancePersonForLane(lane, config.lanes);
          var throwLoop = person && person.components && person.components["person-throw-loop"];
          if (throwLoop && throwLoop.ready && !throwLoop.stopped) hasReadyThrower = true;
          if (throwLoop && throwLoop.canReleaseThrow()) {
            candidateLane = lane;
            break;
          }
        }

        if (candidateLane >= 0 && canSpawnPerformanceNote(now)) {
          var candidatePerson = getPerformancePersonForLane(candidateLane, config.lanes);
          var candidateLoop = candidatePerson && candidatePerson.components && candidatePerson.components["person-throw-loop"];
          if (candidateLoop) candidateLoop.markThrowReleased();
          rhythmLastSpawn = now;
          spawnRhythmNote(config, candidateLane);
          rhythmFallbackLane = candidateLane + 1;
          return;
        }

        if (!hasReadyThrower && now - rhythmLastSpawn > Math.max(config.spawn, performanceSpawnGap)) {
          rhythmLastSpawn = now;
          spawnRhythmNote(config, firstLane);
          rhythmFallbackLane = firstLane + 1;
        }
      }

      function canSpawnPerformanceNote(now) {
        return now - rhythmLastSpawn >= performanceSpawnGap;
      }

      function choosePerformanceNoteDuration(now, baseDuration) {
        var nextArrival = now + baseDuration * 0.82;
        var nearestArrivalGap = rhythmNotes.reduce(function (nearest, note) {
          if (!note.arrivalTime) return nearest;
          return Math.min(nearest, Math.abs(note.arrivalTime - nextArrival));
        }, Infinity);
        var crowdingDelay = nearestArrivalGap < 180 ? 180 - nearestArrivalGap : 0;
        return baseDuration + crowdingDelay + Math.random() * 180;
      }

      function updateRhythmNotePosition(note, now, config) {
        if (note.curve) {
          var progress = Math.min((now - note.birth) / note.duration, 1.2);
          note.progress = progress;
          var clamped = Math.min(progress, 1);
          var pos = getThrowCurvePoint(note, clamped);
          note.x = pos.x;
          note.y = pos.y;
          note.z = pos.z;
          note.el.setAttribute("position", note.x + " " + note.y + " " + note.z);
          return;
        }
        note.y -= config.speed / 60;
        note.el.setAttribute("position", note.x + " " + note.y + " " + (note.z || 0.08));
      }

      function isRhythmNoteMissed(note) {
        if (note.curve) return note.progress >= 1;
        return note.y < 0.48;
      }

      function quadraticPoint(start, control, end, progress) {
        var inverse = 1 - progress;
        return new THREE.Vector3(
          inverse * inverse * start.x + 2 * inverse * progress * control.x + progress * progress * end.x,
          inverse * inverse * start.y + 2 * inverse * progress * control.y + progress * progress * end.y,
          inverse * inverse * start.z + 2 * inverse * progress * control.z + progress * progress * end.z
        );
      }

      function getThrowCurvePoint(note, progress) {
        if (progress <= 0.82) {
          return quadraticPoint(note.start, note.control, note.ringCenter, progress / 0.82);
        }
        return note.ringCenter.clone().lerp(note.end, (progress - 0.82) / 0.18);
      }

      function getPerformancePersonForLane(laneIndex, laneCount) {
        if (laneCount > 1 && laneIndex === 0) return document.querySelector("#personModelMirror");
        return document.querySelector("#personModel1");
      }

      function getRhythmRingCenter(laneIndex) {
        var ring = document.querySelector('.rhythm-hit[data-lane-index="' + laneIndex + '"]');
        var center = new THREE.Vector3(sceneStepX[currentSceneStep], 0.8, performanceRingZ);
        if (ring) ring.object3D.getWorldPosition(center);
        return center;
      }

      function getRhythmRingLocalCenter(laneIndex) {
        var notesRoot = document.querySelector("#rhythmNotes");
        var worldCenter = getRhythmRingCenter(laneIndex);
        if (notesRoot) return notesRoot.object3D.worldToLocal(worldCenter.clone());
        return new THREE.Vector3(0, 0.8, 0.03);
      }

      function getThrowStartLocalPosition(endLocal, laneIndex) {
        var notesRoot = document.querySelector("#rhythmNotes");
        var person = getPerformancePersonForLane(laneIndex, performanceConfig.lanes);
        var pose = person && person.querySelector("#personPoseThrow");
        var ringWorld = endLocal.clone();
        if (notesRoot) notesRoot.object3D.localToWorld(ringWorld);
        var startWorld = getSpoonLikeWorldPosition(pose, ringWorld, person);
        if (notesRoot) return notesRoot.object3D.worldToLocal(startWorld);
        return new THREE.Vector3(2.0, 1.6, -1.2);
      }

      function getSpoonLikeWorldPosition(pose, ringWorld, person) {
        if (pose && pose.components && pose.components["gltf-model"]) {
          var spoonBowlLocal = new THREE.Vector3(-0.62, 0.72, 0.03);
          return pose.object3D.localToWorld(spoonBowlLocal);
        }
        var fallback = new THREE.Vector3((sceneStepX[currentSceneStep] || 0) + 2.4, 1.35, performanceActorZ);
        if (person) {
          person.object3D.getWorldPosition(fallback);
          var direction = ringWorld.clone().sub(fallback);
          direction.y = 0;
          if (direction.lengthSq() > 0.001) direction.normalize();
          fallback.addScaledVector(direction, 0.7);
          fallback.y += 1.35;
        }
        return fallback;
      }

      function spawnRhythmNote(config, forcedLane) {
        var lanes = config.lanes;
        var lane = typeof forcedLane === "number" ? forcedLane : Math.floor(Math.random() * lanes);
        var spacing = rhythmMode === "performance" ? 0.82 : 0.62;
        var total = (lanes - 1) * spacing;
        var x = -total / 2 + lane * spacing;
        var note = document.createElement("a-entity");
        note.setAttribute("geometry", "primitive: sphere; radius: 0.075");
        note.setAttribute("material", "color: #fff4c1; emissive: #ff6a00; emissiveIntensity: 2.8; transparent: true; opacity: 1");
        document.querySelector("#rhythmNotes").appendChild(note);

        if (rhythmMode === "performance") {
          var ringCenter = getRhythmRingLocalCenter(lane);
          var end = ringCenter.clone();
          end.y -= 0.31;
          var start = getThrowStartLocalPosition(end, lane);
          var control = new THREE.Vector3(
            (start.x + ringCenter.x) / 2,
            Math.max(start.y, ringCenter.y) + 1.75,
            (start.z + ringCenter.z) / 2
          );
          var birth = performance.now();
          var duration = choosePerformanceNoteDuration(birth, 1200);
          note.setAttribute("position", start.x + " " + start.y + " " + start.z);
          rhythmNotes.push({
            el: note,
            lane: lane,
            x: start.x,
            y: start.y,
            z: start.z,
            curve: true,
            start: start,
            control: control,
            end: end,
            ringCenter: ringCenter,
            birth: birth,
            duration: duration,
            arrivalTime: birth + duration * 0.82,
          });
          return;
        }

        note.setAttribute("position", x + " 3.1 0.08");
        rhythmNotes.push({ el: note, lane: lane, x: x, y: 3.1, z: 0.08 });
      }

      function hitRhythmLane(laneIndex) {
        if (!rhythmActive) return;
        if (!consumeRhythmHit()) return;
        var targetY = 0.8;
        var noteRadius = 0.075;
        var ringOuterRadius = 0.23;
        var best = null;
        rhythmNotes.forEach(function (note) {
          if (note.lane !== laneIndex) return;
          var distance;
          if (note.curve) {
            var ringCenter = getRhythmRingLocalCenter(laneIndex);
            distance = Math.sqrt(Math.pow(note.x - ringCenter.x, 2) + Math.pow(note.y - ringCenter.y, 2));
            if (distance > ringOuterRadius + noteRadius) return;
          } else {
            distance = Math.abs(note.y - targetY);
            if (distance > 0.34) return;
          }
          if (!best || distance < best.distance) {
            best = { note: note, distance: distance };
          }
        });

        if (!best) {
          animateRhythmLaneFeedback(laneIndex, false);
          animateToolStrike();
          registerRhythmMiss();
          return;
        }

        var note = best.note;
        var hitResult = window.IronFlowerStory
          ? window.IronFlowerStory.resolveHitScore(best.distance)
          : getHitFeedbackTier(best.distance);
        animateToolStrike();
        rhythmNotes.splice(rhythmNotes.indexOf(note), 1);
        note.el.remove();
        rhythmCombo += 1;
        rhythmBestCombo = Math.max(rhythmBestCombo, rhythmCombo);
        rhythmScore += hitResult.points;
        animateRhythmLaneFeedback(laneIndex, true, hitResult.tier === "marvelous" ? 1 : hitResult.tier === "excellent" ? 0.5 : 0);
        var flashCenter = note.curve ? getRhythmRingCenter(laneIndex) : new THREE.Vector3(sceneStepX[currentSceneStep], 1.15, performanceRingZ);
        createFlash(
          document.querySelector("#fireworks"),
          flashCenter.x,
          flashCenter.y,
          flashCenter.z,
          hitResult.tier === "marvelous" ? 2.2 : hitResult.tier === "excellent" ? 1.6 : 1.2,
          hitResult.tier === "marvelous" ? 4 : hitResult.tier === "excellent" ? 3.2 : 2.6,
          hitResult.tier === "marvelous" ? 180 : 140
        );
        showRhythmFeedback(hitResult.label + " +" + hitResult.points, hitResult.color);
        updateRankPanel();
        if (window.IronflowerBhaptics) window.IronflowerBhaptics.triggerRhythmHaptic("performance");
        updateAudienceReaction();
      }

      function registerRhythmMiss() {
        if (!rhythmActive) return;
        rhythmMisses += 1;
        rhythmCombo = 0;
        rhythmScore = Math.max(0, rhythmScore - performanceScoring.missPenalty);
        showRhythmFeedback("MISS -" + performanceScoring.missPenalty, "#ff8a72");
        updateRankPanel();
        updateAudienceReaction();
      }

      function getHitFeedbackTier(distance) {
        if (window.IronFlowerStory && window.IronFlowerStory.resolveHitScore) {
          return window.IronFlowerStory.resolveHitScore(distance);
        }
        if (distance < 0.11) return { label: "MARVELOUS!", color: "#ffcfff", points: 150, tier: "marvelous" };
        if (distance < 0.2) return { label: "EXCELLENT!", color: "#c7ffd2", points: 100, tier: "excellent" };
        return { label: "GOOD", color: "#99ebff", points: 60, tier: "good" };
      }

      function showRhythmFeedback(label, color) {
        var fx = document.querySelector("#rhythmHitFx");
        var text3d = document.querySelector("#rhythmFeedback");
        if (fx) {
          fx.textContent = label;
          fx.style.color = color;
          fx.classList.remove("show");
          void fx.offsetWidth;
          fx.classList.add("show");
        }
        if (text3d) {
          text3d.setAttribute("value", label);
          text3d.setAttribute("color", color);
          text3d.setAttribute("visible", "true");
          setTimeout(function () {
            text3d.setAttribute("visible", "false");
          }, 520);
        }
      }

      function getRankTier() {
        var maxRef = performanceScoring.maxReferenceScore || 2400;
        var rapid = Math.min(100, Math.round((rhythmScore / maxRef) * 100));
        var high = performanceScoring.endingThresholds.high;
        var mid = performanceScoring.endingThresholds.mid;
        if (rhythmScore >= high + 400) return { grade: "EX", progress: rapid };
        if (rhythmScore >= high) return { grade: "SS", progress: rapid };
        if (rhythmScore >= mid + 300) return { grade: "S", progress: rapid };
        if (rhythmScore >= mid) return { grade: "A", progress: rapid };
        if (rhythmScore >= mid * 0.45) return { grade: "B", progress: rapid };
        return { grade: "C", progress: Math.max(8, rapid) };
      }

      AFRAME.registerComponent("spark-move", {
        schema: {
          vx: { default: 0 },
          vy: { default: 1 },
          vz: { default: 0 },
          gravity: { default: 0.045 },
          life: { default: 1000 },
          delay: { default: 0 },
          trail: { default: false },
        },

        init: function () {
          this.birth = performance.now();
          this.lastTrail = 0;
          this.startScale = this.el.object3D.scale.clone();
          if (this.data.delay > 0) {
            this.el.object3D.visible = false;
          }
        },

        tick: function () {
          var now = performance.now();
          var age = now - this.birth - this.data.delay;
          if (age < 0) return;
          this.el.object3D.visible = true;
          var progress = age / this.data.life;

          this.el.object3D.position.x += this.data.vx / 60;
          this.el.object3D.position.y += this.data.vy / 60;
          this.el.object3D.position.z += this.data.vz / 60;
          this.data.vy -= this.data.gravity;

          var fade = Math.max(0, 1 - progress);
          this.el.object3D.scale.copy(this.startScale).multiplyScalar(0.35 + fade * 0.95);
          this.el.setAttribute("material", "opacity", fade);

          if (this.data.trail && now - this.lastTrail > 42 && fade > 0.16) {
            this.lastTrail = now;
            createTrailDot(this.el.parentElement, this.el.object3D.position, fade);
          }

          if (progress >= 1 || this.el.object3D.position.y < 0) {
            this.el.remove();
          }
        },
      });

      function createTrailDot(root, position, fade) {
        if (!root) return;
        if (root.children.length > 650) return;
        var dot = document.createElement("a-entity");
        dot.setAttribute("geometry", "primitive: sphere; radius: 0.018");
        dot.setAttribute("position", position.x + " " + position.y + " " + position.z);
        dot.setAttribute("material", "color: #ffd06a; emissive: #ff5a14; emissiveIntensity: 1.8; transparent: true; opacity: " + Math.min(0.72, fade));
        dot.setAttribute("trail-fade", "");
        root.appendChild(dot);
      }

      AFRAME.registerComponent("trail-fade", {
        init: function () {
          this.birth = performance.now();
          this.startScale = this.el.object3D.scale.clone();
        },

        tick: function () {
          var progress = (performance.now() - this.birth) / 420;
          this.el.object3D.scale.copy(this.startScale).multiplyScalar(Math.max(0.05, 1 - progress));
          this.el.setAttribute("material", "opacity", Math.max(0, 0.72 * (1 - progress)));
          if (progress >= 1) this.el.remove();
        },
      });

      AFRAME.registerComponent("comet-flight", {
        schema: {
          toX: { default: 0 },
          toY: { default: 0 },
          toZ: { default: 0 },
          life: { default: 360 },
        },

        init: function () {
          this.birth = performance.now();
          this.from = this.el.object3D.position.clone();
          this.to = new THREE.Vector3(this.data.toX, this.data.toY, this.data.toZ);
        },

        tick: function () {
          var progress = Math.min((performance.now() - this.birth) / this.data.life, 1);
          var eased = 1 - Math.pow(1 - progress, 3);
          this.el.object3D.position.lerpVectors(this.from, this.to, eased);
          this.el.setAttribute("material", "opacity", 1 - progress * 0.25);
          createTrailDot(this.el.parentElement, this.el.object3D.position, 0.9);
          if (progress >= 1) this.el.remove();
        },
      });

      AFRAME.registerComponent("shock-ring", {
        init: function () {
          this.birth = performance.now();
        },

        tick: function () {
          var progress = (performance.now() - this.birth) / 680;
          var scale = 1 + progress * 9;
          this.el.object3D.scale.set(scale, scale, scale);
          this.el.setAttribute("material", "opacity", Math.max(0, 0.86 * (1 - progress)));
          if (progress >= 1) this.el.remove();
        },
      });

      AFRAME.registerComponent("flash-fade", {
        schema: {
          intensity: { default: 7 },
          life: { default: 450 },
        },

        init: function () {
          this.birth = performance.now();
        },

        tick: function () {
          var progress = (performance.now() - this.birth) / this.data.life;
          this.el.setAttribute("intensity", this.data.intensity * Math.max(0, 1 - progress));

          if (progress >= 1) {
            this.el.remove();
          }
        },
      });

      function randomFireColor() {
        var colors = ["#fff4c1", "#ffd06a", "#ff9d1e", "#ff5a14", "#db1f13"];
        return colors[Math.floor(Math.random() * colors.length)];
      }

      window.addEventListener("load", function () {
        var scene = document.querySelector("a-scene");
        var startButton = document.querySelector("#startButton");
        applySceneShell();
        document.querySelector("#langToggle").addEventListener("click", toggleLanguage);
        startButton.addEventListener("click", startGame);
        var practiceStartFallback = document.querySelector("#practiceStartFallback");
        if (practiceStartFallback) {
          practiceStartFallback.addEventListener("click", beginPerformanceRound);
        }
        var performanceEndFallback = document.querySelector("#performanceEndFallback");
        if (performanceEndFallback) {
          performanceEndFallback.addEventListener("click", goToPerformanceEnding);
        }
        document.addEventListener("keydown", function (event) {
          if (gameStarted) return;
          if (event.code === "Enter" || event.code === "Space") {
            event.preventDefault();
            startGame();
          }
        });
        applyLanguage();
        setInitialScenePreview();
        scene.addEventListener("loaded", function () {
          var sky = document.querySelector("#environmentSky");
          if (sky) sky.setAttribute("local-texture-sky", "src: #performancePanorama");
        });
        scene.setAttribute("manual-interaction", "");
        scene.setAttribute("heating-progress-loop", "");
        scene.addEventListener("enter-vr", function () {
          syncRankHudForVr(true);
          if (hasLadle) {
            moveShovelToHand();
            setStatus("已进入 VR：右手持铁锹，点击判定环表演", "VR mode active: shovel in right hand, hit rings to perform");
          } else if (rhythmActive || practiceWaiting) {
            setStatus("已进入 VR：点击工具站拿起铁锹，再点击判定环表演", "VR mode active: pick up the shovel, then hit the rings");
          } else {
            setStatus("已进入 VR：转头可看四周", "VR mode active: turn your head to look around");
          }
          if (hasLadle) setTimeout(moveShovelToHand, 120);
        });
        scene.addEventListener("exit-vr", function () {
          syncRankHudForVr(false);
          setStatus("已退出 VR：电脑可用鼠标环顾场景", "Exited VR: on desktop, use the mouse to look around");
          if (hasLadle) moveShovelToHand();
        });
        scene.addEventListener("loaded", function () {
          if (window.IronFlowerEntry) window.IronFlowerEntry.tryAutoEnterVr(scene);
        });
        document.querySelector("#furnaceHotspot").setAttribute("furnace-step", "");
        document.querySelector("#bellowsHotspot").setAttribute("bellows-step", "");
        document.querySelectorAll(".material-item").forEach(function (item) {
          item.setAttribute("material-choice", item.getAttribute("material-choice"));
        });
        document.querySelector("#ladle").setAttribute("pickable", "");
        document.querySelector("#strikeTarget").setAttribute("strike-target", "");
        document.querySelector("#languageSwitch").setAttribute("language-switch", "");
        startGame();
      });
    </script>
  </body>
</html>
