<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>铜官窑打铁花 VR 体验｜VR 版 · 模式选择</title>
    <script src="./js/app-entry.js?v=20260601-entry"></script>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="./js/pico-thumbstick-move.js?v=20260601-xyz"></script>
    <script src="./js/desktop-fly-controls.js?v=20260601-web"></script>
    <script src="./story-flow.js?v=20260601-cg-url"></script>
    <script src="./js/vr-ui.js?v=20260601-vr-menu-pico"></script>
    <script>
      AFRAME.registerComponent("local-texture-sky", {
        schema: { src: { type: "string", default: "" } },
        init: function () {
          this._texture = null;
          this.refreshSky = this.refreshSky.bind(this);
          this.el.sceneEl.addEventListener("loaded", this.refreshSky);
          if (this.el.sceneEl.hasLoaded) this.refreshSky();
        },
        update: function () {
          this.refreshSky();
        },
        remove: function () {
          if (this._texture) this._texture.dispose();
        },
        resolveSrc: function () {
          var src = (this.data.src || "").trim();
          if (!src) return "";
          if (src.charAt(0) !== "#") return src;
          var asset = document.querySelector(src);
          if (!asset) return "";
          return asset.getAttribute("src") || asset.src || "";
        },
        refreshSky: function () {
          var self = this;
          var src = (this.data.src || "").trim();
          var url = this.resolveSrc();
          if (!url) return;
          if (src.charAt(0) === "#") {
            var asset = document.querySelector(src);
            if (asset && (!asset.complete || !asset.naturalWidth)) {
              asset.addEventListener("load", function () {
                self.refreshSky();
              });
              return;
            }
          }
          var mesh = this.el.getObject3D("mesh");
          if (!mesh) {
            requestAnimationFrame(function () {
              self.refreshSky();
            });
            return;
          }
          if (this._texture) {
            this._texture.dispose();
            this._texture = null;
          }
          var loader = new THREE.TextureLoader();
          loader.setCrossOrigin(url.indexOf("http") === 0 ? "anonymous" : undefined);
          loader.load(
            url,
            function (texture) {
              texture.colorSpace = THREE.SRGBColorSpace;
              texture.mapping = THREE.EquirectangularReflectionMapping;
              texture.minFilter = THREE.LinearFilter;
              texture.magFilter = THREE.LinearFilter;
              texture.generateMipmaps = false;
              texture.needsUpdate = true;
              self._texture = texture;
              mesh.material = new THREE.MeshBasicMaterial({
                map: texture,
                side: THREE.BackSide,
                fog: false,
                toneMapped: false,
              });
              mesh.material.needsUpdate = true;
            },
            undefined,
            function (error) {
              console.warn("[local-texture-sky] failed to load:", url, error);
            }
          );
        },
      });
    </script>
    <style>
      :root {
        color-scheme: dark;
        --gold: #ffbd42;
        --gold-soft: #ffe0a1;
        --ink: #070402;
        --panel: rgba(16, 9, 5, 0.72);
        --line: rgba(255, 189, 66, 0.34);
        --cyan: #48d6d2;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--ink);
        color: #fff6df;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body:not(.vr-active) #menuScene {
        visibility: visible;
        z-index: 1;
      }

      body.vr-active .vr-fallback,
      body.vr-active .vr-enter-bar {
        opacity: 0;
        pointer-events: none;
      }

      body.vr-active #menuScene {
        visibility: visible;
        z-index: 3;
        pointer-events: auto;
      }

      .vr-fallback {
        position: fixed;
        left: 20px;
        top: 18px;
        z-index: 20;
        display: grid;
        gap: 8px;
        transition: opacity 320ms ease;
      }

      .vr-fallback .entry-badge {
        display: inline-block;
        width: fit-content;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255, 189, 66, 0.45);
        color: var(--gold);
        font-size: 12px;
        font-weight: 700;
      }

      .vr-fallback h1 {
        margin: 0;
        font-size: 22px;
        color: #fff2a8;
      }

      .vr-fallback p {
        margin: 0;
        max-width: 320px;
        color: rgba(255, 232, 176, 0.86);
        font-size: 13px;
        line-height: 1.5;
      }

      .switch-entry {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        padding: 8px 14px;
        border: 1px solid rgba(72, 214, 210, 0.45);
        border-radius: 999px;
        background: rgba(6, 4, 3, 0.72);
        color: #cfeef2;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }

      .vr-enter-bar {
        position: fixed;
        left: 50%;
        bottom: 22px;
        z-index: 30;
        transform: translateX(-50%);
        display: grid;
        gap: 8px;
        justify-items: center;
        transition: opacity 320ms ease;
      }

      .vr-enter-bar button {
        min-width: 220px;
        padding: 12px 24px;
        border: 1px solid rgba(255, 224, 161, 0.72);
        border-radius: 999px;
        background: rgba(255, 189, 66, 0.24);
        color: #fff8ce;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
      }

      .vr-enter-bar p {
        margin: 0;
        max-width: min(520px, calc(100vw - 40px));
        color: #ffd27a;
        font-size: 13px;
        text-align: center;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85);
      }

      .vr-enter-bar button.is-hidden {
        display: none;
      }

      #menuScene {
        position: fixed;
        inset: 0;
        z-index: 1;
      }
    </style>
  </head>

  <body>
    <a-scene
      id="menuScene"
      embedded
      renderer="antialias: true; colorManagement: true; alpha: false"
      xr-mode-ui="enabled: true"
      device-orientation-permission-ui="enabled: true"
      loading-screen="enabled: false"
      home-vr-menu="debounceMs: 280"
    >
      <a-assets>
        <img id="menuSky" crossorigin="anonymous" src="./assets/backgrounds/start.png" />
      </a-assets>
      <a-sky
        id="menuSkySphere"
        radius="500"
        local-texture-sky="src: #menuSky"
        rotation="0 -90 0"
      ></a-sky>
      <a-light type="ambient" color="#ffffff" intensity="0.95"></a-light>

      <a-entity id="menuRig" position="0 1.6 0">
        <a-camera
          id="menuCamera"
          look-controls="enabled: true; magicWindowTrackingEnabled: true; pointerLockEnabled: false; mouseEnabled: true"
          wasd-controls="enabled: false"
        >
          <a-cursor
            id="menuCursor"
            raycaster="objects: #menuFrame .clickable; far: 8"
            cursor="fuse: false"
            visible="false"
            material="color: #ffd37a; shader: flat; opacity: 0.9"
            geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.019"
          ></a-cursor>
        </a-camera>

        <a-entity
          id="menuFrame"
          visible="false"
          position="0 -0.02 -3.35"
          vr-panel-face-user="anchor: #menuCamera; offsetY: -0.02; offsetZ: -3.35; follow: true"
        >
          <a-entity
            id="menuPanelBg"
            position="0 0 0"
            canvas-mode-panel="width: 1.58; height: 2.24"
          ></a-entity>

          <a-entity
            id="menuStoryBtn"
            class="clickable"
            position="0 0.72 0.05"
            canvas-button="variant: story; label: 故事模式; labelEn: Story Mode; sublabel: 先读故事，再依次进入素材、练习与表演; sublabelEn: Read the story, then materials, practice and show; href: ./story-image.html?story=1&amp;step=start-2&amp;vr=1; width: 1.52; height: 0.46; background: rgba(255, 189, 66, 0.18); border: rgba(255, 224, 161, 0.48)"
          ></a-entity>

          <a-entity
            id="menuLevel1Btn"
            class="clickable"
            position="0 0.24 0.05"
            canvas-button="variant: level; index: 1; label: 准备素材的场景; labelEn: Material Prep; sublabel: 选择材料、入炉、控温融铁; sublabelEn: Select materials, load furnace, melt iron; href: ./scene-materials.html?mode=level&amp;vr=1; width: 1.52; height: 0.40; background: rgba(6, 4, 3, 0.5); border: rgba(255, 189, 66, 0.25)"
          ></a-entity>

          <a-entity
            id="menuLevel2Btn"
            class="clickable"
            position="0 -0.20 0.05"
            canvas-button="variant: level; index: 2; label: 练习场景; labelEn: Practice; sublabel: 完成四关节奏练习; sublabelEn: Complete four rhythm levels; href: ./scene-practice.html?mode=level&amp;vr=1; width: 1.52; height: 0.40; background: rgba(6, 4, 3, 0.5); border: rgba(255, 189, 66, 0.25)"
          ></a-entity>

          <a-entity
            id="menuLevel3Btn"
            class="clickable"
            position="0 -0.64 0.05"
            canvas-button="variant: level; index: 3; label: 表演材料准备; labelEn: Show Material Prep; sublabel: 选材料、拉风箱、取铁水; sublabelEn: Select materials, pull bellows, extract iron; href: ./scene-prepare-performance.html?mode=level&amp;vr=1; width: 1.52; height: 0.40; background: rgba(6, 4, 3, 0.5); border: rgba(255, 189, 66, 0.25)"
          ></a-entity>

          <a-entity
            id="menuLevel4Btn"
            class="clickable"
            position="0 -1.08 0.05"
            canvas-button="variant: level; index: 4; label: 表演场景; labelEn: Performance; sublabel: 正式表演并获观众反馈; sublabelEn: Final show with audience feedback; href: ./scene-performance.html?mode=level&amp;vr=1; width: 1.52; height: 0.40; background: rgba(6, 4, 3, 0.5); border: rgba(255, 189, 66, 0.25)"
          ></a-entity>

          <a-entity
            id="menuWebSwitchBtn"
            class="clickable"
            position="0 -1.52 0.05"
            canvas-button="label: 切换到 Web 版本; labelEn: Switch to Web; href: ./iron-web.html; width: 1.52; height: 0.28; background: rgba(6, 4, 3, 0.72); border: rgba(72, 214, 210, 0.45); color: #cfeef2"
          ></a-entity>

          <a-entity
            id="menuLegacyBtn"
            class="clickable"
            position="0 -1.86 0.05"
            canvas-button="label: 查看旧版本; labelEn: Legacy Version; href: ./iron_v0.1.html; width: 1.52; height: 0.24; background: rgba(0, 0, 0, 0); border: rgba(216, 238, 248, 0.35); color: #d8eef8"
          ></a-entity>
        </a-entity>

        <a-entity
          id="leftHand"
          laser-controls="hand: left"
          raycaster="objects: #menuFrame .clickable; far: 14; interval: 0; showLine: true"
          cursor="rayOrigin: entity; fuse: false"
          line="color: #2bd4ff; opacity: 0.55"
        >
          <a-entity
            class="home-hand-cursor"
            visible="false"
            position="0 0 -1"
            geometry="primitive: ring; radiusInner: 0.009; radiusOuter: 0.018"
            material="color: #ffd37a; shader: flat; opacity: 0.95"
          ></a-entity>
        </a-entity>
        <a-entity
          id="rightHand"
          laser-controls="hand: right"
          raycaster="objects: #menuFrame .clickable; far: 14; interval: 0; showLine: true"
          cursor="rayOrigin: entity; fuse: false"
          line="color: #ffb13d; opacity: 0.85"
        >
          <a-entity
            class="home-hand-cursor"
            visible="false"
            position="0 0 -1"
            geometry="primitive: ring; radiusInner: 0.009; radiusOuter: 0.018"
            material="color: #ffd37a; shader: flat; opacity: 0.95"
          ></a-entity>
        </a-entity>
      </a-entity>
    </a-scene>

    <div class="vr-fallback">
      <span class="entry-badge">VR 头显版</span>
      <h1>Iron Soul VR</h1>
      <p>全景可环顾；选单始终保持在主视角前方约 3.3 米。Pico 手柄射线对准选项会高亮，按扳机进入。</p>
      <a class="switch-entry" href="./iron-web.html">← 切换到 Web 版本</a>
    </div>

    <div class="vr-enter-bar">
      <button id="enterVrBtn" type="button">进入 VR 选择模式</button>
      <p id="vrHint">点击按钮进入 VR；若已在头显浏览器中打开，将自动进入沉浸式模式。</p>
    </div>

    <script>
      window.IronFlowerEntry.markVr();

      function syncHomeVrUiState(scene) {
        var inVr = scene && scene.is && scene.is("vr-mode");
        document.body.classList.toggle("vr-active", !!inVr);
        var enterVrBtn = document.getElementById("enterVrBtn");
        if (enterVrBtn) enterVrBtn.classList.toggle("is-hidden", !!inVr);
      }

      function tryEnterVr(scene) {
        if (!scene || !scene.enterVR) return;
        scene.enterVR().catch(function () {
          syncHomeVrUiState(scene);
        });
      }

      window.addEventListener("load", function () {
        var scene = document.querySelector("#menuScene");
        var enterVrBtn = document.getElementById("enterVrBtn");

        syncHomeVrUiState(scene);

        enterVrBtn.addEventListener("click", function () {
          tryEnterVr(scene);
        });

        scene.addEventListener("loaded", function () {
          syncHomeVrUiState(scene);
          var menuRig = document.querySelector("#menuRig");
          if (menuRig) {
            menuRig.setAttribute("pico-thumbstick-move", "speed: 1.8; turnSpeed: 90; verticalSpeed: 1.2");
            menuRig.setAttribute("desktop-fly-controls", "speed: 2.4; verticalSpeed: 1.8");
          }
          setTimeout(function () {
            tryEnterVr(scene);
          }, 420);
        });

        scene.addEventListener("enter-vr", function () {
          syncHomeVrUiState(scene);
          var menuCursor = document.querySelector("#menuCursor");
          var homeMenu = scene.components && scene.components["home-vr-menu"];
          if (homeMenu && homeMenu.showMenuFrame) {
            homeMenu.showMenuFrame();
          } else {
            var menuFrame = document.querySelector("#menuFrame");
            if (menuFrame) {
              menuFrame.setAttribute("visible", "true");
              menuFrame.object3D.visible = true;
              if (menuFrame.components && menuFrame.components["vr-panel-face-user"]) {
                menuFrame.components["vr-panel-face-user"].syncPanel();
              }
            }
          }
          if (menuCursor) menuCursor.setAttribute("visible", "true");
          window.setTimeout(function () {
            if (homeMenu && homeMenu.showMenuFrame) homeMenu.showMenuFrame();
            if (homeMenu && homeMenu.refreshRaycasters) homeMenu.refreshRaycasters();
          }, 240);
        });

        scene.addEventListener("exit-vr", function () {
          syncHomeVrUiState(scene);
          var menuFrame = document.querySelector("#menuFrame");
          var menuCursor = document.querySelector("#menuCursor");
          if (menuFrame) menuFrame.setAttribute("visible", "false");
          if (menuCursor) menuCursor.setAttribute("visible", "false");
        });

        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) syncHomeVrUiState(scene);
        });
      });
    </script>
  </body>
</html>
